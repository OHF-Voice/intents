language: ko
responses:
  intents:
    HassGetState:
      # the number of names returned is limited to 4, in case there are more, the first 3 names and the remaining count is returned
      # with 4 names or less, the names are joined with a comma ", " and the last name is joined with " and "

      one: "{{ slots.name }}의 상태는 {{ state.state_with_unit }}입니다"

      one_yesno: |
        {% if query.matched %}
          네
        {% else %}
          아니요, {{ slots.name }}의 상태는 {{ state.state }}입니다
        {% endif %}

      # Names are said without a particle, as speech does ("거실 조명 켜져 있습니다"):
      # 이/가 would depend on the name's last syllable. More than four: the first
      # three and how many more. Several: joined with 하고.
      any: |
        {% set yes = {
          'on': '켜져 있습니다', 'off': '꺼져 있습니다', 'open': '열려 있습니다', 'closed': '닫혀 있습니다',
          'opening': '열리는 중입니다', 'closing': '닫히는 중입니다', 'locked': '잠겨 있습니다',
          'unlocked': '잠금 해제되어 있습니다'
        } %}
        {% set no = {
          'on': '켜져 있지 않습니다', 'off': '꺼져 있지 않습니다', 'open': '열려 있지 않습니다',
          'closed': '닫혀 있지 않습니다', 'opening': '열리는 중이 아닙니다', 'closing': '닫히는 중이 아닙니다',
          'locked': '잠겨 있지 않습니다', 'unlocked': '잠금 해제되어 있지 않습니다'
        } %}
        {% set being = {
          'on': '켜져 있는', 'off': '꺼져 있는', 'open': '열려 있는', 'closed': '닫혀 있는', 'opening': '열리는 중인',
          'closing': '닫히는 중인', 'locked': '잠겨 있는', 'unlocked': '잠금 해제된'
        } %}
        {% set is_ = yes.get(slots.state, '그렇습니다') %}
        {% set is_not = no.get(slots.state, '그렇지 않습니다') %}
        {% if query.matched %}
          {% set names = query.matched | map(attribute="name") | sort | list %}
          네, {% if names | length > 4 %}{{ names[:3] | join(", ") }} 외 {{ names | length - 3 }}개가{% elif names | length > 1 %}{{ names[:-1] | join(", ") }}하고 {{ names[-1] }}{% else %}{{ names | first }}{% endif %} {{ is_ }}
        {% else %}
          아니요
        {% endif %}

      all: |
        {% set yes = {
          'on': '켜져 있습니다', 'off': '꺼져 있습니다', 'open': '열려 있습니다', 'closed': '닫혀 있습니다',
          'opening': '열리는 중입니다', 'closing': '닫히는 중입니다', 'locked': '잠겨 있습니다',
          'unlocked': '잠금 해제되어 있습니다'
        } %}
        {% set no = {
          'on': '켜져 있지 않습니다', 'off': '꺼져 있지 않습니다', 'open': '열려 있지 않습니다',
          'closed': '닫혀 있지 않습니다', 'opening': '열리는 중이 아닙니다', 'closing': '닫히는 중이 아닙니다',
          'locked': '잠겨 있지 않습니다', 'unlocked': '잠금 해제되어 있지 않습니다'
        } %}
        {% set being = {
          'on': '켜져 있는', 'off': '꺼져 있는', 'open': '열려 있는', 'closed': '닫혀 있는', 'opening': '열리는 중인',
          'closing': '닫히는 중인', 'locked': '잠겨 있는', 'unlocked': '잠금 해제된'
        } %}
        {% set is_ = yes.get(slots.state, '그렇습니다') %}
        {% set is_not = no.get(slots.state, '그렇지 않습니다') %}
        {% if not query.unmatched %}
          네
        {% else %}
          {% set names = query.unmatched | map(attribute="name") | sort | list %}
          아니요, {% if names | length > 4 %}{{ names[:3] | join(", ") }} 외 {{ names | length - 3 }}개가{% elif names | length > 1 %}{{ names[:-1] | join(", ") }}하고 {{ names[-1] }}{% else %}{{ names | first }}{% endif %} {{ is_not }}
        {% endif %}

      which: |
        {% set yes = {
          'on': '켜져 있습니다', 'off': '꺼져 있습니다', 'open': '열려 있습니다', 'closed': '닫혀 있습니다',
          'opening': '열리는 중입니다', 'closing': '닫히는 중입니다', 'locked': '잠겨 있습니다',
          'unlocked': '잠금 해제되어 있습니다'
        } %}
        {% set no = {
          'on': '켜져 있지 않습니다', 'off': '꺼져 있지 않습니다', 'open': '열려 있지 않습니다',
          'closed': '닫혀 있지 않습니다', 'opening': '열리는 중이 아닙니다', 'closing': '닫히는 중이 아닙니다',
          'locked': '잠겨 있지 않습니다', 'unlocked': '잠금 해제되어 있지 않습니다'
        } %}
        {% set being = {
          'on': '켜져 있는', 'off': '꺼져 있는', 'open': '열려 있는', 'closed': '닫혀 있는', 'opening': '열리는 중인',
          'closing': '닫히는 중인', 'locked': '잠겨 있는', 'unlocked': '잠금 해제된'
        } %}
        {% set is_ = yes.get(slots.state, '그렇습니다') %}
        {% set is_not = no.get(slots.state, '그렇지 않습니다') %}
        {% if not query.matched %}
          {{ being.get(slots.state, '그런') }} 기기가 없습니다
        {% else %}
          {% set names = query.matched | map(attribute="name") | sort | list %}
          {% if names | length > 4 %}{{ names[:3] | join(", ") }} 외 {{ names | length - 3 }}개가{% elif names | length > 1 %}{{ names[:-1] | join(", ") }}하고 {{ names[-1] }}{% else %}{{ names | first }}{% endif %} {{ is_ }}
        {% endif %}

      how_many: |
        {% set yes = {
          'on': '켜져 있습니다', 'off': '꺼져 있습니다', 'open': '열려 있습니다', 'closed': '닫혀 있습니다',
          'opening': '열리는 중입니다', 'closing': '닫히는 중입니다', 'locked': '잠겨 있습니다',
          'unlocked': '잠금 해제되어 있습니다'
        } %}
        {% set no = {
          'on': '켜져 있지 않습니다', 'off': '꺼져 있지 않습니다', 'open': '열려 있지 않습니다',
          'closed': '닫혀 있지 않습니다', 'opening': '열리는 중이 아닙니다', 'closing': '닫히는 중이 아닙니다',
          'locked': '잠겨 있지 않습니다', 'unlocked': '잠금 해제되어 있지 않습니다'
        } %}
        {% set being = {
          'on': '켜져 있는', 'off': '꺼져 있는', 'open': '열려 있는', 'closed': '닫혀 있는', 'opening': '열리는 중인',
          'closing': '닫히는 중인', 'locked': '잠겨 있는', 'unlocked': '잠금 해제된'
        } %}
        {% set is_ = yes.get(slots.state, '그렇습니다') %}
        {% set is_not = no.get(slots.state, '그렇지 않습니다') %}
        {{ query.matched | length }}개가 {{ is_ }}
