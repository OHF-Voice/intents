language: ko
responses:
  intents:
    HassCancelAllTimers:
      default: >
        {% if slots.canceled < 1: %}
        취소된 타이머가 없습니다.
        {% elif slots.canceled == 1: %}
        타이머 1개를 취소했습니다.
        {% else: %}
        타이머 {{ slots.canceled }}개를 취소했습니다.
        {% endif %}
      area: >
        {% if slots.canceled < 1: %}
        {{ slots.area }}에서 취소된 타이머가 없습니다.
        {% elif slots.canceled == 1: %}
        {{ slots.area }}의 타이머 1개를 취소했습니다.
        {% else: %}
        {{ slots.area }}의 타이머 {{ slots.canceled }}개를 취소했습니다.
        {% endif %}
