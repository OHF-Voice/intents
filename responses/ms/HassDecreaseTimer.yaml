language: ms
responses:
  intents:
    HassDecreaseTimer:
      default: >
        {% set h = slots.hours if slots.hours is defined else none %}
        {% set m = slots.minutes if slots.minutes is defined else none %}
        {% set s = slots.seconds if slots.seconds is defined else none %}
        {% set h_text = (h ~ ' jam') if h else '' %}
        {% set m_text = ((30 if m in ['setengah', 'separuh'] else m) ~ ' minit') if m else '' %}
        {% set s_text = ((30 if s in ['setengah', 'separuh'] else s) ~ ' saat') if s else '' %}
        {% set text_list = [h_text, m_text, s_text] | select() | list %}
        {% set text = text_list[:-1] | join(', ') ~ ' dan ' ~ text_list[-1] if text_list | count > 1 else text_list | join('') %}
        {% set name = (' ' ~ slots.name | trim) if slots.name is defined else '' %}
        {{ text }} ditolak daripada pemasa{{ name }}
