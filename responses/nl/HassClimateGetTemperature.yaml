language: nl
responses:
  intents:
    HassClimateGetTemperature:
      default: >
        {% set current_temperature = state_attr(state.entity_id, 'current_temperature') %}
        {% set temperature = state.state if current_temperature is none else current_temperature %}
        {% if temperature == 1: %}
          {{ temperature }} graad
        {% else: %}
          {{ temperature }} graden
        {% endif %}
      target_temperature: >
        {% set temperature = state_attr(state.entity_id, 'temperature') %}
        {% if temperature is none: %}
          Er is geen temperatuur ingesteld
        {% elif temperature == 1: %}
          {{ temperature }} graad
        {% else: %}
          {{ temperature }} graden
        {% endif %}
