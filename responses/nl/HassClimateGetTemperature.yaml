language: nl
responses:
  intents:
    HassClimateGetTemperature:
      default: >
        {% set current_temperature = state_attr(state.entity_id, 'current_temperature') %}
        {% set temperature = (state.state if current_temperature is none else current_temperature) | float(none) %}
        {% if temperature is none: %}
          De temperatuur is niet beschikbaar
        {% else: %}
          {% set temperature = temperature | round(1) %}
          {% set temperature = temperature | int if temperature == temperature | int else temperature | string | replace('.', ',') %}
          {{ temperature }} {{ 'graad' if temperature == 1 else 'graden' }}
        {% endif %}
      target_temperature: >
        {% set temperature = state_attr(state.entity_id, 'temperature') | float(none) %}
        {% if temperature is none: %}
          Er is geen temperatuur ingesteld
        {% else: %}
          {% set temperature = temperature | round(1) %}
          {% set temperature = temperature | int if temperature == temperature | int else temperature | string | replace('.', ',') %}
          {{ temperature }} {{ 'graad' if temperature == 1 else 'graden' }}
        {% endif %}
