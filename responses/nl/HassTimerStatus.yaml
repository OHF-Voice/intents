---
language: nl
responses:
  intents:
    HassTimerStatus:
      default: |
        {% set num_timers = slots.timers | length %}
        {% set active_timers = slots.timers | selectattr('is_active') | list %}
        {% set num_active_timers = active_timers | length %}
        {% set paused_timers = slots.timers | rejectattr('is_active') | list %}
        {% set num_paused_timers = paused_timers | length %}
        {% set next_timer = None %}

        {% if num_timers == 0: %}
          Geen timers.
        {% elif num_active_timers == 0: %}
          {# No active timers #}
          {% if num_paused_timers == 1: %}
            {% set next_timer = paused_timers[0] %}
            Timer is gepauzeerd.
          {% else: %}
            {{ num_paused_timers }} gepauzeerde timers.
          {% endif %}
        {% else: %}
          {# At least one active timer #}
          {% if num_active_timers == 1: %}
            {% set next_timer = active_timers[0] %}
          {% else: %}
            {# Get active timer that will finish soonest #}
            {% set sorted_timers = active_timers | sort(attribute='total_seconds_left') %}
            {% set next_timer = sorted_timers[0] %}
            {{ num_active_timers }} actieve timers.
          {% endif %}

          {% if num_paused_timers == 1: %}
            1 gepauzeerde timer.
          {% elif num_paused_timers > 0: %}
            {{ num_paused_timers }} gepauzeerde timers.
          {% endif %}
        {% endif %}

        {% if next_timer: %}
          {# At least one active timer #}
          {% set hl = next_timer.rounded_hours_left %}
          {% set ml = next_timer.rounded_minutes_left %}
          {% set sl = next_timer.rounded_seconds_left %}
          {% if (hl > 0) and (ml > 0): %}
            {{ hl }} uur en {{ ml }} {{ 'minuut' if ml == 1 else 'minuten' }}
          {% elif (hl > 0): %}
            {{ hl }} uur
          {% elif (ml > 0) and (sl > 0): %}
            {{ ml }} {{ 'minuut' if ml == 1 else 'minuten' }} en {{ sl }} {{ 'seconde' if sl == 1 else 'seconden' }}
          {% elif (ml > 0): %}
            {{ ml }} {{ 'minuut' if ml == 1 else 'minuten' }}
          {% elif (sl > 0): %}
            {{ sl }} {{ 'seconde' if sl == 1 else 'seconden' }}
          {% endif %}

          {% if num_timers > 1: %}
            {# Give some extra information to disambiguate #}
            over op de
            {% if next_timer.name: %}
              {{ next_timer.name }} timer
            {% elif next_timer.area: %}
              {{ next_timer.area }} timer
            {% else: %}
              timer
            {% endif %}

            {% set sh = next_timer.start_hours %}
            {% set sm = next_timer.start_minutes %}
            {% set ss = next_timer.start_seconds %}
            {% if (sh > 0) and (sm > 0): %}
              van {{ sh }} uur en {{ sm }} {{ 'minuut' if sm == 1 else 'minuten' }}.
            {% elif (sh > 0): %}
              van {{ sh }} uur.
            {% elif (sm > 0) and (ss > 0): %}
              van {{ sm }} {{ 'minuut' if sm == 1 else 'minuten' }} en {{ ss }} {{ 'seconde' if ss == 1 else 'seconden' }}.
            {% elif (sm > 0): %}
              van {{ sm }} {{ 'minuut' if sm == 1 else 'minuten' }}.
            {% elif (ss > 0): %}
              van {{ ss }} {{ 'seconde' if ss == 1 else 'seconden' }}.
            {% else: %}
              .
            {% endif %}
          {% else: %}
            resterend.
          {% endif %}
        {% endif %}
