language: ne
responses:
  intents:
    HassGetWeather:
      default: >
        {% set weather_condition = {
          'clear': 'र सफा',
          'clear-night': 'र सफा',
          'cloudy': 'र बदली',
          'exceptional': 'र असामान्य',
          'fog': 'कुहिरो लागेको',
          'hail': 'असिना परिरहेको',
          'lightning': 'चट्याङ परिरहेको',
          'lightning-rainy': 'चट्याङ र पानी परिरहेको',
          'partlycloudy': 'र आंशिक बदली',
          'pouring': 'र मुसलधारे पानी परिरहेको',
          'rainy': 'र पानी परिरहेको',
          'snowy': 'र हिउँ परिरहेको',
          'snowy-rainy': 'हिउँ र पानी परिरहेको',
          'sunny': 'र घमाइलो',
          'windy': 'र हावा चलेको',
          'windy-variant': 'हावा र बादल लागेको'
        } %}
        {{ state.attributes.get('temperature') }} {{ state.attributes.get('temperature_unit') }} {{ weather_condition.get((state.state | string).lower(), "") }}
