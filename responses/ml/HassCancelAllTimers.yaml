language: ml
responses:
  intents:
    HassCancelAllTimers:
      default: >
        {% if slots.canceled < 1: %}
        ഒരു നേരക്കരുവിയും റദ്ദാക്കിയില്ല.
        {% elif slots.canceled == 1: %}
        1 നേരക്കരുവി റദ്ദാക്കി.
        {% else: %}
        {{ slots.canceled }} നേരക്കരുവികൾ റദ്ദാക്കി.
        {% endif %}
      area: >
        {% if slots.canceled < 1: %}
        {{ slots.area }}യിൽ ഒരു നേരക്കരുവിയും റദ്ദാക്കിയില്ല.
        {% elif slots.canceled == 1: %}
        {{ slots.area }}യിൽ 1 നേരക്കരുവി റദ്ദാക്കി.
        {% else: %}
        {{ slots.area }}യിൽ {{ slots.canceled }} നേരക്കരുവികൾ റദ്ദാക്കി.
        {% endif %}
