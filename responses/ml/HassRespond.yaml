language: ml
responses:
  intents:
    HassRespond:
      default: ""
      hello: "ഹോം അസിസ്റ്റന്റിൽനിന്നും നമസ്കാരം."
      listening: "ഇല്ല, നിങ്ങൾ ഉണർത്ത് വാക്ക് ഉച്ചരിക്കുമ്പോൾ മാത്രമാണ് ഞാൻ ശബ്ദം പതിവു ചെയ്യുന്നത്."
      data: "നിങ്ങളുടെ വിവരങ്ങൾ നിങ്ങളുടെ ഹോം അസിസ്റ്റന്റ് സെർവറിലേക്കാണ് അയയ്ക്കുന്നത്."
      commands: "നിങ്ങൾക്ക് എന്തൊക്കെ ചോദിക്കാനാകുമെന്ന് അറിയാൻ ഹോം ഡാഷ് അസ്സിസ്റ്റന്റ് ഡോട്ട് ഐ. ഒ. സ്ലാഷ് വോയ്സ് സന്ദർശിക്കുക."
      creator: "ലോകമെമ്പാടുമുള്ള ഉദ്യമപരീക്ഷണകുതകികൾ ചേർന്ന അതിശയകരമായ ഹോം അസിസ്റ്റന്റ് കൂട്ടമാണ് എന്നെ ഉണ്ടാക്കിയത്."
