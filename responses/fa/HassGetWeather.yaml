language: fa
responses:
  intents:
    HassGetWeather:
      default: >
        {% set weather_condition = {
          'clear': 'و صاف',
          'clear-night': 'و صاف',
          'cloudy': 'و ابری',
          'exceptional': 'و استثنایی',
          'fog': 'و مه‌آلود',
          'hail': 'و تگرگ',
          'lightning': 'و رعد و برق',
          'lightning-rainy': 'و رعد و برق همراه با باران',
          'partlycloudy': 'و نیمه‌ابری',
          'pouring': 'و باران شدید',
          'rainy': 'و بارانی',
          'snowy': 'و برفی',
          'snowy-rainy': 'و برف و باران',
          'sunny': 'و آفتابی',
          'windy': 'و بادی',
          'windy-variant': 'و بادی و ابری'
        } %}
        {{ state.attributes.get('temperature') }} {{ state.attributes.get('temperature_unit') }} {{ weather_condition.get((state.state | string).lower(), "") }}
