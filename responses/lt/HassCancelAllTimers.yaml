language: lt
responses:
  intents:
    HassCancelAllTimers:
      default: >
        {% if slots.canceled < 1: %}
        Nė vienas laikmatis neatšauktas.
        {% elif slots.canceled == 1: %}
        Atšauktas 1 laikmatis.
        {% else: %}
        Atšaukti {{ slots.canceled }} laikmačiai.
        {% endif %}
      area: >
        {% if slots.canceled < 1: %}
        Nė vienas laikmatis neatšauktas {{ slots.area }}.
        {% elif slots.canceled == 1: %}
        Atšauktas 1 laikmatis {{ slots.area }}.
        {% else: %}
        Atšaukti {{ slots.canceled }} laikmačiai {{ slots.area }}.
        {% endif %}
