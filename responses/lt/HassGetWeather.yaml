language: "lt"
responses:
  intents:
    HassGetWeather:
      default: >
        {% set weather_condition = {
          'clear': 'ir giedra',
          'clear-night': 'ir giedra',
          'cloudy': 'ir debesuota',
          'exceptional': 'ir neįprasta',
          'fog': 'su rūku',
          'hail': 'su kruša',
          'lightning': 'su žaibais',
          'lightning-rainy': 'su žaibais ir lietumi',
          'partlycloudy': 'ir mažai debesuota',
          'pouring': 'ir pliaupia lietus',
          'rainy': 'ir lyja',
          'snowy': 'ir sninga',
          'snowy-rainy': 'su sniegu ir lietumi',
          'sunny': 'ir saulėta',
          'windy': 'ir vėjuota',
          'windy-variant': 'su vėju ir debesimis'
        } %}
        {{ state.attributes.get('temperature') }} {{ state.attributes.get('temperature_unit') }} {{ weather_condition.get((state.state | string).lower(), "") }}
