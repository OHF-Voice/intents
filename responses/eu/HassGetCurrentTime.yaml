language: eu
responses:
  intents:
    HassGetCurrentTime:
      # Ordua eta minutua zeroz beteta, TTS-k zuzen irakur dezan (de, fr eta it-ek
      # darabilten irizpidea: "1:02" oker irakur daiteke, "01:02" ez).
      default: >
        {% set hour_str = '{0:02d}'.format(slots.time.hour) %}
        {% set minute_str = '{0:02d}'.format(slots.time.minute) %}
        {{ hour_str }}:{{ minute_str }}
