language: eu
responses:
  intents:
    HassStartTimer:
      default: >
        {% set h = slots.hours if slots.hours is defined else none %}
        {% set m = slots.minutes if slots.minutes is defined else none %}
        {% set s = slots.seconds if slots.seconds is defined else none %}
        {# "bat"/"bateko" hitzez hitz etor daitezke, eta "ordu erdi"/"minutu erdi" 30 dira. #}
        {% set h = 1 if h in ['1', 'one', 'bat', 'bateko'] else h %}
        {% set m = 1 if m in ['1', 'one', 'bat', 'bateko'] else (30 if m in ['ordu erdi', 'ordu erdiko'] else m) %}
        {% set s = 1 if s in ['1', 'one', 'bat', 'bateko'] else (30 if s in ['minutu erdi', 'minutu erdiko'] else s) %}
        {% set h_abs = ('ordu bat' if h == 1 else h ~ ' ordu') if h else '' %}
        {% set m_abs = ('minutu bat' if m == 1 else m ~ ' minutu') if m else '' %}
        {% set s_abs = ('segundo bat' if s == 1 else s ~ ' segundo') if s else '' %}
        {% set h_all = ('ordu batera' if h == 1 else h ~ ' ordura') if h else '' %}
        {% set m_all = ('minutu batera' if m == 1 else m ~ ' minutura') if m else '' %}
        {% set s_all = ('segundo batera' if s == 1 else s ~ ' segundora') if s else '' %}
        {% set last_all = s_all if s else (m_all if m else h_all) %}
        {% set abs_parts = [h_abs, m_abs, s_abs] | select() | list %}
        {% set head_parts = abs_parts[:-1] if abs_parts | length > 1 else [] %}
        {% set head_text = ((head_parts | join(', ')) ~ ' eta ') if head_parts else '' %}
        {{ (head_text ~ last_all ~ ' ezarri dut tenporizadorea') | capitalize }}
