language: eu
responses:
  intents:
    HassClimateGetTemperature:
      # Tenperatura "current_temperature" atribututik hartzen da: climate entitateen
      # state-a modua da ("heat", "off"...), ez tenperatura.
      default: >
        {% set current_temperature = state_attr(state.entity_id, 'current_temperature') %}
        {% set temperature = state.state if current_temperature is none else current_temperature %}
        {{ temperature | float | round(1) | replace('.0', '') | replace('.', ',') }} gradu
