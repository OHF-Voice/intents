language: as
responses:
  intents:
    HassTimerStatus:
      default:
        "{% set num_timers = slots.timers | length %}\n{% set active_timers\
        \ = slots.timers | selectattr('is_active') | list %}\n{% set num_active_timers\
        \ = active_timers | length %}\n{% set paused_timers = slots.timers | rejectattr('is_active')\
        \ | list %}\n{% set num_paused_timers = paused_timers | length %}\n{% set\
        \ next_timer = none %}\n\n{% if num_timers == 0: %}\n  কোনো টাইমাৰ নাই।\n\
        {% elif num_active_timers == 0: %}\n  {# নহয় active timers #}\n  {% if num_paused_timers\
        \ == 1: %}\n    {% set next_timer = paused_timers[0] %}\n    টাইমাৰ স্থগিত\
        \ আছে।\n  {% else: %}\n    {{ num_paused_timers }} টা টাইমাৰ স্থগিত আছে।\n\
        \  {% endif %}\n{% else: %}\n  {# At least one active timer #}\n  {% if num_active_timers\
        \ == 1: %}\n    {% set next_timer = active_timers[0] %}\n  {% else: %}\n \
        \   {# Get active timer that will finish soonest #}\n    {% set sorted_timers\
        \ = active_timers | sort(attribute='total_seconds_left') %}\n    {% set next_timer\
        \ = sorted_timers[0] %}\n    {{ num_active_timers }} টা টাইমাৰ চলি আছে।\n\
        \  {% endif %}\n\n  {% if num_paused_timers == 1: %}\n    1 paused টাইমাৰ।\n\
        \  {% elif num_paused_timers > 0: %}\n    {{ num_paused_timers }} টা টাইমাৰ\
        \ স্থগিত আছে।\n  {% endif %}\n{% endif %}\n\n{% if next_timer: %}\n  {# At\
        \ least one active timer #}\n  {% if (next_timer.rounded_hours_left == 1)\
        \ and (next_timer.rounded_minutes_left > 0): %}\n    1 ঘণ্টা আৰু {{ next_timer.rounded_minutes_left\
        \ }} মিনিট\n  {% elif (next_timer.rounded_hours_left == 1): %}\n    1 ঘণ্টা\n\
        \  {% elif (next_timer.rounded_hours_left > 1) and (next_timer.rounded_minutes_left\
        \ > 0): %}\n    {{ next_timer.rounded_hours_left }} ঘণ্টা and {{ next_timer.rounded_minutes_left\
        \ }} মিনিট\n  {% elif (next_timer.rounded_hours_left > 1): %}\n    {{ next_timer.rounded_hours_left\
        \ }} ঘণ্টা\n  {% elif (next_timer.rounded_minutes_left == 1) and (next_timer.rounded_seconds_left\
        \ > 0): %}\n    1 মিনিট আৰু {{ next_timer.rounded_seconds_left }} ছেকেণ্ড\n\
        \  {% elif (next_timer.rounded_minutes_left == 1): %}\n    1 মিনিট\n  {% elif\
        \ (next_timer.rounded_minutes_left > 1) and (next_timer.rounded_seconds_left\
        \ > 0): %}\n    {{ next_timer.rounded_minutes_left }} মিনিট and {{ next_timer.rounded_seconds_left\
        \ }} ছেকেণ্ড\n  {% elif (next_timer.rounded_minutes_left > 1): %}\n    {{\
        \ next_timer.rounded_minutes_left }} মিনিট\n  {% elif (next_timer.rounded_seconds_left\
        \ == 1): %}\n    1 ছেকেণ্ড\n  {% elif (next_timer.rounded_seconds_left > 1):\
        \ %}\n    {{ next_timer.rounded_seconds_left }} ছেকেণ্ড\n  {% endif %}\n\n\
        \  {% if num_timers > 1: %}\n    {# Give some extra information to disambiguate\
        \ #}\n    বাকী আছে\n    {% if (next_timer.start_hours > 0) and (next_timer.start_minutes\
        \ > 0): %}\n      {{ next_timer.start_hours }} ঘণ্টা আৰু {{ next_timer.start_minutes\
        \ }} মিনিট\n    {% elif (next_timer.start_hours > 0): %}\n      {{ next_timer.start_hours\
        \ }} ঘণ্টা\n    {% elif (next_timer.start_minutes > 0) and (next_timer.start_seconds\
        \ > 0): %}\n      {{ next_timer.start_minutes }} মিনিট আৰু {{ next_timer.start_seconds\
        \ }} ছেকেণ্ড\n    {% elif (next_timer.start_minutes > 0): %}\n      {{ next_timer.start_minutes\
        \ }} মিনিট\n    {% elif (next_timer.start_seconds > 0): %}\n      {{ next_timer.start_seconds\
        \ }} ছেকেণ্ড\n    {% endif %}\n\n    {% if next_timer.name: %}\n      {{ next_timer.name\
        \ }}\n    {% elif next_timer.area: %}\n      {{ next_timer.area }}\n    {%\
        \ endif %}\n\n    টাইমাৰ।\n  {% else: %}\n    বাকী আছে।\n  {% endif %}\n{%\
        \ endif %}\n"
