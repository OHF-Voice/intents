language: hi
responses:
  intents:
    HassStartTimer:
      default: >
        {% set h = slots.hours if slots.hours is defined else none %}
        {% set m = slots.minutes if slots.minutes is defined else none %}
        {% set s = slots.seconds if slots.seconds is defined else none %}
        {% set h_text = h ~ (' घंटा' if h in [ "1", 'one'] else ' घंटे') if h else '' %}
        {% set m_text = (30 if m in ['half', '1/2'] else m) ~ (' मिनट' if m in [ "1", 'one'] else ' मिनट') if m else '' %}
        {% set s_text = (30 if s in ['half', '1/2'] else s) ~ (' सेकंड' if s in [ "1", 'one'] else ' सेकंड') if s else '' %}
        {% set text_list = [ h_text, m_text, s_text] | select() | list %}
        {% set text = text_list[:-1] | join(', ') ~ ' और ' ~ text_list[-1] if text_list | count > 2 else text_list | join(' और ') %}
        {% set name = (' जिसका नाम ' ~ slots.name | trim) if slots.name is defined else '' %}
        {{ text }} का टाइमर सेट कर दिया{{ name }}
      command: >
        {% set h = slots.hours if slots.hours is defined else none %}
        {% set m = slots.minutes if slots.minutes is defined else none %}
        {% set s = slots.seconds if slots.seconds is defined else none %}
        {% set h_text = h ~ (' घंटा' if h in [ "1", 'one'] else ' घंटे') if h else '' %}
        {% set m_text = (30 if m in ['half', '1/2'] else m) ~ (' मिनट' if m in [ "1", 'one'] else ' मिनट') if m else '' %}
        {% set s_text = (30 if s in ['half', '1/2'] else s) ~ (' सेकंड' if s in [ "1", 'one'] else ' सेकंड') if s else '' %}
        {% set text_list = [ h_text, m_text, s_text] | select() | list %}
        {% set text = text_list[:-1] | join(', ') ~ ' और ' ~ text_list[-1] if text_list | count > 2 else text_list | join(' और ') %}
        {{ text }} में कमांड चलाई जाएगी
