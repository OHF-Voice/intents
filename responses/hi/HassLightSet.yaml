      color_area: >-
        {% set colors = {
          'white': 'सफ़ेद', 'black': 'काला', 'red': 'लाल',
          'orange': 'नारंगी', 'yellow': 'पीला', 'green': 'हरा',
          'blue': 'नीला', 'purple': 'बैंगनी', 'brown': 'भूरा',
          'pink': 'गुलाबी', 'turquoise': 'फ़िरोज़ी'
        } %}
