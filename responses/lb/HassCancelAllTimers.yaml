language: lb
responses:
  intents:
    HassCancelAllTimers:
      default: >
        {% if slots.canceled < 1: %}
        Keen Timer annulléiert.
        {% elif slots.canceled == 1: %}
        1 Timer annulléiert.
        {% else: %}
        {{ slots.canceled }} Timere annulléiert.
        {% endif %}
      area: >
        {% if slots.canceled < 1: %}
        Keen Timer am {{ slots.area }} annulléiert.
        {% elif slots.canceled == 1: %}
        1 Timer am {{ slots.area }} annulléiert.
        {% else: %}
        {{ slots.canceled }} Timere am {{ slots.area }} annulléiert.
        {% endif %}
