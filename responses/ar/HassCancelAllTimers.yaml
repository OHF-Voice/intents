language: ar
responses:
  intents:
    HassCancelAllTimers:
      default: >
        {% if slots.canceled < 1: %}
        لا توجد مؤقتات لإلغائها.
        {% elif slots.canceled == 1: %}
        تم إلغاء مؤقت واحد.
        {% else: %}
        تم إلغاء {{ slots.canceled }} مؤقتات.
        {% endif %}
      area: >
        {% if slots.canceled < 1: %}
        لا توجد مؤقتات في {{ slots.area }}.
        {% elif slots.canceled == 1: %}
        تم إلغاء مؤقت واحد في {{ slots.area }}.
        {% else: %}
        تم إلغاء {{ slots.canceled }} مؤقتات في {{ slots.area }}.
        {% endif %}
