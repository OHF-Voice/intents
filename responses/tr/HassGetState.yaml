---
language: tr
responses:
  intents:
    HassGetState:
      default: "{{ state.state_with_unit }}"

      one: |
        {{ slots.name }} {{ state.state_with_unit }}

      one_yesno: |
        {% if query.matched %}
          Evet
        {% else %}
          Hayır, {{ state.state_with_unit }}
        {% endif %}

      any: |
        {% if query.matched %}
          {% set match = query.matched | map(attribute="name") | sort | list %}
          {% if match | length > 4 %}
            Evet, {{ match[:3] | join(", ") }} ve {{ (match | length - 3) }} tane daha
          {%- else -%}
            Evet,
            {% for name in match -%}
              {% if not loop.first and not loop.last %}, {% elif loop.last and not loop.first %} ve {% endif -%}
              {{ name }}
            {%- endfor -%}
          {% endif %}
        {% else %}
          Hayır
        {% endif %}

      all: |
        {% if not query.unmatched: %}
          Evet
        {% else %}
          {% set no_match = query.unmatched | map(attribute="name") | sort | list %}
          {% if no_match | length > 4 %}
            Hayır, {{ no_match[:3] | join(", ") }} ve {{ (no_match | length - 3) }} tane daha {{ slots.state }} değil
          {%- else -%}
            Hayır,
            {% for name in no_match -%}
              {% if not loop.first and not loop.last %}, {% elif loop.last and not loop.first %} ve {% endif -%}
              {{ name }}
            {%- endfor %} {{ slots.state }} değil
          {% endif %}
        {% endif %}

      which: |
        {% if not query.matched %}
          Hiçbiri
        {% else: %}
          {% set match = query.matched | map(attribute="name") | sort | list %}
          {% if match | length > 4 %}
            {{ match[:3] | join(", ") }} ve {{ (match | length - 3) }} tane daha
          {% else %}
            {%- for name in match -%}
              {% if not loop.first and not loop.last %}, {% elif loop.last and not loop.first %} ve {% endif -%}
              {{ name }}
            {%- endfor -%}
          {% endif %}
        {% endif %}

      how_many: |
        {{ query.matched | length }}

      where: |
        {{ slots.name }} {{ state.state_with_unit }}
