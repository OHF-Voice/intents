---
language: tr
responses:
  intents:
    HassGetCurrentDate:
      # Türkçede tarih "gün ay yıl" sırasıyla ve sıra sayısı eki olmadan
      # okunur ("17 Eylül 2013"), bu yüzden İngilizcedeki ordinal tablosuna
      # gerek yoktur.
      default: >
        {% set aylar = {
           1: 'Ocak',
           2: 'Şubat',
           3: 'Mart',
           4: 'Nisan',
           5: 'Mayıs',
           6: 'Haziran',
           7: 'Temmuz',
           8: 'Ağustos',
           9: 'Eylül',
           10: 'Ekim',
           11: 'Kasım',
           12: 'Aralık',
        } %}
        {{ slots.date.day }} {{ aylar[slots.date.month] }} {{ slots.date.year }}
