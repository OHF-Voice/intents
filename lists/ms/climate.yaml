language: "ms"
lists:
  fan_mode:
    values:
      - in: "auto[matik]"
        out: "auto"
      - in: "(hidup | on)"
        out: "on"
      - in: "(mati | off)"
        out: "off"
      - in: "(rendah | perlahan | low)"
        out: "low"
      - in: "(sederhana | medium)"
        out: "medium"
      - in: "(tinggi | laju | kuat | high)"
        out: "high"
      - in: "(maksimum | paling tinggi | top)"
        out: "top"
      - in: "(tengah | middle)"
        out: "middle"
      - in: "fokus"
        out: "focus"
      - in: "(sebar | serak | diffuse)"
        out: "diffuse"
