language: cy
lists:
  timer_half:
    values:
      - in: hanner
        out: 30
      - in: 1/2
        out: 30
  # "awr" ar ei phen ei hun = un awr / a bare "awr" is one hour
  timer_awr:
    values:
      - in: awr
        out: 1
  # chwarter awr / quarter of an hour
  timer_quarter:
    values:
      - in: chwarter
        out: 15
      - in: "(tri|thri|dri) chwarter"
        out: 45
  # Y ffurf hollt draddodiadol, a'r enw yn y canol: "pum munud ar hugain" / the traditional split form, noun in
  # the middle. Mae'r enw yn rhan o'r ffurf / the noun is part of the form.
  timer_minutes_split:
    values:
      - in: "un munud ar ddeg"
        out: 11
      - in: "(tri|dri|tair|dair) munud ar ddeg"
        out: 13
      - in: "(pedwar|bedwar|pedair|bedair) munud ar ddeg"
        out: 14
      - in: "un munud ar bymtheg"
        out: 16
      - in: "(dau|ddau|dwy|ddwy) funud ar bymtheg"
        out: 17
      - in: "(pedwar|bedwar|pedair|bedair) munud ar bymtheg"
        out: 19
      - in: "un munud ar hugain"
        out: 21
      - in: "(dau|ddau|dwy|ddwy) funud ar hugain"
        out: 22
      - in: "(tri|dri|tair|dair) munud ar hugain"
        out: 23
      - in: "(pedwar|bedwar|pedair|bedair) munud ar hugain"
        out: 24
      - in: "(pum|bum) munud ar hugain"
        out: 25
      - in: "chwe munud ar hugain"
        out: 26
      - in: "saith munud ar hugain"
        out: 27
      - in: "wyth munud ar hugain"
        out: 28
      - in: "naw munud ar hugain"
        out: 29
      - in: "(deg|ddeg|deng|ddeng) munud ar hugain"
        out: 30
  timer_seconds_split:
    values:
      - in: "un eiliad ar ddeg"
        out: 11
      - in: "(tri|dri|tair|dair) eiliad ar ddeg"
        out: 13
      - in: "(pedwar|bedwar|pedair|bedair) eiliad ar ddeg"
        out: 14
      - in: "un eiliad ar bymtheg"
        out: 16
      - in: "(dau|ddau|dwy|ddwy) eiliad ar bymtheg"
        out: 17
      - in: "(pedwar|bedwar|pedair|bedair) eiliad ar bymtheg"
        out: 19
      - in: "un eiliad ar hugain"
        out: 21
      - in: "(dau|ddau|dwy|ddwy) eiliad ar hugain"
        out: 22
      - in: "(tri|dri|tair|dair) eiliad ar hugain"
        out: 23
      - in: "(pedwar|bedwar|pedair|bedair) eiliad ar hugain"
        out: 24
      - in: "(pum|bum) eiliad ar hugain"
        out: 25
      - in: "chwe eiliad ar hugain"
        out: 26
      - in: "saith eiliad ar hugain"
        out: 27
      - in: "wyth eiliad ar hugain"
        out: 28
      - in: "naw eiliad ar hugain"
        out: 29
      - in: "(deg|ddeg|deng|ddeng) eiliad ar hugain"
        out: 30
