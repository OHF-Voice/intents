language: cy
lists:
  timer_half:
    values:
      - in: hanner
        out: 30
      - in: 1/2
        out: 30
  # "awr" ar ei phen ei hun = un awr / a bare "awr" is one hour
  timer_awr:
    values:
      - in: awr
        out: 1
  # chwarter awr / quarter of an hour
  timer_quarter:
    values:
      - in: chwarter
        out: 15
      - in: "(tri|thri|dri) chwarter"
        out: 45
