---
language: "hr"

lists:
  media_class:
    values:
      - in: "(izvođač[a|u]|umjetnik[a|u])"
        out: "artist"
      - in: "album"
        out: "album"
      - in: "(pjesm(a|u)|skladb(a|u))"
        out: "track"
      - in: "(playlist[u]|popis pjesama)"
        out: "playlist"
      - in: "(podcast|podkast)"
        out: "podcast"
      - in: "film"
        out: "movie"
      - in: "[TV] (serij(a|u)|emisij(a|u))"
        out: "tv_show"
