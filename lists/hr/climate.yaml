---
language: "hr"

lists:
  # Canonical climate fan modes. The "out" values must stay in sync with the
  # FAN_* constants in homeassistant/components/climate/const.py.
  fan_mode:
    values:
      - in: "(auto|automatski|automatsko)"
        out: "auto"
      - in: "(uključen|uključeno)"
        out: "on"
      - in: "(isključen|isključeno)"
        out: "off"
      - in: "(niski|nisko|slabi|slabo)"
        out: "low"
      - in: "(srednji|srednje)"
        out: "medium"
      - in: "(visoki|visoko|jaki|jako)"
        out: "high"
      - in: "(najviši|najviše|maksimalni|maksimalno)"
        out: "top"
      - in: "(sredina|središnji|središnje)"
        out: "middle"
      - in: "(fokus|fokusirani|fokusirano|usmjereni|usmjereno)"
        out: "focus"
      - in: "(difuzni|difuzno|raspršeni|raspršeno)"
        out: "diffuse"
