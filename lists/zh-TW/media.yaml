language: zh-TW
lists:
  volume_step:
    values:
      - in: (調大|調高|變大|大聲)[一點|一些]
        out: up
      - in: (調小|調低|變小|小聲)[一點|一些]
        out: down
  media_class:
    values:
      - in: (歌手|藝人|演唱者)
        out: artist
      - in: 專輯
        out: album
      - in: (歌|歌曲)
        out: track
      - in: (播放清單|歌單)
        out: playlist
      - in: (播客|podcast)
        out: podcast
      - in: 電影
        out: movie
      - in: (影集|電視劇)
        out: tv_show
