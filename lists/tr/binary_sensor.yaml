---
language: "tr"

lists:
  # açık / kapalı -> on / off (kapı, garaj kapısı, pencere)
  bs_open_states:
    values:
      - in: "açık"
        out: "on"
      - in: "kapalı"
        out: "off"

  # doluluk
  bs_occupancy_states:
    values:
      - in: "(dolu|algılandı)"
        out: "on"
      - in: "(boş|temiz)"
        out: "off"
