---
language: "tr"

lists:
  # "out" değerleri Home Assistant'ın beklediği İngilizce mod adlarıdır.
  fan_mode:
    values:
      - in: "otomatik"
        out: "auto"
      - in: "açık"
        out: "on"
      - in: "kapalı"
        out: "off"
      - in: "düşük"
        out: "low"
      - in: "orta"
        out: "medium"
      - in: "yüksek"
        out: "high"
      - in: "üst"
        out: "top"
      - in: "odaklı"
        out: "focus"
      - in: "yaygın"
        out: "diffuse"
