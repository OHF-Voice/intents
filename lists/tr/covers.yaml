language: tr
lists:
  cover_classes:
    values:
      - in: "perde[(ler|leri|lar|ları)]"
        out: "curtain"
      - in: "jaluzi[(ler|leri|lar|ları)]"
        out: "blind"
      - in: "(panjur|kepeng|kepenk)[(ler|leri|lar|ları)]"
        out: "shutter"
      - in: "(stor|güneşlik)[(ler|leri|lar|ları)]"
        out: "shade"
      - in: "pencere[(ler|leri|lar|ları)]"
        out: "window"
      - in: "garaj kapı(sı|ları)"
        out: "garage"
  cover_states:
    values:
      - in: "açık"
        out: "open"
      - in: "kapalı"
        out: "closed"
      - in: "açılıyor"
        out: "opening"
      - in: "kapanıyor"
        out: "closing"
