language: el
lists:
  # Canonical climate fan modes. The "out" values must stay in sync with the
  # FAN_* constants in homeassistant/components/climate/const.py.
  fan_mode:
    values:
      - in: (αυτόματ(ο|η|ος|α|οι|ες))
        out: "auto"
      - in: (ενεργοποιημέν(ο|η|ος|α|οι|ες)|on)
        out: "on"
      - in: (απενεργοποιημέν(ο|η|ος|α|οι|ες)|off)
        out: "off"
      - in: (χαμηλ(ό|ή|ός|ά|οί|ές))
        out: "low"
      - in: (μεσαί(ο|α|ος|ες|οι))
        out: "medium"
      - in: (υψηλ(ό|ή|ός|ά|οί|ές))
        out: "high"
      - in: (πάνω|επάνω|μέγιστ(η|ο|ος))
        out: "top"
      - in: (μέση|ενδιάμεσ(η|ο|ος))
        out: "middle"
      - in: (εστίαση|εστιασμέν(ο|η|ος))
        out: "focus"
      - in: (διάχυση|διάχυτ(ο|η|ος))
        out: "diffuse"
