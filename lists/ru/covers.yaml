language: ru
lists:
  cover_states:
    values:
      - in: открыт[а|о|ы|ой|ая|ые|ую|ый|ое|ых]|не[ ]зад(е|ё)рнут[а|о|ы|ой|ая|ые|ую|ый|ое|ых]|поднят[а|о|ы|ой|ая|ые|ую|ый|ое|ых]
        out: open
      - in: закрыт[а|о|ы|ой|ая|ые|ую|ый|ое|ых]|зад(е|ё)рнут[а|о|ы|ой|ая|ые|ую|ый|ое|ых]|опущен[а|о|ы|ной|ная|ные|ную|ный|ное|ных]
        out: closed
      - in: открыва(е|ю)тся|поднима(е|ю)тся
        out: opening
      - in: закрыва(е|ю)тся|опуска(е|ю)тся
        out: closing
  cover_classes:
    values:
      - in: навес[ы|ов]|козыр(ек|ёк|ьков|ьки)|маркиз[а|ы]
        out: awning
      - in: жалюз[и|ей]
        out: blind
      - in: штор[а|у|ы|ок]|шторк(а|у|и)|занавеск(у|а|и|ок)
        out: curtain
      - in: "[приточн(ый|ые|ых) ]клапан[ы|и|ов]|заслонк(у|а|и|ок)"
        out: damper
      - in: двер(ь|и|ей)|калитк(а|и|ок)
        out: door
      - in: гаражн(ую|ые|ых) (двер(ь|и|ей)|ворот[а])|(двер(ь|и)|ворота) гаража
        out: garage
      - in: ворот[а]
        out: gate
      - in: рулонн(ая|ую|ые|ых) штор[у|а|ы]
        out: shade
      - in: ставн(и|ей)
        out: shutter
      - in: окн(о|а)|окон
        out: window
