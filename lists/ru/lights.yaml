language: ru
lists:
  color_temperature_names:
    values:
      - in: (свет свечи|свеча|свечу|свечи)
        out: 1900
      - in: (тёплый|теплый)[ белый]
        out: 2700
      - in: (холодный|прохладный)[ белый]
        out: 4000
      - in: дневной свет
        out: 6500
  color:
    values:
      - in: белый|белого|белым|белой
        out: white
      - in: розовый|розового|розовым|розовой
        out: crimson
      - in: красный|красного|красным|красной
        out: red
      - in: оранжевый|оранжевого|оранжевым|оранжевой
        out: orange
      - in: желтый|желтого|желтым|желтой|жёлтый|жёлтого|жёлтым|жёлтой
        out: goldenrod
      - in: зеленый|зеленого|зеленым|зелёной|зелёный|зелёного|зелёным|зелёной
        out: green
      - in: голубой|голубого|голубым
        out: skyblue
      - in: синий|синего|синим|синей
        out: blue
      - in: фиолетовый|фиолетового|фиолетовым|фиолетовой
        out: purple
