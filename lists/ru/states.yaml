language: ru
lists:
  on_off_states:
    values:
      - in: (включ(е|ё)н[а|о|ы|ная|ное|ный|ные|ных|ного])
        out: "on"
      - in: (выключен[а|о|ы|ная|ное|ный|ные|ных|ного])
        out: "off"
  lock_states:
    values:
      - in: "заперт[а|о|ы|ый|ая|ое|ые|ых]|заблокирован[а|о|ы|ный|ная|ное|ные|ных]|[закрыт[а|о|ы|ый|ая|ое|ые|ых] ]на замок"
        out: "locked"
      - in: "отперт[а|о|ы|ый|ая|ое|ые|ых]|разблокирован[а|о|ы|ный|ная|ное|ные|ных]|не[ ]заперт[а|о|ы|ый|ая|ое|ые|ых]|не[ ]заблокирован[а|о|ы|ный|ная|ное|ные|ных]"
        out: "unlocked"
