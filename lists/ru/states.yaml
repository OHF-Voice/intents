language: ru
lists:
  on_off_states:
    values:
      - in: (включен[а|о|ы|ная|ное|ный|ные|ных|ного])
        out: "on"
      - in: (выключен[а|о|ы|ная|ное|ный|ные|ных|ного])
        out: "off"
  lock_states:
    values:
      - in: "заперт[а|о|ы]|заблокирован[а|о|ы]|[закрыт[а|о|ы] ]на замок"
        out: "locked"
      - in: "отперт[а|о|ы]|разблокирован[а|о|ы]|не заперт[а|о|ы]|не заблокирован[а|о|ы]"
        out: "unlocked"
