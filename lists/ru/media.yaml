language: ru
lists:
  media_class:
    values:
      - in: "(исполнителя|артиста|группу)"
        out: "artist"
      - in: "альбом"
        out: "album"
      - in: "(песню|трек|композицию)"
        out: "track"
      - in: "плейлист"
        out: "playlist"
      - in: "подкаст"
        out: "podcast"
      - in: "фильм"
        out: "movie"
      - in: "(сериал|передачу|шоу)"
        out: "tv_show"
      - in: "музыку"
        out: "music"
  volume_step:
    values:
      - in: "(прибавь|увеличь|повысь|подними)"
        out: "up"
      - in: "(убавь|уменьши|понизь|опусти)"
        out: "down"
  volume_comparative:
    values:
      - in: "[по]громче"
        out: "up"
      - in: "[по]тише"
        out: "down"
