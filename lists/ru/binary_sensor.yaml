---
language: "ru"

lists:
  # open / closed -> on / off (door, garage_door, window)
  bs_open_states:
    values:
      - in: "открыт[о|а|ы|ая|ое|ый|ые|ых]"
        out: "on"
      - in: "закрыт[о|а|ы|ая|ое|ый|ые|ых]"
        out: "off"

  # occupancy
  bs_occupancy_states:
    values:
      - in: "(занят[а|о|ы]|[кто][-(то|либо)] есть [кто][-(то|либо)]|есть присутствие|(движение;(есть|обнаружено)))"
        out: "on"
      - in: "(пуст[о]|никого [нет]|свобод(но|ен|нв|ный|ная|ное)|нет (кого[-то|-либо]|присутствия))"
        out: "off"
