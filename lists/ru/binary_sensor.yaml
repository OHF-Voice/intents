---
language: "ru"

lists:
  # open / closed -> on / off (door, garage_door, window)
  bs_open_states:
    values:
      - in: "открыт[о|а|ы|ая|ое|ый|ые]"
        out: "on"
      - in: "закрыт[о|а|ы|ая|ое|ый|ые]"
        out: "off"

  # occupancy
  bs_occupancy_states:
    values:
      - in: "(занят[а|о|ы]|[кто][-то] есть [кто][-то]|есть присутствие)"
        out: "on"
      - in: "(пуст[о]|никого [нет]|свободно|свободен|нет присутствия)"
        out: "off"
