---
language: "ru"

lists:
  # open / closed -> on / off (door, garage_door, window)
  bs_open_states:
    values:
      - in: "открыт[о|а|ы|ая|ое|ый|ые]"
        out: "on"
      - in: "закрыт[о|а|ы|ая|ое|ый|ые]"
        out: "off"

  # occupancy
  bs_occupancy_states:
    values:
      - in: "(занят[а|о|ы]|[<anyone>] есть [<anyone>]|есть присутствие|(движение;(есть|обнаружено)))"
        out: "on"
      - in: "(пуст[о]|никого [нет]|свобод(но|ен|нв|ный|ная|ное)|нет (<anyone>|присутствия))"
        out: "off"
