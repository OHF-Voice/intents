language: ru
lists:
  # Russian-local integer temperature range (mirrors the old _common.yaml list).
  # Overrides the shared lists/climate.yaml "halves" range, which crashes the
  # ru unicode_rbnf spellout engine on fractional values (e.g. 0.5).
  temperature:
    range:
      type: "temperature"
      from: 0
      to: 100
  fan_mode:
    values:
      - in: "авто[матический]"
        out: "auto"
      - in: "вкл[ючен[ный]]"
        out: "on"
      - in: "выкл[ючен[ный]]"
        out: "off"
      - in: "(низкий|минимальный)"
        out: "low"
      - in: "средний"
        out: "medium"
      - in: "(высокий|максимальный)"
        out: "high"
      - in: "(верхний|наверх)"
        out: "top"
      - in: "(центральный|средний)"
        out: "middle"
      - in: "(направленный|фокус)"
        out: "focus"
      - in: "рассеянный"
        out: "diffuse"
