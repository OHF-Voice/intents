---
language: "de"

lists:
  # Canonical climate fan modes. The "out" values must stay in sync with the
  # FAN_* constants in homeassistant/components/climate/const.py: every language
  # maps its own spoken forms onto the same English constants.
  fan_mode:
    values:
      - in: "auto[mati(sch|k)]"
        out: "auto"
      - in: "(an|ein)"
        out: "on"
      - in: "aus"
        out: "off"
      - in: "gering"
        out: "low"
      - in: "mittel"
        out: "medium"
      - in: "hoch"
        out: "high"
      - in: "oben"
        out: "top"
      - in: "mittig"
        out: "middle"
      - in: "fokus[siert]"
        out: "focus"
      - in: "diffus"
        out: "diffuse"
