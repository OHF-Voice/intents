language: hy
lists:
  volume_step:
    values:
      - in: (բարձրացրու|բարձրացրեք|ավելացրու|ավելացրեք)
        out: "up"
      - in: (իջեցրու|իջեցրեք|պակասեցրու|պակասեցրեք)
        out: "down"
  media_class:
    values:
      - in: (կատարող[ին]|արտիստ[ին]|երգիչ[ին])
        out: "artist"
      - in: ալբոմ[ը]
        out: "album"
      - in: (երգ[ը]|թրեք[ը])
        out: "track"
      - in: (փլեյլիստ[ը]|երգացանկ[ը])
        out: "playlist"
      - in: (փոդքասթ[ը]|պոդկաստ[ը])
        out: "podcast"
      - in: ֆիլմ[ը]
        out: "movie"
      - in: (սերիալ[ը]|հաղորդում[ը])
        out: "tv_show"
