language: hy
lists:
  fan_mode:
    values:
      - in: (ավտոմատ|ավտո)
        out: "auto"
      - in: միացված
        out: "on"
      - in: անջատված
        out: "off"
      - in: (ցածր|թույլ)
        out: "low"
      - in: միջին
        out: "medium"
      - in: (բարձր|ուժեղ)
        out: "high"
      - in: (առավելագույն|ամենաբարձր)
        out: "top"
      - in: միջանկյալ
        out: "middle"
      - in: (կենտրոնացված|ուղղորդված)
        out: "focus"
      - in: ցրված
        out: "diffuse"
