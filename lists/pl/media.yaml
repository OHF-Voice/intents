language: pl
lists:
  volume_step_up_words:
    values:
      - in: "(głośniej|podgłośnij|pogłośnij|zwiększ|podnieś)"
        out: "up"
  volume_step_down_words:
    values:
      - in: "(ciszej|ścisz|przycisz|zmniejsz|obniż)"
        out: "down"
  media_class:
    values:
      - in: "(artysta|artystę|artysty|wykonawca|wykonawcę|wykonawcy)"
        out: "artist"
      - in: "(album|albumu|płyta|płytę|płyty)"
        out: "album"
      - in: "(utwór|utworu|piosenka|piosenkę|piosenki|kawałek|kawałka)"
        out: "track"
      - in: "(playlista|playlistę|playlisty|lista odtwarzania)"
        out: "playlist"
      - in: "(podcast|podcastu)"
        out: "podcast"
      - in: "(film|filmu)"
        out: "movie"
      - in: "(serial|serialu|program|programu)"
        out: "tv_show"
