language: pl
lists:
  fan_mode:
    values:
      - in: "(auto|automatyczn(y|a|e|ie))"
        out: "auto"
      - in: "włączon(y|a|e)"
        out: "on"
      - in: "wyłączon(y|a|e)"
        out: "off"
      - in: "(niski|niska|niskie|nisko)"
        out: "low"
      - in: "(średni|średnia|średnie|średnio)"
        out: "medium"
      - in: "(wysoki|wysoka|wysokie|wysoko)"
        out: "high"
      - in: "(maksymalny|maksymalna|maksymalne|maksymalnie)"
        out: "top"
      - in: "(środkowy|środkowa|środkowe|środkowo)"
        out: "middle"
      - in: "(skupiony|skupiona|skupione)"
        out: "focus"
      - in: "(rozproszony|rozproszona|rozproszone|dyfuzyjny|dyfuzyjna|dyfuzyjne)"
        out: "diffuse"
