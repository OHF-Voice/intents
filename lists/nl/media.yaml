language: nl
lists:
  volume_step:
    values:
      - in: (hoger|omhoog|harder)
        out: up
      - in: (lager|omlaag|naar beneden|zachter)
        out: down
  volume_step_verb:
    values:
      - in: verhoog
        out: up
      - in: verlaag
        out: down
  volume_step_loud:
    values:
      - in: harder
        out: up
      - in: zachter
        out: down
  volume_step_infinitive:
    values:
      - in: verhogen
        out: up
      - in: verlagen
        out: down
  media_class:
    values:
      - in: (artiest|zanger[es]|band)
        out: artist
      - in: album
        out: album
      - in: (track|nummer|lied[je])
        out: track
      - in: (afspeellijst|playlist)
        out: playlist
      - in: podcast
        out: podcast
      - in: film
        out: movie
      - in: "[tv] (show|serie)"
        out: tv_show
