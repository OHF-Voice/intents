---
language: "nl"

lists:
  # Canonical climate fan modes. The "out" values must stay in sync with the
  # FAN_* constants in homeassistant/components/climate/const.py: every language
  # maps its own spoken forms onto the same English constants.
  fan_mode:
    values:
      - in: "auto[matisch]"
        out: "auto"
      - in: "aan"
        out: "on"
      - in: "uit"
        out: "off"
      - in: "laag"
        out: "low"
      - in: "(gemiddeld|medium)"
        out: "medium"
      - in: "hoog"
        out: "high"
      - in: "boven"
        out: "top"
      - in: "midden"
        out: "middle"
      - in: "focus"
        out: "focus"
      - in: "diffuus"
        out: "diffuse"
