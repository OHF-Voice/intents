---
language: "ml"

lists:
  # Canonical climate fan modes — കാലാവസ്ഥാ ഉപകരണത്തിലെ വിശറിയുടെ സ്ഥിരമായ ഓട്ടമുറകൾ.
  # The "out" values must match Home Assistant's English FAN_* constants.
  fan_mode:
    values:
      - in: (തനിയെ|താനേ|സ്വയം|ഓട്ടോ|ഓട്ടോമാറ്റിക്)
        out: "auto"
      - in: (ഓൺ|തുടർച്ചയായി)
        out: "on"
      - in: (ഓഫ്|നിർത്തിയത്)
        out: "off"
      - in: (അടിയറ്റം|താഴ്ന്നത്|കുറഞ്ഞത്|കുറവ്|ലോ)
        out: "low"
      - in: (ഇടത്തരം|മിതം|മീഡിയം)
        out: "medium"
      - in: (കൂടിയത്|ഉയർന്നത്|ഹൈ)
        out: "high"
      - in: (ഏറ്റവും മുകളിൽ|മേലത്തെ|ടോപ്പ്)
        out: "top"
      - in: (നടുവ്|നടുവിലത്തെ|മിഡിൽ)
        out: "middle"
      - in: (ഒരിടത്തേക്ക്|കേന്ദ്രീകരിച്ചത്|ഫോക്കസ്|ഫോക്കസ്ഡ്)
        out: "focus"
      - in: (വ്യാപിച്ചത്|പ്രചരിച്ചത്|വിതറപ്പെട്ടത്|പരത്തിയത്|പടർത്തിയത്|ഡിഫ്യൂസ്|ഡിഫ്യൂസ്ഡ്)
        out: "diffuse"
