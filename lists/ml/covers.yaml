---
language: "ml"

lists:
  cover_classes:
    values:
      - in: (ജന(ൽ|ലുകൾ))
        out: window
      - in: (ബ്ലൈൻ(ഡ്|ഡുകൾ))
        out: blind
      - in: (മറ[കൾ]|തിരശ്ശീല[കൾ]|തിരശീല[കൾ]|തിര[കൾ]|കർട്ട(ൻ|നുകൾ)|പട(കം|ങ്ങൾ)|ജന്നൽമറ[കൾ]|യവനിക[കൾ]|മറശ്ശീല[കൾ])
        out: curtain
      - in: (ഷട്ട(ർ|റുകൾ))
        out: shutter
      - in: (ഗരാജ് വാതി(ൽ|ലുകൾ)|ഗരാജ് വാതിലുകൾ)
        out: garage

  # Separate bare singular/plural nouns keep state questions grammatically natural.
  cover_classes_singular:
    values:
      - in: ജനൽ
        out: window
      - in: ബ്ലൈൻഡ്
        out: blind
      - in: (കർട്ടൺ|തിരശ്ശീല)
        out: curtain
      - in: ഷട്ടർ
        out: shutter
      - in: ഗരാജ് വാതിൽ
        out: garage
  cover_classes_plural:
    values:
      - in: ജനലുകൾ
        out: window
      - in: ബ്ലൈൻഡുകൾ
        out: blind
      - in: (കർട്ടനുകൾ|തിരശ്ശീലകൾ)
        out: curtain
      - in: ഷട്ടറുകൾ
        out: shutter
      - in: ഗരാജ് വാതിലുകൾ
        out: garage
