---
language: "bg"

lists:
  # Canonical climate fan modes. The "out" values must stay in sync with the
  # FAN_* constants in homeassistant/components/climate/const.py: every language
  # maps its own spoken forms onto the same English constants.
  fan_mode:
    values:
      - in: "авто|автоматичен|автоматично|автоматичен режим"
        out: "auto"
      - in: "включен[о]"
        out: "on"
      - in: "изключен[о]"
        out: "off"
      - in: "нисък|ниск[а|о|и]|слаб[а|о|и]"
        out: "low"
      - in: "среден|средн[а|о|и]"
        out: "medium"
      - in: "силен|висок[а|о|и]|силн[а|о|и]"
        out: "high"
      - in: "максимален|максималн[а|о|и]|най-висок[а|о]"
        out: "top"
      - in: "по средата|централно|централн[а|о]"
        out: "middle"
      - in: "фокус|фокусиран[а|о]"
        out: "focus"
      - in: "дифузен|дифузно|разсеян[а|о]"
        out: "diffuse"
