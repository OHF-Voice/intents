language: eu
lists:
  # Zenbakia unitatearen aurrean doa ("5 minutu"), baina "bat" atzetik
  # ("minutu bat"), eta genitiboan "minutu bateko" da.
  timer_words_hours:
    values:
      - in: bat
        out: 1
  timer_words_minutes:
    values:
      - in: bat
        out: 1
  timer_words_seconds:
    values:
      - in: bat
        out: 1
  timer_words_hours_ko:
    values:
      - in: bateko
        out: 1
  timer_words_minutes_ko:
    values:
      - in: bateko
        out: 1
  timer_words_seconds_ko:
    values:
      - in: bateko
        out: 1
  # "ordu erdi" = 30 minutu, "minutu erdi" = 30 segundo.
  timer_half_hour:
    values:
      - in: ordu erdi
        out: 30
  timer_half_minute:
    values:
      - in: minutu erdi
        out: 30
