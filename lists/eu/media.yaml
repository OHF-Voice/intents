language: eu
lists:
  # Bolumena igotzeko/jaisteko hitzak (ehunekorik gabe: "igo bolumena").
  volume_step:
    values:
      - in: (igo|gehitu|handitu|gora)
        out: "up"
      - in: (jaitsi|gutxitu|txikitu|behera)
        out: "down"
  # Bilaketaren edukia mota ("jarri abestia Bohemian Rhapsody")
  media_class:
    values:
      - in: (artista|abeslari[aren]?)
        out: "artist"
      - in: (diskoa|albuma)
        out: "album"
      - in: (abestia|kantua|kanta|pista)
        out: "track"
      - in: (zerrenda|playlista)
        out: "playlist"
      - in: (podcasta|irratsaioa)
        out: "podcast"
      - in: (filma|pelikula)
        out: "movie"
      - in: (telesaila|seriea)
        out: "tv_show"
