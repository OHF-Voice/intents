language: eu
lists:
  # Kolore-izenak kasu-formekin (fi/pl-ren eredua): esaldiek ez dute atzizkirik eransten,
  # zerrendak berak dakartza "gorri", "gorria" eta "gorrira" bezalako formak.
  color:
    values:
      - in: zuri[a|ra]
        out: white
      - in: beltz[a|era]
        out: black
      - in: gorri[a|ra]
        out: red
      - in: laranja[ra]
        out: orange
      - in: hori[a|ra]
        out: yellow
      - in: berde[a|ra]
        out: green
      - in: urdin[a|era]
        out: blue
      - in: more[a|ra]
        out: purple
      - in: marroi[a|ra]
        out: brown
      - in: arrosa[ra]
        out: pink
      - in: turkesa[ra]
        out: turquoise
  color_temperature_names:
    values:
      - in: (kandela argia|kandela argira)
        out: 1900
      - in: (zuri epela|zuri epelera)
        out: 2700
      - in: (zuri hotza|zuri hotzera)
        out: 4000
      - in: (eguneko argia|eguneko argira)
        out: 6500
