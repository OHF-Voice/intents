language: eu
lists:
  # Klima-gailuen haize-moduak. "out" balioek Home Assistanteko FAN_* konstanteekin
  # bat etorri behar dute, hizkuntza guztiek konstante berak erabiltzen baitituzte.
  fan_mode:
    values:
      - in: (automatikoa|automatiko|auto)
        out: "auto"
      - in: (piztuta|aktibatuta|martxan)
        out: "on"
      - in: (itzalita|desaktibatuta|geldirik)
        out: "off"
      - in: (baxua|baxu|motela)
        out: "low"
      - in: (ertaina|ertain)
        out: "medium"
      - in: (altua|altu|bizkorra)
        out: "high"
      - in: (goiena|gorena)
        out: "top"
      - in: (erdikoa|erdiko)
        out: "middle"
      - in: (fokua|fokatua)
        out: "focus"
      - in: (difusoa|barreiatua)
        out: "diffuse"
