language: cs
lists:
  volume_step:
    values:
      - in: "(zvyš|zvýšit|přidej|přidat|zesil|zesílit)"
        out: up
      - in: "(sniž|snížit|uber|ubrat|zeslab[it])"
        out: down
  volume_step_adverb:
    values:
      - in: "hlasitěji"
        out: up
      - in: "tišeji"
        out: down
  volume_step_intensity:
    values:
      - in: "zesil[it]"
        out: up
      - in: "zeslab[it]"
        out: down
