language: cs
lists:
  color_temperature_names:
    values:
      - in: "(světlo svíčky|svíčk(a|u))"
        out: 1900
      - in: "tepl(á|ou|é) bíl(á|ou|é)"
        out: 2700
      - in: "studen(á|ou|é) bíl(á|ou|é)"
        out: 4000
      - in: "denní světlo"
        out: 6500
  color:
    values:
      - in: "bíl((ý|ej|á|é|ých|ejch|o)|ou)"
        out: "white"
      - in: "čern((ý|ej|á|é|ých|ejch|o)|ou)"
        out: "black"
      - in: "červen((ý|ej|á|é|ých|ejch|o)|ou)"
        out: "red"
      - in: "oranžov((ý|ej|á|é|ých|ejch|o)|ou)"
        out: "orange"
      - in: "žlut((ý|ej|á|é|ých|ejch|o)|ou)"
        out: "yellow"
      - in: "zelen((ý|ej|á|é|ých|ejch|o)|ou)"
        out: "green"
      - in: "modr((ý|ej|á|é|ých|ejch|o)|ou)"
        out: "blue"
      - in: "fialov((ý|ej|á|é|ých|ejch|o)|ou)"
        out: "purple"
      - in: "hněd((ý|ej|á|é|ých|ejch|o)|ou)"
        out: "brown"
  brightness_level:
    values:
      - in: "(max|maxi(mum|mální)|[co] nej(víc|vyšší|větší))"
        out: 100
      - in: "(min|mini(mum|mální)|[co] nej(míň|menší|nižší))"
        out: 1
