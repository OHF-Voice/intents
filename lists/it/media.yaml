language: it
lists:
  media_class:
    values:
      - in: artista
        out: artist
      - in: (album|disco)
        out: album
      - in: (canzone|traccia|brano)
        out: track
      - in: (playlist|lista di riproduzione)
        out: playlist
      - in: podcast
        out: podcast
      - in: film
        out: movie
      - in: (serie [tv]|programma|episodio)
        out: tv_show
      - in: (radio|stazione radio)
        out: radio
  volume_step:
    values:
      - in: "(su|alz(a|are)|aument(a|are)|increment(a|are))"
        out: "up"
      - in: "(giù|giu|abbass(a|are)|diminuisc(i|e)|decrement(a|are))"
        out: "down"
