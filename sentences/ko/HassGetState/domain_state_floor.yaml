---
# HassGetState - domain_state_floor
# example: 거실에 조명이 켜져있어
# slots: {floor}, {domain}, {state}

language: "ko"
data:
  # ---- light ----
  - sentences:
      - "{floor}에 <light>[가|이] {on_off_states:state}[ ]있어"
      - "{floor}에 <light>[가|이] {on_off_states:state}[ ]있는지 (알아|알려줘|말해줘)"
    example: "거실에 조명이 켜져있어"
    inferred_domain: "light"
    response: "any"
  - sentences:
      - "{floor}에 모든 <light>[가|이] {on_off_states:state}[ ]있어"
    example: "거실에 모든 조명 켜져있어"
    inferred_domain: "light"
    response: "all"
  - sentences:
      - "{floor}에 (어떤|무슨) <light>[가|이] {on_off_states:state}[ ]있는지 (알아|알려줘|말해줘)"
    example: "거실에 어떤 조명 켜져있는지 알려줘"
    inferred_domain: "light"
    response: "which"
  - sentences:
      - "{floor}에 얼마나 많은 <light>[가|이] {on_off_states:state}[ ]있는지 (알아|알려줘|말해줘)"
    example: "거실에 얼마나 많은 조명 켜져있는지 알려줘"
    inferred_domain: "light"
    response: "how_many"
  # ---- fan ----
  - sentences:
      - "{floor}에 (선풍기|팬|환기구|환풍기|실링팬)[가|이] {on_off_states:state}[ ]있어"
      - "{floor}에 (선풍기|팬|환기구|환풍기|실링팬)[가|이] {on_off_states:state}[ ]있는지 (알아|알려줘|말해줘)"
    example: "거실에 팬이 켜져있어"
    inferred_domain: "fan"
    response: "any"
  - sentences:
      - "{floor}에 모든 (선풍기|팬|환기구|환풍기|실링팬)[가|이] {on_off_states:state}[ ]있어"
    example: "거실에 모든 팬 켜져있어"
    inferred_domain: "fan"
    response: "all"
  - sentences:
      - "{floor}에 (어떤|무슨) (선풍기|팬|환기구|환풍기|실링팬)[가|이] {on_off_states:state}[ ]있는지 (알아|알려줘|말해줘)"
    example: "거실에 어떤 팬 켜져있는지 알려줘"
    inferred_domain: "fan"
    response: "which"
  - sentences:
      - "{floor}에 얼마나 많은 (선풍기|팬|환기구|환풍기|실링팬)[가|이] {on_off_states:state}[ ]있는지 (알아|알려줘|말해줘)"
    example: "거실에 얼마나 많은 팬 켜져있는지 알려줘"
    inferred_domain: "fan"
    response: "how_many"
  # ---- switch ----
  - sentences:
      - "{floor}에 스위치[가|이] {on_off_states:state}[ ]있어"
      - "{floor}에 스위치[가|이] {on_off_states:state}[ ]있는지 (알아|알려줘|말해줘)"
    example: "거실에 스위치가 켜져있어"
    inferred_domain: "switch"
    response: "any"
  - sentences:
      - "{floor}에 모든 스위치[가|이] {on_off_states:state}[ ]있어"
    example: "거실에 모든 스위치 켜져있어"
    inferred_domain: "switch"
    response: "all"
  - sentences:
      - "{floor}에 (어떤|무슨) 스위치[가|이] {on_off_states:state}[ ]있는지 (알아|알려줘|말해줘)"
    example: "거실에 어떤 스위치 켜져있는지 알려줘"
    inferred_domain: "switch"
    response: "which"
  - sentences:
      - "{floor}에 얼마나 많은 스위치[가|이] {on_off_states:state}[ ]있는지 (알아|알려줘|말해줘)"
    example: "거실에 얼마나 많은 스위치 켜져있는지 알려줘"
    inferred_domain: "switch"
    response: "how_many"
  # ---- locks ----
  - sentences:
      - "{floor}에 {lock_states:state}있는 문이 있어"
    example: "거실에 잠겨있는 문이 있어"
    inferred_domain: "lock"
    response: "any"
  - sentences:
      - "{floor}에 모든 문 {lock_states:state}[ ]있어"
    example: "거실에 모든 문 잠겨있어"
    inferred_domain: "lock"
    response: "all"
  - sentences:
      - "(어떤|어디) {floor}에 문이 {lock_states:state}[ ]있어"
    example: "어떤 거실에 문이 잠겨있어"
    inferred_domain: "lock"
    response: "which"
  - sentences:
      - "{floor}에 얼마나 많은 문이 {lock_states:state}[ ]있어"
    example: "거실에 얼마나 많은 문이 잠겨있어"
