---
# HassLightSet - name_temperature
# example: подеси температуру боје ноћне лампе на 2700 келвина
# slots: {name}, {temperature}

language: sr
data:
  - sentences:
      - "<set> температуру [боје|светла] {name} [на|у] {color_temperature:temperature}[[ ](k|келвина)]"
      - "<set> {name} [на|у] температуру [боје|светла] {color_temperature:temperature}[[ ](k|келвина)]"
      - "<set> температуру [боје|светла] {name} [на|у] {color_temperature_names:temperature}"
      - "<set> {name} [на|у] {color_temperature_names:temperature}"
    example: "подеси температуру боје ноћне лампе на 2700 келвина"
    name_domains:
      - "light"
    response: "temperature"
