---
# HassClimateGetTemperature - name_only
# example: која је температура на термостату
# slots: {name}

language: sr
data:
  - sentences:
      - "<what_is> <temp> [(у|на|за)] {name}"
      - "колико је степени [(у|на|за)] {name}"
    example: "која је температура на термостату"
    name_domains:
      - "climate"
    response: "default"
