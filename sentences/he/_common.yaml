language: "he"
responses:
  errors:
    # General errors
    no_intent: "סליחה, לא הצלחתי להבין את הבקשה"
    handle_error: "אירעה שגיאה בלתי צפויה"

    # Errors for when user is not logged in
    no_area: "סליחה, לא ידוע לי על אזור שנקרא {{ area }}"
    no_floor: "סליחה, לא ידוע לי על קומה שנקראת {{ floor }}"
    no_domain: "סליחה, לא ידוע לי על {{ domain }}"
    no_domain_in_area: "סליחה, לא ידוע לי על {{ domain }} באזור {{ area }}"
    no_domain_in_floor: "סליחה, לא ידוע לי על {{ domain }} בקומה {{ floor }}"
    no_device_class: "סליחה, לא ידוע לי על סוג מכשיר {{ device_class }}"
    no_device_class_in_area: "סליחה, לא ידוע לי על סוג מכשיר {{ device_class }} באזור {{ area }}"
    no_device_class_in_floor: "סליחה, לא ידוע לי על סוג מכשיר {{ device_class }} בקומה {{ floor }}"
    no_entity: "סליחה, לא ידוע לי על מכשיר שנקרא {{ entity }}"
    no_entity_in_area: "סליחה, לא ידוע לי על מכשיר שנקרא {{ entity }} באזור {{ area }}"
    no_entity_in_floor: "סליחה, לא ידוע לי על מכשיר שנקרא {{ entity }} בקומה {{ floor }}"
    entity_wrong_state: "סליחה, אין מכשיר שנמצא במצב {{ state | lower }}"
    feature_not_supported: "סליחה, אין מכשיר שתומך בתכונות הנדרשות"

    # Errors for when user is logged in and we can give more information
    no_entity_exposed: "סליחה, {{ entity }} אינו נחשף"
    no_entity_in_area_exposed: "סליחה, {{ entity }} באזור {{ area }} אינו נחשף"
    no_entity_in_floor_exposed: "סליחה, {{ entity }} בקומה {{ floor }} אינו נחשף"
    no_domain_exposed: "סליחה, אף {{ domain }} אינו נחשף"
    no_domain_in_area_exposed: "סליחה, אף {{ domain }} באזור {{ area }} אינו נחשף"
    no_domain_in_floor_exposed: "סליחה, אף {{ domain }} בקומה {{ floor }} אינו נחשף"
    no_device_class_exposed: "סליחה, אף סוג מכשיר {{ device_class }} אינו נחשף"
    no_device_class_in_area_exposed: "סליחה, אף סוג מכשיר {{ device_class }} באזור {{ area }} אינו נחשף"
    no_device_class_in_floor_exposed: "סליחה, אף סוג מכשיר {{ device_class }} בקומה {{ floor }} אינו נחשף"

    # Used when multiple (exposed) devices have the same name
    duplicate_entities: "סליחה, קיימים מספר מכשירים שנקראים {{ entity }}"
    duplicate_entities_in_area: "סליחה, קיימים מספר מכשירים שנקראים {{ entity }} באזור {{ area }}"
    duplicate_entities_in_floor: "סליחה, קיימים מספר מכשירים שנקראים {{ entity }} בקומה {{ floor }}"

    # Errors for timers
    timer_not_found: "סליחה, לא הצלחתי למצוא את הטיימר"
    multiple_timers_matched: "סליחה, לא ניתן להתייחס למספר טיימרים בו זמנית"
    no_timer_support: "סליחה, הטיימרים אינם נתמכים במכשיר זה"
skip_words:
  - "אנא"
  - "נא"
  - "בבקשה"
  - "את[ה] יכול[ה]"
  - "תוכל[י]"
  - "אפשר"
