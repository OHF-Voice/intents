---
# HassTurnOn - name_only
# slots: {name}

language: "he"
data:
  # on-able domains
  - sentences:
      - "(הדלק|הדליקי|הדלקה|להדליק|תדליק[י]) [את] [של] [ה]{name}"
    example: "הדלק את האור הראשי"
    name_domains: "default"
    response: "default"

  # covers
  - sentences:
      - "(פתח[י]|תפתח[י]) [את] [ה]{name}"
    example: "פתח את הווילון"
    name_domains:
      - "cover"
    response: "cover"
