---
# HassClimateGetTemperature - name_only

language: "af"
data:
  - sentences:
      - "wat is die [huidige] temperatuur van [<the>] {name}"
      - "wat is [<the>] {name} se [huidige] temperatuur"
      - "hoe warm is [<the>] {name}"
    example: "wat is die temperatuur van die termostaat"
    name_domains:
      - "climate"
    response: "default"
