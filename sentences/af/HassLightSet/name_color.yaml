---
# HassLightSet - name_color

language: "af"
data:
  - sentences:
      - "(stel|verander|maak) [<the>] {name} [se kleur] [na|tot] {color}"
      - "(stel|verander|maak) die kleur van [<the>] {name} [na|tot] {color}"
    example: "maak die slaapkamerlamp rooi"
    name_domains:
      - "light"
    response: "color"
