# HassGetWeather - name_only
# slots: {name}

language: "bn"
data:
  - sentences:
      - "{name} [এর] আবহাওয়া কেমন"
      - "{name} [এর] আজকের আবহাওয়া কেমন"
      - "{name} [এর] আবহাওয়া বলো"
      - "{name} [এর] আবহাওয়ার খবর বলো"
      - "{name} [এর] আবহাওয়ার কি খবর"
      - "{name} [এ | তে] বৃষ্টি হবে"
      - "{name} [এ | তে] আজ [কি] বৃষ্টি হবে"
      - "{name} [এ | তে] [আজ] রোদ থাকবে"
      - "{name} [এ | তে] [আজ] গরম কত"
      - "{name} [এ | তে] [আজ] ঠান্ডা কত"
      - "{name} [এর] [আজকের | এখন] তাপমাত্রা কত"
    example: "ঢাকার আবহাওয়া কেমন"
    name_domains:
      - "weather"
    response: "default"
