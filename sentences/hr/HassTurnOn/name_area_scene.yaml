---
# HassTurnOn - name_area_scene
# example: aktiviraj scenu Večernji ugođaj u dnevnoj sobi
# slots: {name, area}

language: "hr"
data:
  - sentences:
      - "(aktiviraj|<uključi>|pokreni) [scenu] {name} [u|na] <area>"
      - "(prebaci|prijeđi) na [scenu] {name} [u|na] <area>"
    example: "aktiviraj scenu Večernji ugođaj u dnevnoj sobi"
    name_domains:
      - "scene"
    response: "scene"
