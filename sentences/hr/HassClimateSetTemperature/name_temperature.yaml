---
# HassClimateSetTemperature - name_temperature
# example: postavi Termostat ured na 21 stupanj
# slots: {name, temperature}

language: "hr"
data:
  - sentences:
      - "<promijeni> <temp> (na|za) {name} [na] <temperature>"
      - "<promijeni> {name} [na] <temperature>"
    example: "postavi Termostat ured na 21 stupanj"
    name_domains:
      - "climate"
    response: "default"
