---
# HassMediaSearchAndPlay - name_media_class
# example: pusti pjesmu Bohemian Rhapsody na TV
# slots: {name, search_query, media_class}

language: "hr"
data:
  - sentences:
      - "(pusti[te]|pokreni[te]) {media_class} {search_query} na {name}"
    example: "pusti pjesmu Bohemian Rhapsody na TV"
    name_domains:
      - "media_player"
    response: "default"
