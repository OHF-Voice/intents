---
# HassMediaSearchAndPlay - name_area_media_class
# example: pusti izvođača Queen na TV u prostoriji Kuhinja
# slots: {name, area, search_query, media_class}

language: "hr"
data:
  - sentences:
      - "(pusti[te]|pokreni[te]) {media_class} {search_query} na {name} (u|na) <area>"
    example: "pusti izvođača Queen na TV u prostoriji Kuhinja"
    name_domains:
      - "media_player"
    response: "default"
