---
# HassMediaSearchAndPlay - name_only
# example: pusti The Office na TV
# slots: {name, search_query}

language: "hr"
data:
  - sentences:
      - "(pusti[te]|pokreni[te]) {search_query} na {name}"
    example: "pusti The Office na TV"
    name_domains:
      - "media_player"
    response: "default"
