---
# HassMediaPlayerUnmute - name_only
# example: uključi zvuk na TV
# slots: {name}

language: "hr"
data:
  - sentences:
      - "(uključi[te]|vrati[te]) (zvuk|ton) na {name}"
      - "poništi[te] utišavanje na {name}"
    example: "uključi zvuk na TV"
    name_domains:
      - "media_player"
    response: "default"
