---
# HassMediaPlayerMute - name_only
# example: isključi zvuk na TV
# slots: {name}

language: "hr"
data:
  - sentences:
      - "<isključi> (zvuk|ton) (na|od) {name}"
      - "(mutiraj|stavi na mute) {name}"
    example: "isključi zvuk na TV"
    name_domains:
      - "media_player"
    response: "default"
