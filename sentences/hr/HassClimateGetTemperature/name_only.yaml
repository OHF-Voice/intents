---
# HassClimateGetTemperature - name_only
# example: koja je temperatura na termostatu
# slots: {name}

language: "hr"
data:
  - sentences:
      - "<koja_je> <temp> [na|u|za] {name}"
      - "koliko je stupnjeva [na|u|za] {name}"
    example: "koja je temperatura na termostatu"
    name_domains:
      - "climate"
    response: "default"
