---
# HassVacuumStart - name_only
# example: रोभर सुरु गर्नु
# slots: {name}

language: "ne"
data:
  - sentences:
      - "{name} [भ्याक्यूम] (चालु|सुरू|सुरु) [<do_v>]"
      - "{name} [भ्याक्यूम] <run_v>"
      - "{name} [भ्याक्यूम] सफा गर्न (सुरू|सुरु) [<do_v>]"
    example: "रोभर सुरु गर्नु"
    name_domains:
      - "vacuum"
    response: "default"
