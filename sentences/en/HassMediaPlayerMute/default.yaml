---
# HassMediaPlayerMute - default
# example: mute
# context_area: true

language: "en"
data:
  - sentences:
      - "mute [[<the>] <media>] [<here>]"
    example: "mute"
    response: "default"
  # Speech-to-Phrase: lean subset of the block above, with the media noun
  # required so the STT grammar never has to recognise a bare "mute".
  - sentences:
      - "mute [<the>] <media>"
    response: "default"
    speech_to_phrase: true
