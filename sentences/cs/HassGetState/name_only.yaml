---
# HassGetState - name_only
# example: jaký je stav lampy
# slots: {name}

language: "cs"
data:
  - sentences:
      - "<jaky_je> [stav] {name}"
      - "jaký (stav;(má|je|mají)) {name}"
    example: "jaký je stav lampy"
    name_domains: "default"
    response: "one"
  - sentences:
      - "jaký je stav {name}"
    example: "jaký je stav Teploměr"
    name_domains:
      - sensor
    response: "one"
    speech_to_phrase: true
