---
# HassLightSet - brightness_only
# example: nastav jas světel na 50 %
# slots:
# - {brightness}
# - {domain}
# context_area: true

language: "cs"
data:
  - sentences:
      - "(<nastavit>|<zmenit>) [jas] <svetla> na <brightness>"
    example: "nastav jas světel na 50 %"
    inferred_domain: "light"
    response: "brightness"
  - sentences:
      - "nastav jas světla na {brightness} procent"
    example: "nastav jas světla na 50 procent"
    inferred_domain: "light"
    response: "brightness"
    speech_to_phrase: true
