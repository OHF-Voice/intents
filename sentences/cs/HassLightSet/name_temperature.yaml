---
# HassLightSet - name_temperature
# example: nastav teplotu barvy lampičky na 2700 kelvinů
# slots:
# - {name}
# - {temperature}

language: "cs"
data:
  - sentences:
      - "(<nastavit>|<zmenit>) teplotu [barvy|světla] {name} [na] {color_temperature:temperature}[[ ](k|kelvin[ů|u|y])]"
      - "(<nastavit>|<zmenit>) {name} na teplotu [barvy|světla] {color_temperature:temperature}[[ ](k|kelvin[ů|u|y])]"
      - "(<nastavit>|<zmenit>) teplotu [barvy|světla] {name} [na] {color_temperature_names:temperature}"
      - "(<nastavit>|<zmenit>) {name} na {color_temperature_names:temperature}"
    example: "nastav teplotu barvy lampičky na 2700 kelvinů"
    name_domains:
      - "light"
    response: "temperature"
