---
# HassIncreaseTimer - seconds_start_minutes
# slots: {start_minutes, seconds}

language: "cs"
data:
  - sentences:
      - "přid(ej|at) <dur_seconds> k <casovac> [na] <start_minutes>"
      - "prodl(už|oužit) <casovac> [na] <start_minutes> o <dur_seconds>"
    example: "přidej 30 sekund k časovači na 10 minut"
    response: "default"
