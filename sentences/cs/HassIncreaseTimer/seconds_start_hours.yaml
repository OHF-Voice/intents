---
# HassIncreaseTimer - seconds_start_hours
# slots: {start_hours, seconds}

language: "cs"
data:
  - sentences:
      - "přid(ej|at) <dur_seconds> k <casovac> [na] <start_hours>"
      - "prodl(už|oužit) <casovac> [na] <start_hours> o <dur_seconds>"
    example: "přidej 30 sekund k časovači na 2 hodiny"
    response: "default"
