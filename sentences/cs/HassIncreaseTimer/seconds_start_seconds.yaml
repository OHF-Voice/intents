---
# HassIncreaseTimer - seconds_start_seconds
# slots: {start_seconds, seconds}

language: "cs"
data:
  - sentences:
      - "přid(ej|at) <dur_seconds> k <casovac> [na] <start_seconds>"
      - "prodl(už|oužit) <casovac> [na] <start_seconds> o <dur_seconds>"
    example: "přidej 30 sekund k časovači na 20 sekund"
    response: "default"
