---
# HassIncreaseTimer - minutes_start_seconds
# slots: {start_seconds, minutes}

language: "cs"
data:
  - sentences:
      - "přid(ej|at) <dur_minutes> k <casovac> [na] <start_seconds>"
      - "prodl(už|oužit) <casovac> [na] <start_seconds> o <dur_minutes>"
    example: "přidej 5 minut k časovači na 20 sekund"
    response: "default"
