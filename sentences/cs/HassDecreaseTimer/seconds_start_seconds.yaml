      - "(odeb(er|rat)|ub(er|rat)) <dur_seconds> (z|od) <casovac> [na] <start_seconds>"
      - "zkr(ať|átit) <casovac> [na] <start_seconds> o <dur_seconds>"
    example: "odeber 30 sekund z časovače na 20 sekund"
    response: "default"
