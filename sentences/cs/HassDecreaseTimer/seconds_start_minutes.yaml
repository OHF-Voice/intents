---
# HassDecreaseTimer - seconds_start_minutes
# slots: {start_minutes, seconds}

language: "cs"
data:
  - sentences:
      - "(odeb(er|rat)|ub(er|rat)) <dur_seconds> (z|od) <casovac> [na] <start_minutes>"
      - "zkr(ať|átit) <casovac> [na] <start_minutes> o <dur_seconds>"
    example: "odeber 30 sekund z časovače na 10 minut"
    response: "default"
