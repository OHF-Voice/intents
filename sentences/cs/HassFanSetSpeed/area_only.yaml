---
# HassFanSetSpeed - area_only
# example: nastav ventilátor v kuchyni na 50 %
# slots:
# - {area}
# - {percentage}

language: "cs"
data:
  - sentences:
      - "(<area>;[<nastavit>] (<fan_sg>|<fan_pl>)) na <fan_speed>"
      - "(<area>;[<nastavit>] rychlost (<fan_gen_sg>|<fan_gen_pl>)) na <fan_speed>"
    example: "nastav ventilátor v kuchyni na 50 %"
    response: "default"
