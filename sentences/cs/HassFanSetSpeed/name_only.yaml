---
# HassFanSetSpeed - name_only
# example: nastav Ventilátor na 50 %
# slots:
# - {name}
# - {percentage}

language: "cs"
data:
  - sentences:
      - "[<nastavit>] [rychlost] {name} na <fan_speed>"
    example: "nastav Ventilátor na 50 %"
    name_domains:
      - "fan"
    response: "fan"
  - sentences:
      - "nastav rychlost {name} na {fan_speed:percentage} procent"
    example: "nastav rychlost Větrání pokoje na 50 procent"
    name_domains:
      - "fan"
    response: "fan"
    speech_to_phrase: true
