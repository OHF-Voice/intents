---
# HassFanSetSpeed - floor_only
# example: nastav ventilátor v prvním patře na 50 %
# slots:
# - {floor}
# - {percentage}

language: "cs"
data:
  - sentences:
      - "(<floor>;[<nastavit>] (<fan_sg>|<fan_pl>)) na <fan_speed>"
      - "(<floor>;[<nastavit>] rychlost (<fan_gen_sg>|<fan_gen_pl>)) na <fan_speed>"
    example: "nastav ventilátor v prvním patře na 50 %"
    response: "default"
