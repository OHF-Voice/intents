---
# HassRespond - default
# example: ahoj

language: "cs"
data:
  - sentences:
      - "Ahoj [home assistant|home asistente]"
    example: "ahoj"
    response: "hello"

  - sentences:
      - "(poslocháš|nahráváš) (pořád|[neu]stále)"
    example: "nahráváš neustále"
    response: "listening"

  - sentences:
      - "kam (se posílají|(po|ode)síláš|jsou odesílána) (moje|má) data"
    example: "kam jsou odesílána má data"
    response: "data"

  - sentences:
      - "jaké [hlasové] příkazy (mohu použít|jsou k dispozici|umíš)"
    example: "jaké hlasové příkazy mohu použít"
    response: "commands"

  - sentences:
      - "kdo tě (s|vy)tvořil"
    example: "kdo tě stvořil"
    response: "creator"
