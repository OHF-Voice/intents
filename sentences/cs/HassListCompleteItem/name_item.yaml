---
# HassListCompleteItem - name_item
# example: odškrtni vynést koš ze seznamu Domácí práce
# slots:
# - {item}
# - {name}

language: "cs"
data:
  - sentences:
      - "(odškrtn(i|out)|vyškrtn(i|out)|zaškrtn(i|out)|dokonč(i|it)) {todo_list_item:item} (z|ze|v|ve)[ seznamu] {name}"
      - "označ[it] {todo_list_item:item} (v|ve)[ seznamu] {name} jako (hotov|dokončen)(é|ý|ou)"
    example: "odškrtni vynést koš ze seznamu Domácí práce"
    name_domains:
      - "todo"
    response: "item_completed"
