---
# HassStartTimer - hours_only

language: "cs"
data:
  - sentences:
      - "[<nastavit>] <casovac> [na] <dur_hours>"
    example: "nastav časovač na <dur_hours>"
    response: "default"
  - sentences:
      - "nastav časovač na {timer_range_hours:hours} hodin[(a|u|y)]"
    example: "nastav časovač na 2 hodina"
    response: "default"
    speech_to_phrase: true
