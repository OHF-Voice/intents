---
# HassMediaPlayerMute - default
# example: silenciar
# context_area: true

language: "es"
data:
  - sentences:
      - "silenciar"
      - "silenciar ([el|la] (música|audio|sonido|reproducción|reproductor[es])) [<de_aqui>]"
      - "silenci(a|e|á) ([el|la] (música|audio|sonido|reproducción|reproductor[es])) [<de_aqui>]"
      - "<quita> [el] (sonido|audio|volumen) [<de_aqui>]"
      - "pon [en] silencio ([el|la] (música|audio|sonido|reproducción|reproductor[es])) [<de_aqui>]"
    example: "silenciar"
    response: "default"
  # Speech-to-Phrase: lean subset of the block above, with the media noun
  # required so the STT grammar never has to recognise a bare "silenciar".
  - sentences:
      - "silencia (la música|el audio|la reproducción)"
      - "quita el (sonido|volumen)"
    example: "silencia la música"
    response: "default"
    speech_to_phrase: true
