---
# HassFanSetSpeed - name_only
# example: pon el ventilador de techo al 50%
# slots:
# - {name}
# - {percentage}

language: "es"
data:
  - sentences:
      - "[<establece>] [el|la|los|las] {name} [velocidad] [al] {fan_speed:percentage}[%| por[ ]cien[to]]"
      - "[<establece>] [la] velocidad [del|de] [el|la|los|las] {name} [al] {fan_speed:percentage}[%| por[ ]cien[to]]"
    example: "pon el ventilador de techo al 50%"
    name_domains:
      - "fan"
    response: "default"
  - sentences:
      - "pon la velocidad del {name} al {fan_speed:percentage} por ciento"
    example: "pon la velocidad del Ventilador de techo al 50 por ciento"
    name_domains:
      - "fan"
    response: "default"
    speech_to_phrase: true
