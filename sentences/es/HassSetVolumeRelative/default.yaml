---
# HassSetVolumeRelative - default
# example: sube el volumen
# slots: {volume_step}; context_area: true

language: "es"
data:
  # relative direction (up)
  - sentences:
      - "<sube> <vol>"
      - "más volumen"
    slots: &id001
      volume_step: "up"
    example: "sube el volumen"
    response: "default"
  # by a percentage (up)
  - sentences:
      - "<sube> <vol> [en] [un ]{volume_step_up:volume_step}[%| por ciento]"
    example: "sube el volumen 20%"
    response: "default"
  # relative direction (down)
  - sentences:
      - "<baja> <vol>"
      - "menos volumen"
    slots: &id002
      volume_step: "down"
    example: "baja el volumen"
    response: "default"
  # by a percentage (down)
  - sentences:
      - "<baja> <vol> [en] [un ]{volume_step_down:volume_step}[%| por ciento]"
    example: "baja el volumen 20%"
    response: "default"
  - sentences:
      - "sube el volumen"
    example: "sube el volumen"
    slots: *id001
    response: "default"
    speech_to_phrase: true
  - sentences:
      - "sube el volumen un {volume_step_up:volume_step} por ciento"
    example: "sube el volumen un 10 por ciento"
    response: "default"
    speech_to_phrase: true
  - sentences:
      - "baja el volumen"
    example: "baja el volumen"
    slots: *id002
    response: "default"
    speech_to_phrase: true
  - sentences:
      - "baja el volumen un {volume_step_down:volume_step} por ciento"
    example: "baja el volumen un 10 por ciento"
    response: "default"
    speech_to_phrase: true
