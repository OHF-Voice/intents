---
# HassStartTimer - seconds_only
# example: temporizador de 30 segundos

language: "es"
data:
  - sentences:
      - "[<timer_set>] [un|una|mi] <temporizador> (dentro de|de|en|para) <nb_seconds> segundo[s]"
      - "[<timer_set>] [un|una|mi] <temporizador> (dentro de|de|en|para) {timer_half:seconds} minuto"
    example: "inicia temporizador de 30 segundos"
    response: "default"
  - sentences:
      - "pon un temporizador de {timer_seconds:seconds} (segundo|segundos)"
    example: "pon un temporizador de 30 segundos"
    response: "default"
    speech_to_phrase: true
  - sentences:
      - "avísame (dentro de|en) <nb_seconds> segundo[s]"
    example: "avísame dentro de 15 segundos"
    response: "default"
