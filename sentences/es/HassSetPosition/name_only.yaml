---
# HassSetPosition - name_only
# example: abre la cortina dormitorio al 50%
# slots:
# - {name}
# - {position}

language: "es"
data:
  - sentences:
      - "<establece_abre_cierra> [[la ]posición [de[l]] ][el|la|los|las] {name} a[l] {position} [<porciento>]"
    example: "abre la cortina dormitorio al 50%"
    name_domains: "default"
    response: "default"
  - sentences:
      - "pon la posición del {name} al {position} por ciento"
    example: "pon la posición del Ventana Salón al 50 por ciento"
    name_domains:
      - "cover"
      - "valve"
    response: "default"
    speech_to_phrase: true
