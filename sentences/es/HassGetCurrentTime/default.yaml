---
# HassGetCurrentTime - default
# example: qué hora es

language: "es"
data:
  - sentences:
      - "[<dime> ]qué hora es[ ahora]"
      - "<dime> la hora[ actual]"
      - "<cual_es> hora"
      - "hora actual"
    example: "qué hora es"
    response: "default"
  - sentences:
      - "qué hora es"
    example: "qué hora es"
    response: "default"
    speech_to_phrase: true
