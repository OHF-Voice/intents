---
# HassUnpauseTimer - default
# example: continúa cuenta atrás

language: "es"
data:
  - sentences:
      - "<continúa> [con] [mi] <temporizador>"
    example: "continúa cuenta atrás"
    response: "default"
  - sentences:
      - "continúa el temporizador"
    example: "continúa el temporizador"
    response: "default"
    speech_to_phrase: true
