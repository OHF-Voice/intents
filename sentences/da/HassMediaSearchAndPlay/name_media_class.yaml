---
# HassMediaSearchAndPlay - name_media_class
# example: spil nummeret Bohemian Rhapsody på TV'et
# slots:
# - {name}
# - {search_query}
# - {media_class}

language: "da"
data:
  - sentences:
      - "spil {media_class} {search_query} på {name}"
      - "afspil {media_class} {search_query} på {name}"
    example: "spil nummeret Bohemian Rhapsody på TV'et"
    name_domains:
      - "media_player"
    response: "default"
