---
# HassMediaSearchAndPlay - name_area
# example: spil The Office på TV'et i køkkenet
# slots:
# - {name}
# - {area}
# - {search_query}

language: "da"

data:
  - sentences:
      - "spil {search_query} på {name} i {area}"
      - "afspil {search_query} på {name} i {area}"
    example: "spil The Office på TV'et i køkkenet"

    name_domains:
      - "media_player"

    response: "default"
