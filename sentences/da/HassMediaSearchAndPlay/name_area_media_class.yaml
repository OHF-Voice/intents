---
# HassMediaSearchAndPlay - name_area_media_class
# example: spil kunstneren Queen på TV'et i køkkenet
# slots:
# - {name}
# - {area}
# - {search_query}
# - {media_class}

language: "da"
data:
  - sentences:
      - "spil {media_class} {search_query} på {name} i {area}"
      - "afspil {media_class} {search_query} på {name} i {area}"
    example: "spil kunstneren Queen på TV'et i køkkenet"
    name_domains:
      - "media_player"
    response: "default"
