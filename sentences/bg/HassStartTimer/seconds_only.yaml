---
# HassStartTimer - seconds_only
language: "bg"
data:
  - sentences:
      - "(стартирай|настрой|създай|пусни|включи|задай) [моя|моят] таймер (за|от) ({timer_seconds:seconds}|{timer_words_seconds:seconds}) секунд(а|и)"
      - "(стартирай|настрой|създай|пусни|включи|задай) [моя|моят] (({timer_seconds:seconds}|{timer_words_seconds:seconds})[ |-]секунд(а|и|ен)|{timer_adjective_seconds:seconds}) таймер"
      - "(({timer_seconds:seconds}|{timer_words_seconds:seconds})[ |-]секунд(а|и|ен)|{timer_adjective_seconds:seconds}) таймер"
      - "таймер (за|от) ({timer_seconds:seconds}|{timer_words_seconds:seconds}) секунд(а|и)"
      - "(стартирай|настрой|създай|пусни|включи|задай) [моя|моят] таймер (за|от) {timer_half:seconds} минута"
      - "таймер (за|от) {timer_half:seconds} минута"
    example: "таймер за 30 секунди"
    response: "default"
