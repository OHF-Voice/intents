      - "[<turn>] درجة حرارة [ال]لون [ال]{name} [<to>] {color_temperature_names:temperature}"
      - "[<turn>] [ال]{name} [<to>] {color_temperature_names:temperature}"
    example: "اضبط درجة حرارة لون ضوء المطبخ الرئيسي الى 2700 كلفن"
    name_domains:
      - "light"
