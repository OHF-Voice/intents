---
# HassTurnOn - name_area_scene
# example: aktivera nattljus i sovrummet
# slots:
# - {name}
# - {area}

language: "sv"
data:
  - sentences:
      - "aktivera [scenen | scene] <name> <i_på> <area>"
      - "<slå_på> [scenen | scene] <name> <i_på> <area>"
      - "(ändra | övergå) till (<name> [scene] | scene <name>) <i_på> <area>"
    example: "aktivera nattljus i sovrummet"
    name_domains:
      - "scene"
    response: "scene"
