language: "tr"
data:
  - sentences:
      - "{timer_name:name} için {timer_hours:hours} saat[(lik|e|liğine)] <zamanlayici> <timer_kur>"
      - "{timer_name:name} adında {timer_hours:hours} saat[(lik|e|liğine)] <zamanlayici> <timer_kur>"
      - "{timer_hours:hours} saat[(lik|e|liğine)] {timer_name:name} <zamanlayicisi> <timer_kur>"
    example: "pizza için 1 saatlik zamanlayıcı kur"
    response: "default"
