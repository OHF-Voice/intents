---
# HassStartTimer - name_hours_seconds
# slots:
# - {name}
# - {hours}
# - {seconds}

language: "tr"
data:
  - sentences:
      - "{timer_name:name} için {timer_hours:hours} saat [ve] {timer_seconds:seconds} saniye[(lik|ye|liğine)] <zamanlayici> <timer_kur>"
      - "{timer_name:name} adında {timer_hours:hours} saat [ve] {timer_seconds:seconds} saniye[(lik|ye|liğine)] <zamanlayici> <timer_kur>"
      - "{timer_hours:hours} saat [ve] {timer_seconds:seconds} saniye[(lik|ye|liğine)] {timer_name:name} <zamanlayicisi> <timer_kur>"
    example: "pizza için 1 saat 30 saniyelik zamanlayıcı kur"
    response: "default"
