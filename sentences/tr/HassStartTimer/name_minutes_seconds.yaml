---
# HassStartTimer - name_minutes_seconds
# slots:
# - {name}
# - {minutes}
# - {seconds}

language: "tr"
data:
  - sentences:
      - "{timer_name:name} için {timer_minutes:minutes} dakika [ve] {timer_seconds:seconds} saniye[(lik|ye|liğine)] <zamanlayici> <timer_kur>"
      - "{timer_name:name} adında {timer_minutes:minutes} dakika [ve] {timer_seconds:seconds} saniye[(lik|ye|liğine)] <zamanlayici> <timer_kur>"
      - "{timer_minutes:minutes} dakika [ve] {timer_seconds:seconds} saniye[(lik|ye|liğine)] {timer_name:name} <zamanlayicisi> <timer_kur>"
    example: "pizza için 10 dakika 30 saniyelik zamanlayıcı kur"
    response: "default"
