---
# HassStartTimer - name_hours_minutes
# slots:
# - {name}
# - {hours}
# - {minutes}

language: "tr"
data:
  - sentences:
      - "{timer_name:name} için {timer_hours:hours} saat [ve] {timer_minutes:minutes} dakika[(lık|ya|lığına)] <zamanlayici> <timer_kur>"
      - "{timer_name:name} adında {timer_hours:hours} saat [ve] {timer_minutes:minutes} dakika[(lık|ya|lığına)] <zamanlayici> <timer_kur>"
      - "{timer_hours:hours} saat [ve] {timer_minutes:minutes} dakika[(lık|ya|lığına)] {timer_name:name} <zamanlayicisi> <timer_kur>"
    example: "pizza için 1 saat 10 dakikalık zamanlayıcı kur"
    response: "default"
