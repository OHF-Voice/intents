---
# HassIncreaseTimer - name_hours_minutes
# slots:
# - {name}
# - {hours}
# - {minutes}

language: "tr"
data:
  - sentences:
      - "{timer_name:name} <zamanlayicisina> {timer_hours:hours} saat [ve] {timer_minutes:minutes} dakika ekle"
      - "{timer_name:name} <zamanlayicisini> {timer_hours:hours} saat [ve] {timer_minutes:minutes} dakika <timer_uzat>"
    example: "pizza zamanlayıcısına 1 saat 5 dakika ekle"
    response: "default"
