---
# HassIncreaseTimer - name_hours_seconds
# slots:
# - {name}
# - {hours}
# - {seconds}

language: "tr"
data:
  - sentences:
      - "{timer_name:name} <zamanlayicisina> {timer_hours:hours} saat [ve] {timer_seconds:seconds} saniye ekle"
      - "{timer_name:name} <zamanlayicisini> {timer_hours:hours} saat [ve] {timer_seconds:seconds} saniye <timer_uzat>"
    example: "pizza zamanlayıcısına 1 saat 30 saniye ekle"
    response: "default"
