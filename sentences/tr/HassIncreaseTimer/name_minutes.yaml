---
# HassIncreaseTimer - name_minutes
# slots:
# - {name}
# - {minutes}

language: "tr"
data:
  - sentences:
      - "{timer_name:name} <zamanlayicisina> {timer_minutes:minutes} dakika ekle"
      - "{timer_name:name} <zamanlayicisini> {timer_minutes:minutes} dakika <timer_uzat>"
    example: "pizza zamanlayıcısına 5 dakika ekle"
    response: "default"
