---
# HassIncreaseTimer - name_seconds
# slots:
# - {name}
# - {seconds}

language: "tr"
data:
  - sentences:
      - "{timer_name:name} <zamanlayicisina> {timer_seconds:seconds} saniye ekle"
      - "{timer_name:name} <zamanlayicisini> {timer_seconds:seconds} saniye <timer_uzat>"
    example: "pizza zamanlayıcısına 30 saniye ekle"
    response: "default"
