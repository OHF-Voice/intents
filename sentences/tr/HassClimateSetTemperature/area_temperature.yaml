---
# HassClimateSetTemperature - area_temperature
# example: set the bedroom temperature to 30 degrees
# slots:
# - {area}
# - {temperature}

language: "tr"
data:
  # Alan hem bulunma ("Oturma Odasında ... ayarla") hem belirtme hâlinde
  # ("Oturma Odasını ... ayarla") kullanılabilir; ikisi de doğal Türkçedir.
  - sentences:
      - "{area}[(<de_hali>|<i_hali>)] {temperature} dereceye ayarla"
      - "{temperature} dereceye {area}[(<de_hali>|<i_hali>)] ayarla"
    example: "Oturma Odası 30 dereceye ayarla"
    response: "default"
