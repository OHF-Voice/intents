---
# HassTurnOff - area_domain
# slots:
# - {area}
# - {domain}

language: "tr"
data:
  # lights
  - sentences:
      - "{area}[<de_hali>] [<butun>] <isiklar>[<i_hali>] <kapat>"
    example: "Mutfaktaki ışıkları kapat"
    inferred_domain: "light"
    response: "lights_area"

  # fans
  - sentences:
      - "{area}[<de_hali>] [<butun>] <fanlar>[<i_hali>] (kapa|kapat|durdur)"
    example: "Mutfaktaki fanları kapat"
    inferred_domain: "fan"
    response: "fans_area"
