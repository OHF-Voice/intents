---
# HassTurnOff - name_area
# slots:
# - {name}
# - {area}

language: "tr"
data:
  # off-able domains
  - sentences:
      - "{area}[<de_hali>] {name}[<i_hali>] <kapat>"
    example: "Oturma Odasındaki Tavan Lambasını kapat"
    name_domains: "default"
    response: "default"

  # covers
  - sentences:
      - "{area}[<de_hali>] {name}[<i_hali>] <kapat_kapak>"
    example: "Oturma Odasındaki Sol Perdeyi indir"
    name_domains:
      - "cover"
    response: "cover"

  # valves
  - sentences:
      - "{area}[<de_hali>] {name}[<i_hali>] <kapat_kapak>"
    example: "Mutfaktaki Ana vanayı kapat"
    name_domains:
      - "valve"
    response: "valve"

  # locks
  - sentences:
      - "{area}[<de_hali>] {name}[<in_hali>] kilidini aç"
    example: "Mutfaktaki Ön kapının kilidini aç"
    name_domains:
      - "lock"
    response: "lock"
