---
# HassTurnOff - name_only
# slots: {name}

language: "tr"
data:
  # off-able domains (light, switch, fan, media_player, input_boolean)
  - sentences:
      - "{name}[<i_hali>] <kapat>"
    example: "Yatak Odası Lambasını kapat"
    name_domains: "default"
    response: "default"

  # covers
  - sentences:
      - "{name}[<i_hali>] <kapat_kapak>"
    example: "Sol Perdeyi kapat"
    name_domains:
      - "cover"
    response: "cover"

  # valves
  - sentences:
      - "{name}[<i_hali>] <kapat_kapak>"
    example: "Ana vanayı kapat"
    name_domains:
      - "valve"
    response: "valve"

  # locks
  - sentences:
      - "{name}[<in_hali>] kilidini aç"
    example: "Ön kapının kilidini aç"
    name_domains:
      - "lock"
    response: "lock"
