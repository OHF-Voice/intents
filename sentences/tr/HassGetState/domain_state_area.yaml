---
# HassGetState - domain_state_area
# slots:
# - {area}
# - {domain}
# - {state}

language: "tr"
data:
  - sentences:
      - "{area}[<de_hali>] {on_off_states:state} <isik> var <mi>"
    example: "Mutfakta açık ışık var mı"
    inferred_domain: "light"
    response: "any"

  - sentences:
      - "{area}[<de_hali>] [(bütün|tüm)] <isiklar_c> {on_off_states:state} <mi>"
    example: "Mutfakta bütün ışıklar açık mı"
    inferred_domain: "light"
    response: "all"

  - sentences:
      - "{area}[<de_hali>] hangi <isiklar_c> {on_off_states:state}"
    example: "Mutfakta hangi ışıklar açık"
    inferred_domain: "light"
    response: "which"

  - sentences:
      - "{area}[<de_hali>] <kac_tane> <isik> {on_off_states:state}"
    example: "Mutfakta kaç ışık açık"
    inferred_domain: "light"
    response: "how_many"

  - sentences:
      - "{area}[<de_hali>] {on_off_states:state} <fan_t> var <mi>"
    example: "Mutfakta açık fan var mı"
    inferred_domain: "fan"
    response: "any"

  - sentences:
