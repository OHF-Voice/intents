---
# HassGetState - domain_state_floor
# slots:
# - {floor}
# - {domain}
# - {state}

language: "tr"
data:
  - sentences:
      - "{floor}[<de_hali>] {on_off_states:state} <isik> var <mi>"
    example: "Üst Katta açık ışık var mı"
    inferred_domain: "light"
    response: "any"

  - sentences:
      - "{floor}[<de_hali>] [(bütün|tüm)] <isiklar_c> {on_off_states:state} <mi>"
    example: "Üst Katta bütün ışıklar açık mı"
    inferred_domain: "light"
    response: "all"

  - sentences:
      - "{floor}[<de_hali>] hangi <isiklar_c> {on_off_states:state}"
    example: "Üst Katta hangi ışıklar açık"
    inferred_domain: "light"
    response: "which"

  - sentences:
      - "{floor}[<de_hali>] <kac_tane> <isik> {on_off_states:state}"
    example: "Üst Katta kaç ışık açık"
    inferred_domain: "light"
    response: "how_many"

  - sentences:
      - "{floor}[<de_hali>] {on_off_states:state} <fan_t> var <mi>"
