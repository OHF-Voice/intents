---
# HassGetState - domain_state
# slots:
# - {domain}
# - {state}

language: "tr"
data:
  - sentences:
      - "{on_off_states:state} <isik> var <mi>"
    example: "açık ışık var mı"
    inferred_domain: "light"
    response: "any"

  - sentences:
      - "[(bütün|tüm)] <isiklar_c> {on_off_states:state} <mi>"
    example: "bütün ışıklar açık mı"
    inferred_domain: "light"
    response: "all"

  - sentences:
      - "hangi <isiklar_c> {on_off_states:state}"
    example: "hangi ışıklar açık"
    inferred_domain: "light"
    response: "which"

  - sentences:
      - "<kac_tane> <isik> {on_off_states:state}"
    example: "kaç ışık açık"
    inferred_domain: "light"
    response: "how_many"

  - sentences:
      - "{on_off_states:state} <fan_t> var <mi>"
    example: "açık fan var mı"
    inferred_domain: "fan"
    response: "any"

  - sentences:
      - "[(bütün|tüm)] <fanlar_c> {on_off_states:state} <mi>"
    example: "bütün fanlar açık mı"
    inferred_domain: "fan"
    response: "all"

  - sentences:
      - "hangi <fanlar_c> {on_off_states:state}"
    example: "hangi fanlar açık"
    inferred_domain: "fan"
    response: "which"

  - sentences:
      - "<kac_tane> <fan_t> {on_off_states:state}"
    example: "kaç fan açık"
    inferred_domain: "fan"
    response: "how_many"

  - sentences:
      - "{on_off_states:state} <priz> var <mi>"
    example: "açık priz var mı"
    inferred_domain: "switch"
    response: "any"

  - sentences:
      - "[(bütün|tüm)] <prizler_c> {on_off_states:state} <mi>"
    example: "bütün prizler açık mı"
    inferred_domain: "switch"
    response: "all"

  - sentences:
      - "hangi <prizler_c> {on_off_states:state}"
    example: "hangi prizler açık"
    inferred_domain: "switch"
    response: "which"

  - sentences:
      - "<kac_tane> <priz> {on_off_states:state}"
    example: "kaç priz açık"
    inferred_domain: "switch"
    response: "how_many"

  - sentences:
      - "{lock_states:state} <kilit> var <mi>"
    example: "kilitli kilit var mı"
    inferred_domain: "lock"
    response: "any"

  - sentences:
      - "[(bütün|tüm)] <kilitler_c> {lock_states:state} <mi>"
    example: "bütün kilitler kilitli mı"
    inferred_domain: "lock"
    response: "all"

  - sentences:
      - "hangi <kilitler_c> {lock_states:state}"
    example: "hangi kilitler kilitli"
    inferred_domain: "lock"
    response: "which"

  - sentences:
      - "<kac_tane> <kilit> {lock_states:state}"
    example: "kaç kilit kilitli"
    inferred_domain: "lock"
    response: "how_many"
