---
# HassLightSet - name_temperature
# slots:
# - {name}
# - {temperature}

language: "tr"
data:
  - sentences:
      - "{name}[<in_hali>] renk sıcaklığını {color_temperature:temperature} [kelvin] yap"
      - "{name}[<in_hali>] renk sıcaklığını {color_temperature_names:temperature} yap"
      - "{name}[<i_hali>] {color_temperature_names:temperature} yap"
    example: "Yatak Odası Lambasının renk sıcaklığını 2700 kelvin yap"
    name_domains:
      - "light"
    response: "temperature"
