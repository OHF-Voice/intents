---
# HassLightSet - name_color
# slots:
# - {name}
# - {color}

language: "tr"
data:
  - sentences:
      - "{name}[<i_hali>] {color} yap"
      - "{name}[<in_hali>] rengini {color} yap"
      - "{name}[<in_hali>] rengini {color}[<e_hali>] ayarla"
    example: "Yatak Odası Lambasını kırmızı yap"
    name_domains:
      - "light"
    response: "color"
