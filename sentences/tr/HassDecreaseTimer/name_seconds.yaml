---
# HassDecreaseTimer - name_seconds
# slots:
# - {name}
# - {seconds}

language: "tr"
data:
  - sentences:
      - "{timer_name:name} <zamanlayicisindan> {timer_seconds:seconds} saniye çıkar"
      - "{timer_name:name} <zamanlayicisini> {timer_seconds:seconds} saniye <timer_kisalt>"
    example: "pizza zamanlayıcısından 30 saniye çıkar"
    response: "default"
