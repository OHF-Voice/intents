---
# HassTurnOn - domain_only
# example: turn on the lights in here
# context_area: true

language: "tr"
data:
  # lights
  - sentences:
      - "[<butun>] [<burada>] <isiklar>[<i_hali>] (aç|yak)"
    example: "ışıkları aç"
    inferred_domain: "light"
    response: "lights_area"

  # fans
  - sentences:
      - "[<butun>] [<burada>] <fanlar>[<i_hali>] (aç|çalıştır)"
    example: "fanları aç"
    inferred_domain: "fan"
    response: "fans_area"
