---
# HassTurnOn - area_domain
# slots:
# - {area}
# - {domain}

language: "tr"
data:
  # lights
  - sentences:
      - "{area}[<de_hali>] [<butun>] <isiklar>[<i_hali>] (aç|yak)"
    example: "Mutfaktaki ışıkları aç"
    inferred_domain: "light"
    response: "lights_area"

  # fans
  - sentences:
      - "{area}[<de_hali>] [<butun>] <fanlar>[<i_hali>] (aç|çalıştır)"
    example: "Mutfaktaki fanları aç"
    inferred_domain: "fan"
    response: "fans_area"
