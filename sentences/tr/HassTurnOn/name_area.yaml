---
# HassTurnOn - name_area
# slots:
# - {name}
# - {area}

language: "tr"
data:
  # on-able domains
  - sentences:
      - "{area}[<de_hali>] {name}[<i_hali>] <ac>"
    example: "Oturma Odasındaki Tavan Lambasını aç"
    name_domains: "default"
    response: "default"

  # covers
  - sentences:
      - "{area}[<de_hali>] {name}[<i_hali>] <ac_kapak>"
    example: "Oturma Odasındaki Sol Perdeyi aç"
    name_domains:
      - "cover"
    response: "cover"

  # valves
  - sentences:
      - "{area}[<de_hali>] {name}[<i_hali>] <ac_kapak>"
    example: "Mutfaktaki Ana vanayı aç"
    name_domains:
      - "valve"
    response: "valve"

  # locks
  - sentences:
      - "{area}[<de_hali>] {name}[<i_hali>] kilitle"
    example: "Mutfaktaki Ön kapıyı kilitle"
    name_domains:
      - "lock"
    response: "lock"
