---
# HassTurnOn - name_only
# slots: {name}

language: "tr"
data:
  # on-able domains (light, switch, fan, media_player, input_boolean)
  - sentences:
      - "{name}[<i_hali>] <ac>"
    example: "Yatak Odası Lambasını aç"
    name_domains: "default"
    response: "default"

  # covers
  - sentences:
      - "{name}[<i_hali>] <ac_kapak>"
    example: "Sol Perdeyi aç"
    name_domains:
      - "cover"
    response: "cover"

  # valves
  - sentences:
      - "{name}[<i_hali>] <ac_kapak>"
    example: "Ana vanayı aç"
    name_domains:
      - "valve"
    response: "valve"

  # locks
  - sentences:
      - "{name}[<i_hali>] kilitle"
    example: "Ön kapıyı kilitle"
    name_domains:
      - "lock"
    response: "lock"
