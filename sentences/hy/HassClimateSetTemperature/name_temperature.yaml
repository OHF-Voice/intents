---
# HassClimateSetTemperature - name_temperature
# slots: {name}, {temperature}

language: hy
data:
  - sentences:
      - "<set> {name}[ի] ջերմաստիճանը {temperature}[ աստիճան[ի]|°]"
      - "<set> {name}[(ը|ն)] {temperature}[ աստիճան[ի]|°]"
    example: "դիր գրասենյակի թերմոստատի ջերմաստիճանը 22 աստիճան"
    name_domains:
      - "climate"
    response: "default"
