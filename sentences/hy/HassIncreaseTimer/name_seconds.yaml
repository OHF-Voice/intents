---
# HassIncreaseTimer - name_seconds
# slots: {name}, {seconds}

language: hy
data:
  - sentences:
      - "<timer_add> {timer_seconds:seconds} <second> {timer_name:name} <timer_named> <timer_to>"
      - "<timer_extend> {timer_name:name} <timer_named> <timer> {timer_seconds:seconds} <second>"
    example: "ավելացրու 30 վայրկյան պիցցա անունով ժամաչափին"
    response: "default"
