---
# HassIncreaseTimer - name_hours_seconds
# slots: {name}, {hours}, {seconds}

language: hy
data:
  - sentences:
      - "<timer_add> {timer_hours:hours} ժամ [<and>] {timer_seconds:seconds} <second> {timer_name:name} <timer_named> <timer_to>"
      - "<timer_extend> {timer_name:name} <timer_named> <timer> {timer_hours:hours} ժամ [<and>] {timer_seconds:seconds} <second>"
    example: "ավելացրու 1 ժամ 30 վայրկյան պիցցա անունով ժամաչափին"
    response: "default"
