---
# HassStartTimer - command_seconds
# slots: {conversation_command}, {seconds}

language: hy
data:
  - sentences:
      - "{timer_command:conversation_command} {timer_seconds:seconds} վայրկյան(ից| հետո| անց)"
      - "{timer_seconds:seconds} վայրկյան(ից| հետո| անց) {timer_command:conversation_command}"
    example: "անջատիր լույսերը 30 վայրկյան հետո"
    response: "command"
