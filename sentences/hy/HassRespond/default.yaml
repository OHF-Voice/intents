---
# HassRespond - default

language: hy
data:
  - sentences:
      - "(բարև|բարև ձեզ|ողջույն|բարի օր) [հոմ ասիսթանթ]"
    example: "բարև"
    response: "hello"

  - sentences:
      - "(դու|դուք) [միշտ|անընդհատ] (լսում|ձայնագրում) (ես|եք)"
    example: "դու միշտ լսում ես"
    response: "listening"

  - sentences:
      - "(ուր|ո՞ւր|որտեղ|որտե՞ղ) (է|են) գնում [իմ] տվյալները"
    example: "ուր են գնում իմ տվյալները"
    response: "data"

  - sentences:
      - "(ինչ|ի՞նչ) կարող եմ (ասել|հարցնել)"
    example: "ինչ կարող եմ հարցնել"
    response: "commands"

  - sentences:
      - "(ով|ո՞վ) (է ստեղծել|ստեղծեց|է պատրաստել) քեզ"
      - "քեզ (ով|ո՞վ) է (ստեղծել|պատրաստել)"
    example: "ով է ստեղծել քեզ"
    response: "creator"
