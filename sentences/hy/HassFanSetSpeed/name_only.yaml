---
# HassFanSetSpeed - name_only
# slots: {name}, {percentage}

language: hy
data:
  - sentences:
      - "<set> {name}[ի] արագությունը {fan_speed:percentage}[ %| տոկոս]"
      - "<set> {name}[(ը|ն)] {fan_speed:percentage}[ %| տոկոս]"
    example: "դիր առաստաղի օդափոխիչի արագությունը 50 տոկոս"
    name_domains:
      - "fan"
    response: "default"
