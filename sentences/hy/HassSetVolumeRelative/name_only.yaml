---
# HassSetVolumeRelative - name_only
# slots: {volume_step}, {name}

language: hy
data:
  - sentences:
      - "{volume_step} {name}[ի] <volume>"
      - "<volume_up> {name}[ի] <volume> {volume_step_up:volume_step}[ %| տոկոս[ով]]"
      - "<volume_down> {name}[ի] <volume> {volume_step_down:volume_step}[ %| տոկոս[ով]]"
    example: "բարձրացրու հեռուստացույցի ձայնը"
    name_domains:
      - "media_player"
    response: "default"
