---
# HassSetPosition - name_area
# slots: {name}, {area}, {position}

language: hy
data:
  - sentences:
      - "(<set>|<open>|<close>) {area}[ի] {name}[(ը|ն)] {position}[ %| տոկոս[ով|ի]]"
      - "(<set>|<open>|<close>) {name}[(ը|ն)] {area}[ում] {position}[ %| տոկոս[ով|ի]]"
    example: "դիր ննջասենյակի ձախ վարագույրը 50 տոկոս"
    name_domains:
      - "cover"
    response: "default"
