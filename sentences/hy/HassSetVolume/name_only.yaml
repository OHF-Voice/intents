---
# HassSetVolume - name_only
# slots: {name}, {volume_level}

language: hy
data:
  - sentences:
      - "<set_to> {name}[ի] <volume> {volume:volume_level}[ %| տոկոս[ի]]"
      - "(<volume_up>|<volume_down>) {name}[ի] <volume> մինչև {volume:volume_level}[ %| տոկոս[ի]]"
    example: "դիր հեռուստացույցի ձայնը 50 տոկոս"
    name_domains:
      - "media_player"
    response: "default"
