---
# HassLightSet - name_color
# example: set the overhead light to red
# slots:
# - {name}
# - {color}
# name domains: light

language: "th"

data:
  - sentences:
      - "[<set>][สี]{name}[(เป็น|ไปเป็น|ที่|ไปที่)][สี][ ]{color}"
    example: "ตั้งสีไฟห้องนอนเป็นสีแดง"
    name_domains:
      - "light"
    response: "color"
