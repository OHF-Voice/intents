---
# HassClimateGetTemperature - name_only
# example: quelle est la température du thermostat du bureau
# slots: {name}
language: fr
data:
  - sentences:
      - "Quelle est la température [<de>] [<le>]{name}"
      - "Combien fait-il [<dans>] [<le>]{name}"
      - "Il fait combien [<dans>] [<le>]{name}"
    name_domains:
      - "climate"
    example: "quelle est la température du thermostat du bureau"
    response: "default"
  - sentences:
      - "Quelle est la température de [<le>]{name}"
    example: "Quelle est la température de le Thermostat du salon"
    name_domains:
      - "climate"
    response: "default"
    speech_to_phrase: true
