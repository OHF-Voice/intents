---
# HassTurnOff - area_domain
# example: éteins les lumières de la cuisine
# slots:
# - {area}
# - {domain}

language: fr

data:
  # lights
  - sentences:
      - "<eteins> [<tous>] [<le>]<lumiere> [<dans>] [<le>]{area}"
      - "<eteins> [<le>]{area}"
    inferred_domain: "light"
    example: "éteins les lumières de la cuisine"
    response: "default"

  # fans
  - sentences:
      - "<eteins> [<tous>] [<le>]<ventilateurs> [<dans>] [<le>]{area}"
    inferred_domain: "fan"
    example: "éteins les ventilateurs du salon"
    response: "fans"
  - sentences:
      - "éteins les lumières dans [<le>]{area}"
    example: "éteins les lumières dans le Cuisine"
    inferred_domain: "light"
    response: "default"
    speech_to_phrase: true
  - sentences:
      - "éteins les ventilateurs dans [<le>]{area}"
    example: "éteins les ventilateurs dans le Cuisine"
    inferred_domain: "fan"
    response: "fans"
    speech_to_phrase: true
