---
# HassStartTimer - seconds_only
language: fr
data:
  - sentences:
      - "<minuteur> {timer_seconds:seconds} <second_unit>"
      - "<minuteur> (dans|pour) {timer_seconds:seconds} <second_unit>"
      - "<minuteur> de {timer_seconds:seconds} <second_unit>"
      - "<cree> un <minuteur> de {timer_seconds:seconds} <second_unit>"
      - "<active> un <minuteur> (dans|pour) {timer_seconds:seconds} <second_unit>"
      - "<mets> un <minuteur> de {timer_seconds:seconds} <second_unit>"
    example: "minuteur de 30 secondes"
    response: "default"
  - sentences:
      - "mets un minuteur de {timer_seconds:seconds} (seconde|secondes)"
      - "minuteur de {timer_seconds:seconds} (seconde|secondes)"
    example: "mets un minuteur de 30 seconde"
    response: "default"
    speech_to_phrase: true
