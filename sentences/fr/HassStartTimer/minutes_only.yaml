---
# HassStartTimer - minutes_only
language: fr
data:
  - sentences:
      - "<minuteur> {timer_minutes:minutes} <minute_unit>"
      - "<minuteur> (dans|pour) {timer_minutes:minutes} <minute_unit>"
      - "<minuteur> de {timer_minutes:minutes} <minute_unit>"
      - "<cree> un <minuteur> de {timer_minutes:minutes} <minute_unit>"
      - "<active> un <minuteur> (dans|pour) {timer_minutes:minutes} <minute_unit>"
      - "<mets> un <minuteur> de {timer_minutes:minutes} <minute_unit>"
    example: "minuteur de 5 minutes"
    response: "default"
  - sentences:
      - "mets un minuteur de {timer_minutes:minutes} (minute|minutes)"
      - "minuteur de {timer_minutes:minutes} (minute|minutes)"
    example: "mets un minuteur de 5 minute"
    response: "default"
    speech_to_phrase: true
