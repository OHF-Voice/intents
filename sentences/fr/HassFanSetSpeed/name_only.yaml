---
# HassFanSetSpeed - name_only
language: fr
data:
  - sentences:
      - "<regle> [<le>]{name} [(à|sur)] {fan_speed:percentage}<pourcent>"
      - "<regle> [la] vitesse [<de>] [<le>]{name} [(à|sur)] {fan_speed:percentage}<pourcent>"
    name_domains:
      - "fan"
    response: "default"
    example: "règle le ventilateur de plafond à 30%"
  - sentences:
      - "règle la vitesse de [<le>]{name} à {fan_speed:percentage} pour cent"
    example: "règle la vitesse de le ventilateur de plafond à 50 pour cent"
    name_domains:
      - "fan"
    response: "default"
    speech_to_phrase: true
