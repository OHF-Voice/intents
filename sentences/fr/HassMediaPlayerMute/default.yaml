---
# HassMediaPlayerMute - default
# example: sourdine
# context_area: true

language: fr
data:
  - sentences:
      - "<eteins> [<le>]<volume> [<ici>]"
      - "<mets> [<le>]<volume> en sourdine [<ici>]"
      - "sourdine [<ici>]"
      - "charrue"
    example: "sourdine"
    response: "default"
  # Speech-to-Phrase: lean subset of the block above, with the media noun
  # required so the STT grammar never has to recognise a bare "sourdine".
  - sentences:
      - "mets le son en sourdine"
      - "coupe le son"
    example: "mets le son en sourdine"
    response: "default"
    speech_to_phrase: true
