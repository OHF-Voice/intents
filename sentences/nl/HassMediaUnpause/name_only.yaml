---
# HassMediaUnpause - name_only
# example: hervat de TV
# slots: {name}

language: "nl"
data:
  - sentences:
      - "hervat [<the_media_item> op] [de|het] {name}"
      - "[<the_media_item> op] [de|het] {name} hervatten"
      - "[zet] [de|het] {name} [weer] op play"
      - "ga verder met <the_media_item> op [de|het] {name}"
    example: "hervat de TV"
    name_domains:
      - "media_player"
    response: "default"
