---
# HassMediaUnpause - default
# example: hervatten
# context_area: true

language: "nl"
data:
  - sentences:
      - "hervat [<the_media_item>]"
      - "[<the_media_item>] hervatten"
      - "[zet [<the_media_item>] [weer] op] play"
      - "[<the_media_item>] [weer] afspelen"
      - "ga verder met <the_media_item>"
    example: "hervatten"
    response: "default"
  # Speech-to-Phrase: lean subset of the block above, with the media noun
  # required so the STT grammar never has to recognise a bare "hervat".
  - sentences:
      - "hervat de (muziek|aflevering|film)"
    example: "hervat de muziek"
    response: "default"
    speech_to_phrase: true
