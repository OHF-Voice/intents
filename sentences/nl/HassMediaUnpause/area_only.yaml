      - "hervat [<the_media_item> (in|op)] [de|het] {area}"
      - "[<the_media_item> (in|op)] [de|het] {area} hervatten"
      - "[zet] [de|het] {area} [weer] op play"
      - "ga verder met <the_media_item> (in|op) [de|het] {area}"
      - "ga (in|op) [de|het] {area} verder met <the_media_item>"
      - "hervat het afspelen (in|op) [de|het] {area}"
      - "speel [<the_media_item>] [weer] (af|verder) (in|op) [de|het] {area}"
      - "ga (in|op) [de|het] {area} (verder|door)"
    example: "hervat de muziek in de woonkamer"
    response: "default"
