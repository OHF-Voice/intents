---
# HassGetState - name_only
# example: wat is de buitentemperatuur
# slots: {name}

language: "nl"
data:
  - sentences:
      - "<what_is> [de [huidige] <state> van] [de|het] {name}"
      - "<how_is> [de|het] {name}"
    example: "wat is de buitentemperatuur"
    name_domains: "default"
    response: "one"
  - sentences:
      - "wat is de waarde van [de|het] {name}"
    example: "wat is de waarde van de Buitentemperatuur"
    name_domains:
      - sensor
    response: "one"
    speech_to_phrase: true
