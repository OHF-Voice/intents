      - "(zet|draai) [het] volume [omhoog|omlaag] (op|naar) {volume:volume_level}[[ ]%|procent] (in|op) [de|het] {area}"
      - "verander [het] volume naar {volume:volume_level}[[ ]%|procent] (in|op) [de|het] {area}"
      - "(verhoog|verlaag) [het] volume naar {volume:volume_level}[[ ]%|procent] (in|op) [de|het] {area}"
      - "zet het {area} volume [omhoog|omlaag] (op|naar) {volume:volume_level}[[ ]%|procent]"
      - "((in|op) [de|het] {area};({volume:volume_level}[[ ]%|procent];volume))"
