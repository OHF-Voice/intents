---
# HassSetVolume - default
# slots: {volume_level}; context_area: true

language: "nl"
data:
  - sentences:
      - "(zet|draai) [het] volume [omhoog|omlaag] (op|naar) {volume:volume_level}[[ ]%|procent]"
      - "verander [het] volume naar {volume:volume_level}[[ ]%|procent]"
      - "(verhoog|verlaag) [het] volume naar {volume:volume_level}[[ ]%|procent]"
      - "({volume:volume_level}[[ ]%|procent];volume)"
    example: "zet het volume naar 90 procent"
    response: "default"
  - sentences:
      - "zet het volume op {volume:volume_level} procent"
    example: "zet het volume op 50 procent"
    response: "default"
    speech_to_phrase: true
