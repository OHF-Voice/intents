      - "verander <volume_noun> naar {volume:volume_level}[[ ]%|procent] op [de|het] {name}"
      - "(verhoog|verlaag) <volume_noun> naar {volume:volume_level}[[ ]%|procent] op [de|het] {name}"
      - "stel <volume_noun> in op {volume:volume_level}[[ ]%|procent] op [de|het] {name}"
