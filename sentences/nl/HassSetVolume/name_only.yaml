---
# HassSetVolume - name_only
# slots: {name}, {volume_level}

language: "nl"
data:
  - sentences:
      - "(zet|draai) op [de|het] {name} [het] volume [omhoog|omlaag] (op|naar) {volume:volume_level}[[ ]%|procent]"
      - "verander op [de|het] {name} [het] volume naar {volume:volume_level}[[ ]%|procent]"
      - "(verhoog|verlaag) op [de|het] {name} [het] volume naar {volume:volume_level}[[ ]%|procent]"
      - "(zet|draai) [het] volume [omhoog|omlaag] (op|naar) {volume:volume_level}[[ ]%|procent] op [de|het] {name}"
      - "verander [het] volume naar {volume:volume_level}[[ ]%|procent] op [de|het] {name}"
      - "(verhoog|verlaag) [het] volume naar {volume:volume_level}[[ ]%|procent] op [de|het] {name}"
      - "zet [de|het] {name} [omhoog|omlaag] (op|naar) {volume:volume_level}[[ ]%|procent]"
      - "zet [het] {name} volume [omhoog|omlaag] (op|naar) {volume:volume_level}[[ ]%|procent]"
      - "[het] {name} volume {volume:volume_level}[[ ]%|procent]"
      - "({volume:volume_level}[[ ]%|procent];volume) op [de|het] {name}"
    example: "zet het volume van de TV op 90 procent"
    name_domains:
      - "media_player"
    response: "default"
