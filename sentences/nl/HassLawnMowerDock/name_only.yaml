---
# HassLawnMowerDock - name_only
# slots: {name}

language: "nl"
data:
  - sentences:
      # stop Clippy / stop de grasmaaier Clippy
      - "(stop|dock) [de|het] {name}"
      - "(stop|dock) de grasmaaier {name}"
      # stuur Clippy terug
      - "stuur [de|het] {name} terug"
      - "stuur de grasmaaier {name} terug"
      # stuur Clippy (terug) naar huis / naar het basisstation / naar de basis
      - "[stuur] [de|het] {name} [terug] naar <lawn_mower_dock>"
      - "stuur de grasmaaier {name} [terug] naar <lawn_mower_dock>"
      # laat Clippy terug naar z'n basis gaan
      - "laat [de|het] {name} terug naar <lawn_mower_dock> gaan"
      - "laat de grasmaaier {name} terug naar <lawn_mower_dock> gaan"
    example: "stuur clippy terug naar huis"
    name_domains:
      - "lawn_mower"
    response: "default"
