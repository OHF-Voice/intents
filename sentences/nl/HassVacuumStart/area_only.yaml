---
# HassVacuumStart - area_only
# example: start de stofzuiger in de woonkamer
# slots: {area}
#
# These sentences always mention the vacuum itself. Sentences like
# "stofzuig de woonkamer" belong to HassVacuumCleanArea.

language: "nl"
data:
  - sentences:
      # start de stofzuiger in de woonkamer
      - "start de <vacuum> (in|op|van) [de|het] {area}"
      # zet de stofzuiger in de woonkamer aan
      - "(zet|doe|schakel) de <vacuum> (in|op|van) [de|het] {area} aan"
      # schakel de stofzuiger in de woonkamer in
      - "schakel de <vacuum> (in|op|van) [de|het] {area} in"
      # de stofzuiger in de woonkamer starten / aanzetten / inschakelen
      - "de <vacuum> (in|op|van) [de|het] {area} (starten|aan[ ](zetten|doen)|in[ ]schakelen)"
      # start de woonkamer stofzuiger
      - "start de {area}[ ]<vacuum>"
      # zet de woonkamer stofzuiger aan
      - "(zet|doe|schakel) de {area}[ ]<vacuum> aan"
      # laat de stofzuiger in de woonkamer starten
      - "laat de <vacuum> (in|op|van) [de|het] {area} (starten|beginnen)"
      # zet de stofzuiger aan in de woonkamer
      - "(zet|doe|schakel) de <vacuum> aan (in|op) [de|het] {area}"
    example: "start de stofzuiger in de woonkamer"
    response: "default"
