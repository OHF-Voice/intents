---
# HassVacuumStart - area_only
# example: start de stofzuiger in de woonkamer
# slots: {area}
#
# These sentences always mention the vacuum itself. Sentences like
# "stofzuig de woonkamer" belong to HassVacuumCleanArea.

language: "nl"
data:
  - sentences:
      # start de stofzuiger in de woonkamer
      - "start de (stofzuiger|robotstofzuiger|zuigrobot) (in|op|van) [de|het] {area}"
      # zet de stofzuiger in de woonkamer aan
      - "(zet|doe|schakel) de (stofzuiger|robotstofzuiger|zuigrobot) (in|op|van) [de|het] {area} aan"
      # schakel de stofzuiger in de woonkamer in
      - "schakel de (stofzuiger|robotstofzuiger|zuigrobot) (in|op|van) [de|het] {area} in"
      # de stofzuiger in de woonkamer starten / aanzetten / inschakelen
      - "de (stofzuiger|robotstofzuiger|zuigrobot) (in|op|van) [de|het] {area} (starten|aan[ ](zetten|doen)|in[ ]schakelen)"
      # start de woonkamer stofzuiger
      - "start de {area}[ ](stofzuiger|robotstofzuiger|zuigrobot)"
      # zet de woonkamer stofzuiger aan
      - "(zet|doe|schakel) de {area}[ ](stofzuiger|robotstofzuiger|zuigrobot) aan"
    example: "start de stofzuiger in de woonkamer"
    response: "default"
