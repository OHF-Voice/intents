---
# HassVacuumStart - floor_only
# example: stofzuig de eerste verdieping
# slots: {floor}
#
# A floor is either used with a preposition ("op de eerste verdieping")
# or as an adverb without preposition and article ("beneden").

language: "nl"
data:
  - sentences:
      # stofzuig de eerste verdieping / stofzuig beneden
      - "stofzuig [de|het] {floor}"
      # stofzuig op de eerste verdieping
      - "stofzuig (in|op) [de|het] {floor}"
      # maak de eerste verdieping schoon
      - "maak [de|het] {floor} schoon"
      # zuig stof op de eerste verdieping / zuig stof beneden
      - "zuig stof (in|op) [de|het] {floor}"
      - "zuig stof {floor}"
      # zuig op de eerste verdieping stof / zuig beneden stof
      - "zuig (in|op) [de|het] {floor} stof"
      - "zuig {floor} stof"
      # start de stofzuiger op de eerste verdieping / start de stofzuiger beneden
      - "start de <vacuum> (in|op|van) [de|het] {floor}"
      - "start de <vacuum> {floor}"
      # zet de stofzuiger op de eerste verdieping aan / zet de stofzuiger beneden aan
      - "(zet|doe|schakel) de <vacuum> (in|op|van) [de|het] {floor} aan"
      - "(zet|doe|schakel) de <vacuum> {floor} aan"
      # schakel de stofzuiger op de eerste verdieping in / schakel de stofzuiger beneden in
      - "schakel de <vacuum> (in|op|van) [de|het] {floor} in"
      - "schakel de <vacuum> {floor} in"
      # de stofzuiger op de eerste verdieping starten / de stofzuiger beneden aanzetten
      - "de <vacuum> (in|op|van) [de|het] {floor} (starten|aan[ ](zetten|doen)|in[ ]schakelen)"
      - "de <vacuum> {floor} (starten|aan[ ](zetten|doen)|in[ ]schakelen)"
      # laat de stofzuiger op de eerste verdieping starten / laat de stofzuiger beneden starten
      - "laat de <vacuum> (in|op|van) [de|het] {floor} (starten|beginnen)"
      - "laat de <vacuum> {floor} (starten|beginnen)"
      # zet de stofzuiger aan op de eerste verdieping / zet de stofzuiger aan beneden
      - "(zet|doe|schakel) de <vacuum> aan (in|op) [de|het] {floor}"
      - "(zet|doe|schakel) de <vacuum> aan {floor}"
      # laat de stofzuiger op de eerste verdieping stofzuigen / laat de stofzuiger beneden stofzuigen
      - "laat de <vacuum> (in|op) [de|het] {floor} (stofzuigen|schoonmaken)"
      - "laat de <vacuum> {floor} (stofzuigen|schoonmaken)"
    example: "stofzuig de eerste verdieping"
    response: "default"
