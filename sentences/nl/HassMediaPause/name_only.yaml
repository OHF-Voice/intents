---
# HassMediaPause - name_only
# example: TV pauzeren
# slots: {name}

language: "nl"
data:
  - sentences:
      - "(pauzeer|stop) [<the_media_item> op] [de|het] {name}"
      - "pauzeer het afspelen op [de|het] {name}"
      - "[zet] [<the_media_item> op] [de|het] {name} op (pauze|stop)"
      - "[<the_media_item> op] [de|het] {name} (op (pauze|stop) zetten|pauzeren|stoppen)"
    example: "TV pauzeren"
    name_domains:
      - "media_player"
    response: "default"
