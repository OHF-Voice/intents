---
# HassMediaPause - default
# example: pauzeren
# context_area: true

language: "nl"
data:
  - sentences:
      - "(pauzeren|pauzeer|stoppen)"
      - "(pauzeer|stop) [de|het] (lied[je[s]]|nummer[s]|track[s]|item[s]|aflevering[en]|video[s]|film[pje][s]|muziek[je[s]]|playlist[s]|afspeellijst[en])"
      - "[de|het] (lied[je[s]]|nummer[s]|track[s]|item[s]|aflevering[en]|video[s]|film[pje][s]|muziek[je[s]]|playlist[s]|afspeellijst[en]) (pauzeren|stoppen)"
      - "[zet [[de|het] (lied[je[s]]|nummer[s]|track[s]|item[s]|aflevering[en]|video[s]|film[pje][s]|muziek[je[s]]|playlist[s]|afspeellijst[en])] op] (pauze|stop)"
    example: "pauzeren"
    response: "default"
  # Speech-to-Phrase: lean subset of the block above, with the media noun
  # required so the STT grammar never has to recognise a bare "pauzeer".
  - sentences:
      - "(pauzeer|stop) de (muziek|aflevering|film)"
    example: "pauzeer de muziek"
    response: "default"
    speech_to_phrase: true
