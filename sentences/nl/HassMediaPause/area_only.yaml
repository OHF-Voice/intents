---
# HassMediaPause - area_only
# example: pauzeer de muziek in de woonkamer
# slots: {area}

language: "nl"
data:
  - sentences:
      - "(pauzeer|stop) [<the_media_item> (in|op)] [de|het] {area}"
      - "(pauzeer|stop) (in|op) [de|het] {area} <the_media_item>"
      - "[de|het] {area} pauze"
      - "[zet] [<the_media_item> (in|op)] [de|het] {area} op (pauze|stop)"
      - "zet (in|op) [de|het] {area} <the_media_item> op (pauze|stop)"
      - "[<the_media_item> (in|op)] [de|het] {area} (op (pauze|stop) zetten|pauzeren|stoppen)"
    example: "pauzeer de muziek in de woonkamer"
    response: "default"
