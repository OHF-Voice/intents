      - "zet [de|het] {name} op <next_media_item>"
      - "ga naar <next_media_item> op [de|het] {name}"
      - "zet <next_media_item> op [de|het] {name} op"
      - "sla [<current_media_item>|<the_media_item>|<this_media_item>|dit] op [de|het] {name} over"
      - "([op] [de|het] {name};<next_media_item>) (opzetten|afspelen)"
    example: "volgende filmpje op de TV"
    name_domains:
      - "media_player"
    response: "default"
