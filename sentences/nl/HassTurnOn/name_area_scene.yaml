      # (de scène) feestmodus in de woonkamer activeren
      - "[[de] (scene|scène)] [de|het] {name}[ ][scene|scène] (in|op|van|bij|voor) [de|het] {area} (aan[ ](zetten|doen)|in[ ]schakelen|starten|activeren)"
      - "(in|op|van|bij|voor) [de|het] {area} [[de] (scene|scène)] [de|het] {name}[ ][scene|scène] (aan[ ](zetten|doen)|in[ ]schakelen|starten|activeren)"
      # schakel (over) naar (de scène) feestmodus in de woonkamer
      - "(schakel|verander|wissel|ga) [over] naar [[de] (scene|scène)] [de|het] {name}[ ][scene|scène] (in|op|van|bij|voor) [de|het] {area}"
