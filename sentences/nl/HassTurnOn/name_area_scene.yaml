      # zet de woonkamer op (de scène) feestmodus
      - "(zet|schakel|verander) [de|het] {area} (op|naar) [[de] (scene|scène)] [de|het] {name}[ ][scene|scène]"
      # scène feestmodus in de woonkamer
      - "[de] (scene|scène) [de|het] {name} (in|op|van|bij|voor) [de|het] {area}"
    example: "activeer de scène feestmodus in de woonkamer"
    name_domains:
