      # zet (de scène) feestmodus in de woonkamer aan
      - "[<change>] [[de] (scene|scène)] [de|het] {name}[ ][scene|scène] (in|op|van|bij|voor) [de|het] {area} aan"
      - "[<change>] (in|op|van|bij|voor) [de|het] {area} [[de] (scene|scène)] [de|het] {name}[ ][scene|scène] aan"
