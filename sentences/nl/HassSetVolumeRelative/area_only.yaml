---
# HassSetVolumeRelative - area_only
# slots: {volume_step}, {area}

language: "nl"
data:
  - sentences:
      # relative direction (up/down)
      - "het {area} volume {volume_step}"
      - "[(draai|zet) ]<volume_target> [<a_bit>] {volume_step} (in|op) [de|het] {area}"
      - "{volume_step_verb:volume_step} <volume_noun> (in|op) [de|het] {area}"
      - "{volume_step_verb:volume_step} het {area} volume"
      - "[(draai|zet) ](in|op) [de|het] {area} <volume_target> [<a_bit>] {volume_step}"
      - "(draai|zet) <volume_target> (in|op) [de|het] {area} [<a_bit>] {volume_step}"
      - "{volume_step_verb:volume_step} (in|op) [de|het] {area} <volume_noun>"
      - "<volume_noun> {volume_step_infinitive:volume_step} (in|op) [de|het] {area}"
      # by a percentage (up)
      - "het {area} volume (omhoog|hoger) [met] {volume_step_up:volume_step}[%| procent]"
      - "verhoog <volume_noun> (in|op) [de|het] {area} [met] {volume_step_up:volume_step}[%| procent]"
      - "verhoog het {area} volume [met] {volume_step_up:volume_step}[%| procent]"
      # by a percentage (down)
      - "het {area} volume (omlaag|lager|naar beneden) [met] {volume_step_down:volume_step}[%| procent]"
      - "verlaag <volume_noun> (in|op) [de|het] {area} [met] {volume_step_down:volume_step}[%| procent]"
      - "verlaag het {area} volume [met] {volume_step_down:volume_step}[%| procent]"
    example: "verlaag het volume in de keuken"
    response: "default"
