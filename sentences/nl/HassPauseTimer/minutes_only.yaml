      - "pauzeer [de|mijn|m'n] {timer_minutes:start_minutes} (minuut|minuten) <timer>"
      - "pauzeer [de|mijn|m'n] <timer> van {timer_minutes:start_minutes} (minuut|minuten)"
      - "[de|mijn|m'n] {timer_minutes:start_minutes} (minuut|minuten) <timer> (pauzeren|op pauze zetten)"
    example: "pauzeer 5 minuten timer"
    response: "default"
