---
# HassClimateSetFanMode - name_fan_mode
# example: zet de ventilatormodus van de thermostaat op auto
# slots: {name}, {fan_mode}

language: "nl"
data:
  # A bare "ventilator" is safe here: {name} is scoped to climate, so a fan
  # entity cannot match it.
  - sentences:
      # zet de ventilatormodus van de thermostaat op auto
      - "zet de <fan_mode_name> van [de|het] {name} op {fan_mode}"
      - "verander de <fan_mode_name> van [de|het] {name} naar {fan_mode}"
      - "stel de <fan_mode_name> van [de|het] {name} in op {fan_mode}"
      - "de <fan_mode_name> van [de|het] {name} op {fan_mode} (zetten|in[ ]stellen)"
      - "de <fan_mode_name> van [de|het] {name} naar {fan_mode} veranderen"
      # zet de ventilator van de thermostaat op auto
      - "zet de (ventilator|fan) van [de|het] {name} op {fan_mode}"
      - "verander de (ventilator|fan) van [de|het] {name} naar {fan_mode}"
      - "stel de (ventilator|fan) van [de|het] {name} in op {fan_mode}"
      - "de (ventilator|fan) van [de|het] {name} op {fan_mode} (zetten|in[ ]stellen)"
      - "de (ventilator|fan) van [de|het] {name} naar {fan_mode} veranderen"
      # zet de kantoorthermostaat ventilator(modus) op auto
      - "zet [de] {name}[ ](ventilator|fan|<fan_mode_name>) op {fan_mode}"
      - "verander [de] {name}[ ](ventilator|fan|<fan_mode_name>) naar {fan_mode}"
      - "stel [de] {name}[ ](ventilator|fan|<fan_mode_name>) in op {fan_mode}"
    example: "zet de ventilatormodus van de thermostaat op auto"
    name_domains:
      - "climate"
    response: "default"
