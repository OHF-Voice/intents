---
# HassLawnMowerStartMowing - name_only
# slots: {name}

language: "nl"
data:
  - sentences:
      # start Clippy / start de grasmaaier Clippy
      - "start [de|het] {name}"
      - "start de grasmaaier {name}"
      # laat Clippy (het gras) maaien
      - "laat [de|het] {name} ([het] gras[ ]maaien|maaien)"
      - "laat de grasmaaier {name} ([het] gras[ ]maaien|maaien)"
    example: "laat clippy maaien"
    name_domains:
      - "lawn_mower"
    response: "default"
