---
# HassClimateSetTemperature - name_temperature
# slots: {name}, {temperature}

language: "nl"
data:
  - sentences:
      # zet de temperatuur van de woonkamerthermostaat op 21 graden
      - "<value_set_op> de temperatuur van [de|het] {name} op {temperature}[<degrees>]"
      - "<value_set_naar> de temperatuur van [de|het] {name} naar {temperature}[<degrees>]"
      # zet de woonkamerthermostaat temperatuur op 21 graden
      - "<value_set_op> [de] {name}[ ]temperatuur op {temperature}[<degrees>]"
      - "<value_set_naar> [de] {name}[ ]temperatuur naar {temperature}[<degrees>]"
      # zet de woonkamerthermostaat op 21 graden
      - "<value_set_op> [de|het] {name} op {temperature}<degrees>"
      - "<value_set_naar> [de|het] {name} naar {temperature}<degrees>"
      # stel de woonkamerthermostaat in op 21 graden
      - "stel de temperatuur van [de|het] {name} in op {temperature}[<degrees>]"
      - "stel [de] {name}[ ]temperatuur in op {temperature}[<degrees>]"
      - "stel [de|het] {name} in op {temperature}<degrees>"
      # shorthand without a verb
      - "[de] {name}[ ]temperatuur [<to>] {temperature}[<degrees>]"
      - "[de] temperatuur van [de|het] {name} [<to>] {temperature}[<degrees>]"
      - "[de|het] {name} [<to>] {temperature}<degrees>"
      # infinitive: de temperatuur van de woonkamerthermostaat op 21 graden zetten
      - "[de] {name}[ ]temperatuur op {temperature}[<degrees>] <value_set_op_infinitive>"
      - "[de] {name}[ ]temperatuur naar {temperature}[<degrees>] <value_set_naar_infinitive>"
      - "[de] temperatuur van [de|het] {name} op {temperature}[<degrees>] <value_set_op_infinitive>"
      - "[de] temperatuur van [de|het] {name} naar {temperature}[<degrees>] <value_set_naar_infinitive>"
      - "[de|het] {name} op {temperature}<degrees> <value_set_op_infinitive>"
      - "[de|het] {name} naar {temperature}<degrees> <value_set_naar_infinitive>"
    example: "zet de woonkamerthermostaat op 19 graden"
    name_domains:
      - "climate"
    response: "default"
