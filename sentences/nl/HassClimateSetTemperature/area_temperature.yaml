---
# HassClimateSetTemperature - area_temperature
# slots: {area}, {temperature}

language: "nl"
data:
  - sentences:
      # zet de verwarming in de woonkamer op 21 graden
      - "<value_set_op> de <temp> (in|op|van) [de|het] {area} op {temperature}[<degrees>]"
      - "<value_set_naar> de <temp> (in|op|van) [de|het] {area} naar {temperature}[<degrees>]"
      # zet de verwarming op 21 graden in de woonkamer
      - "<value_set_op> de <temp> op {temperature}[<degrees>] (in|op|van) [de|het] {area}"
      - "<value_set_naar> de <temp> naar {temperature}[<degrees>] (in|op|van) [de|het] {area}"
      # zet de woonkamertemperatuur op 21 graden
      - "<value_set_op> [de] {area}[ ]<temp> op {temperature}[<degrees>]"
      - "<value_set_naar> [de] {area}[ ]<temp> naar {temperature}[<degrees>]"
      # zet de woonkamer op 21 graden
      - "<value_set_op> [de|het] {area} op {temperature}<degrees>"
      - "<value_set_naar> [de|het] {area} naar {temperature}<degrees>"
      # stel de verwarming in de woonkamer in op 21 graden
      - "stel de <temp> (in|op|van) [de|het] {area} in op {temperature}[<degrees>]"
      - "stel [de] {area}[ ]<temp> in op {temperature}[<degrees>]"
      - "stel [de|het] {area} in op {temperature}<degrees>"
      # zet in de woonkamer de verwarming op 21 graden
      - "<value_set_op> (in|op) [de|het] {area} de <temp> op {temperature}[<degrees>]"
      - "<value_set_naar> (in|op) [de|het] {area} de <temp> naar {temperature}[<degrees>]"
      - "stel (in|op) [de|het] {area} de <temp> in op {temperature}[<degrees>]"
      # maak het in de woonkamer 21 graden / maak het 21 graden in de woonkamer
      - "maak het (in|op) [de|het] {area} {temperature}<degrees>"
      - "maak het {temperature}<degrees> (in|op) [de|het] {area}"
      # verwarm de woonkamer tot 21 graden / koel de slaapkamer af naar 18 graden
      - "verwarm [de|het] {area} (naar|tot) {temperature}[<degrees>]"
      - "koel [de|het] {area} [af] (naar|tot) {temperature}[<degrees>]"
      # shorthand without a verb: woonkamer temperatuur op 21 graden / woonkamer 21 graden
      - "[de] {area}[ ]<temp> [<to>] {temperature}[<degrees>]"
      - "[de] <temp> (in|op|van) [de|het] {area} [<to>] {temperature}[<degrees>]"
      - "[de|het] {area} [<to>] {temperature}<degrees>"
      # infinitive: de temperatuur in de woonkamer op 21 graden zetten
      - "[de] {area}[ ]<temp> op {temperature}[<degrees>] <value_set_op_infinitive>"
      - "[de] {area}[ ]<temp> naar {temperature}[<degrees>] <value_set_naar_infinitive>"
      - "[de] <temp> (in|op|van) [de|het] {area} op {temperature}[<degrees>] <value_set_op_infinitive>"
      - "[de] <temp> (in|op|van) [de|het] {area} naar {temperature}[<degrees>] <value_set_naar_infinitive>"
      - "[de|het] {area} op {temperature}<degrees> <value_set_op_infinitive>"
      - "[de|het] {area} naar {temperature}<degrees> <value_set_naar_infinitive>"
    example: "zet de woonkamer temperatuur op 19 graden"
    response: "default"
