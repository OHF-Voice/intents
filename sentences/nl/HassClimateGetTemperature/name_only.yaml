---
# HassClimateGetTemperature - name_only
# slots: {name}

language: "nl"
data:
  - sentences:
      - "wat is de [huidige] {name}[ ]temperatuur"
      - "wat is de [huidige] temperatuur van [de|het] {name}"
      - "hoe <warm> is [de|het] {name}"
    example: "wat is de temperatuur van de woonkamerthermostaat"
    name_domains:
      - "climate"
    response: "default"
  # target temperature (the temperature the thermostat is set to)
  - sentences:
      - "<at_what_temp> (is|staat) [de|het] {name} ingesteld"
      - "<at_what_temp> staat [de|het] {name}"
      - "hoe [hoog|laag|<warm>] (is|staat) [de|het] {name} ingesteld"
      - "hoe (hoog|laag|<warm>) staat [de|het] {name}"
      - "wat is de <target_temp> van [de|het] {name}"
    example: "op hoeveel graden staat de woonkamerthermostaat ingesteld"
    name_domains:
      - "climate"
    response: "target_temperature"
  - sentences:
      - "Wat is de temperatuur van [de|het] {name}"
    example: "Wat is de temperatuur van de Thermostaat"
    name_domains:
      - "climate"
    response: "default"
    speech_to_phrase: true
