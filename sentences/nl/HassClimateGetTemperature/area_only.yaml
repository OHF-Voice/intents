---
# HassClimateGetTemperature - area_only
# slots: {area}

language: "nl"
data:
  - sentences:
      - "Wat is [de] [huidige] temperatuur [in|op|van|bij] [de|het] {area}"
      - "Hoe <warm> is het [in|op|van|bij] [de|het] {area}"
      - "Wat is de {area}[ ]temperatuur"
    example: "wat is de temperatuur in de woonkamer"
    response: "default"
  # target temperature (the temperature the thermostat is set to)
  - sentences:
      - "<at_what_temp> (is|staat) <thermostat> (in|op) [de|het] {area} ingesteld"
      - "<at_what_temp> staat <thermostat> (in|op) [de|het] {area}"
      - "hoe [hoog|laag|<warm>] (is|staat) <thermostat> (in|op) [de|het] {area} ingesteld"
      - "hoe (hoog|laag|<warm>) staat <thermostat> (in|op) [de|het] {area}"
      - "wat is de <target_temp> (in|op|van) [de|het] {area}"
    example: "op hoeveel graden staat de verwarming in de woonkamer"
    response: "target_temperature"
  - sentences:
      - "Wat is de temperatuur in [de|het] {area}"
    example: "Wat is de temperatuur in de Keuken"
    response: "default"
    speech_to_phrase: true
