      - "voeg {todo_list_item:item} (aan|op) <lijstje_lidw> {name}<lijstje_achter_naam> toe"
      - "voeg {todo_list_item:item} (aan|op) [<naam_lidw>] {name} toe"
      - "zet {todo_list_item:item} op <lijst_lidw> {name}<lijst_achter_naam>"
      - "zet {todo_list_item:item} op <lijstje_lidw> {name}<lijstje_achter_naam>"
