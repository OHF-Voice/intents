---
# HassListAddItem - name_item
# example: add apples to my shopping list
# slots: {item}, {name}

language: "nl"
data:
  - sentences:
      - "voeg {todo_list_item:item} toe (aan|op) <lijst_lidw> {name}<lijst_achter_naam>"
      - "voeg {todo_list_item:item} toe (aan|op) <lijstje_lidw> {name}<lijstje_achter_naam>"
      - "voeg {todo_list_item:item} toe (aan|op) [<naam_lidw>] {name}"
      - "voeg {todo_list_item:item} toe (aan|op) (de lijst|het lijstje) {name}"
      - "voeg {todo_list_item:item} (aan|op) <lijst_lidw> {name}<lijst_achter_naam> toe"
      - "voeg {todo_list_item:item} (aan|op) <lijstje_lidw> {name}<lijstje_achter_naam> toe"
      - "voeg {todo_list_item:item} (aan|op) [<naam_lidw>] {name} toe"
      - "voeg {todo_list_item:item} (aan|op) (de lijst|het lijstje) {name} toe"
      - "(zet|schrijf) {todo_list_item:item} op <lijst_lidw> {name}<lijst_achter_naam>"
      - "(zet|schrijf) {todo_list_item:item} op <lijstje_lidw> {name}<lijstje_achter_naam>"
      - "(zet|schrijf) {todo_list_item:item} op [<naam_lidw>] {name}"
      - "(zet|schrijf) {todo_list_item:item} op (de lijst|het lijstje) {name}"
      - "{todo_list_item:item} op <lijst_lidw> {name}<lijst_achter_naam> (zetten|schrijven)"
      - "{todo_list_item:item} op <lijstje_lidw> {name}<lijstje_achter_naam> (zetten|schrijven)"
      - "{todo_list_item:item} op [<naam_lidw>] {name} (zetten|schrijven)"
      - "{todo_list_item:item} op (de lijst|het lijstje) {name} (zetten|schrijven)"
      - "{todo_list_item:item} aan <lijst_lidw> {name}<lijst_achter_naam> toevoegen"
      - "{todo_list_item:item} aan <lijstje_lidw> {name}<lijstje_achter_naam> toevoegen"
      - "{todo_list_item:item} aan [<naam_lidw>] {name} toevoegen"
      - "{todo_list_item:item} aan (de lijst|het lijstje) {name} toevoegen"
    example: "voeg appels toe aan mijn boodschappenlijst"
    name_domains:
      - "todo"
    response: "item_added"
