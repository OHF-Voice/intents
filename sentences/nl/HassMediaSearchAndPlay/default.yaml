---
# HassMediaSearchAndPlay - default
# example: speel The Office
# slots: {search_query}; context_area: true

language: "nl"
data:
  - sentences:
      - "speel {search_query} [af]"
      - "(luister|kijk) naar {search_query}"
      - "zet {search_query} op"
      - "ik wil [graag] naar {search_query} luisteren"
      - "ik wil [graag] {search_query} (kijken|zien)"
    example: "speel The Office"
    response: "default"
