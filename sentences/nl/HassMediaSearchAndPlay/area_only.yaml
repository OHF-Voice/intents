---
# HassMediaSearchAndPlay - area_only
# example: speel Barry White in de slaapkamer
# slots: {area}, {search_query}

language: "nl"
data:
  - sentences:
      - "(luister|kijk) (naar {search_query};(in|op) [de|het] {area})"
      - "speel {search_query} (in|op) [de|het] {area} [af]"
      - "speel {search_query} af (in|op) [de|het] {area}"
      - "zet {search_query} op in [de|het] {area}"
      - "zet {search_query} (in|op) [de|het] {area} op"
    example: "speel Barry White in de slaapkamer"
    response: "default"
