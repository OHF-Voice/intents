---
# HassLightSet - color_only
# example: maak de lampen blauw
# slots: {color}
# context_area: true

language: "nl"
data:
  - sentences:
      # maak blauw / zet op (de kleur) blauw / verander naar|in blauw / laat blauw branden
      - "maak [de kleur van] <the_lights> [<here>] {color}"
      - "<light_color_op> [de kleur van] <the_lights> [<here>] op [de kleur] {color}"
      - "verander [de kleur van] <the_lights> [<here>] (naar|in) {color}"
      - "laat <the_lights> [<here>] {color} (branden|schijnen)"
      - "maak [de kleur van] <the_lights> {color} <here>"
      - "<light_color_op> [de kleur van] <the_lights> op [de kleur] {color} <here>"
      - "verander [de kleur van] <the_lights> (naar|in) {color} <here>"
      - "laat <the_lights> {color} (branden|schijnen) <here>"
      # infinitive: de lamp blauw maken / op blauw zetten / naar blauw veranderen
      - "[de kleur van] <the_lights> [<here>] {color} [kunnen] maken"
      - "[de kleur van] <the_lights> [<here>] op [de kleur] {color} <light_color_op_infinitive>"
      - "[de kleur van] <the_lights> [<here>] (naar|in) {color} <light_color_naar_infinitive>"
      # short form without a verb: de lampen blauw
      - "<the_lights> [<here>] {color}"
    example: "maak de lampen blauw"
    inferred_domain: "light"
    response: "color"
