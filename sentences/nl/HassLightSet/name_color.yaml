---
# HassLightSet - name_color
# example: maak het slaapkamerlampje blauw
# slots:
# - {name}
# - {color}

language: "nl"
data:
  - sentences:
      # maak blauw / zet op (de kleur) blauw / verander naar|in blauw / laat blauw branden
      - "maak [de kleur van] [de|het] {name}[ <light_no_article>] {color}"
      - "<light_color_op> [de kleur van] [de|het] {name}[ <light_no_article>] op [de kleur] {color}"
      - "verander [de kleur van] [de|het] {name}[ <light_no_article>] (naar|in) {color}"
      - "laat [de|het] {name}[ <light_no_article>] {color} (branden|schijnen)"
      # infinitive: de lamp blauw maken / op blauw zetten / naar blauw veranderen
      - "[de kleur van] [de|het] {name}[ <light_no_article>] {color} [kunnen] maken"
      - "[de kleur van] [de|het] {name}[ <light_no_article>] op [de kleur] {color} <light_color_op_infinitive>"
      - "[de kleur van] [de|het] {name}[ <light_no_article>] (naar|in) {color} <light_color_naar_infinitive>"
      # short form without a verb: slaapkamerlampje blauw
      - "[de|het] {name} {color}"
    example: "maak het slaapkamerlampje blauw"
    name_domains:
      - "light"
    response: "color"
