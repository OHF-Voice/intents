---
# HassLightSet - area_color
# example: maak de slaapkamer blauw
# slots:
# - {area}
# - {color}

language: "nl"
data:
  - sentences:
      # maak blauw / zet op (de kleur) blauw / verander naar|in blauw / laat blauw branden
      - "maak [de kleur van] <the_lights> (in|op) [de|het] {area} {color}"
      - "<light_color_op> [de kleur van] <the_lights> (in|op) [de|het] {area} op [de kleur] {color}"
      - "verander [de kleur van] <the_lights> (in|op) [de|het] {area} (naar|in) {color}"
      - "laat <the_lights> (in|op) [de|het] {area} {color} (branden|schijnen)"
      - "maak [de kleur van] [de|het] {area}[ <light_no_article>] {color}"
      - "<light_color_op> [de kleur van] [de|het] {area}[ <light_no_article>] op [de kleur] {color}"
      - "verander [de kleur van] [de|het] {area}[ <light_no_article>] (naar|in) {color}"
      - "laat [de|het] {area}[ <light_no_article>] {color} (branden|schijnen)"
      # infinitive: de lamp blauw maken / op blauw zetten / naar blauw veranderen
      - "[de kleur van] <the_lights> (in|op) [de|het] {area} {color} [kunnen] maken"
      - "[de kleur van] <the_lights> (in|op) [de|het] {area} op [de kleur] {color} <light_color_op_infinitive>"
      - "[de kleur van] <the_lights> (in|op) [de|het] {area} (naar|in) {color} <light_color_naar_infinitive>"
      - "[de kleur van] [de|het] {area}[ <light_no_article>] {color} [kunnen] maken"
      - "[de kleur van] [de|het] {area}[ <light_no_article>] op [de kleur] {color} <light_color_op_infinitive>"
      - "[de kleur van] [de|het] {area}[ <light_no_article>] (naar|in) {color} <light_color_naar_infinitive>"
      # short form without a verb: slaapkamer blauw
      - "[de|het] {area}[ <light_no_article>] {color}"
    example: "maak de slaapkamer blauw"
    inferred_domain: "light"
    response: "color"
