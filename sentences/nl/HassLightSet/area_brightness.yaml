      - "<light_set_op> <the_lights> (in|op) [de|het] {area} op <brightness_target_noun>"
      - "<light_set_naar> <the_lights> (in|op) [de|het] {area} naar <brightness_target_noun>"
      - "dim <the_lights> (in|op) [de|het] {area} <light_dim_to> <brightness_dim_target_noun>"
      - "stel <the_lights> (in|op) [de|het] {area} in op <brightness_target_noun>"
      - "<light_set_op> [de|het] {area}[ <light_no_article>] op <brightness_target_noun>"
      - "<light_set_naar> [de|het] {area}[ <light_no_article>] naar <brightness_target_noun>"
