---
# HassLightSet - area_brightness
# example: zet de helderheid in de slaapkamer naar 75%
# slots:
# - {area}
# - {brightness}

language: "nl"
data:
  - sentences:
      # zet/verander/dim/stel in: brightness noun
      - "<light_set_op> de <brightness_no_article> (in|op|van) [de|het] {area} op <brightness_target>"
      - "<light_set_naar> de <brightness_no_article> (in|op|van) [de|het] {area} naar <brightness_target>"
      - "dim de <brightness_no_article> (in|op|van) [de|het] {area} <light_dim_to> <brightness_dim_target>"
      - "<light_set_op> de <brightness_no_article> van (de lampen|alle lampen) (in|op) [de|het] {area} op <brightness_target>"
      - "<light_set_naar> de <brightness_no_article> van (de lampen|alle lampen) (in|op) [de|het] {area} naar <brightness_target>"
      - "dim de <brightness_no_article> van (de lampen|alle lampen) (in|op) [de|het] {area} <light_dim_to> <brightness_dim_target>"
      - "<light_set_op> [de] {area}[ <light_no_article>] <brightness_no_article> op <brightness_target>"
      - "<light_set_naar> [de] {area}[ <light_no_article>] <brightness_no_article> naar <brightness_target>"
      - "dim [de] {area}[ <light_no_article>] <brightness_no_article> <light_dim_to> <brightness_dim_target>"
      # zet/verander/dim/stel in: the light itself
      - "<light_set_op> (de lampen|alle lampen) (in|op) [de|het] {area} op <brightness_target_noun>"
      - "<light_set_naar> (de lampen|alle lampen) (in|op) [de|het] {area} naar <brightness_target_noun>"
      - "dim (de lampen|alle lampen) (in|op) [de|het] {area} <light_dim_to> <brightness_dim_target_noun>"
      - "<light_set_op> [de|het] {area}[ <light_no_article>] op <brightness_target_noun>"
      - "<light_set_naar> [de|het] {area}[ <light_no_article>] naar <brightness_target_noun>"
      - "dim [de|het] {area}[ <light_no_article>] <light_dim_to> <brightness_dim_target_noun>"
      # infinitive: de lamp op 50% zetten / naar 30% dimmen
      - "[de|het] {area}[ <light_no_article>] <light_dim_to> <brightness_dim_target_noun> dimmen"
      # short form without a verb: (de) keuken op 50%
      - "[de|het] {area} op {brightness}[%| procent]"
    example: "zet de helderheid in de slaapkamer naar 75%"
    inferred_domain: "light"
    response: "brightness"

  - sentences:
      - "zet de helderheid in [de|het] {area} op {brightness} procent"
    example: "zet de helderheid in de Keuken op 50 procent"
    inferred_domain: "light"
    response: "brightness"
    speech_to_phrase: true
