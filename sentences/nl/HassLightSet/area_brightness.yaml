      - "<the_lights> (in|op) [de|het] {area} naar <brightness_target_noun> <light_set_naar_infinitive>"
      - "<the_lights> (in|op) [de|het] {area} <light_dim_to> <brightness_dim_target_noun> dimmen"
      - "[de|het] {area}[ <light_no_article>] op <brightness_target_noun> <light_set_op_infinitive>"
