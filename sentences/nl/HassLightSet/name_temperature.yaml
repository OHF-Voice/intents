---
# HassLightSet - name_temperature
# example: zet de kleurtemperatuur van het slaapkamerlampje op 2700 kelvin
# slots:
# - {name}
# - {temperature}

language: "nl"
data:
  - sentences:
      # with the noun: zet de kleurtemperatuur van ... op 2700 kelvin / maak ... warm wit / stel ... in op
      - "<light_set_op> de (<color_temperature_noun>|temperatuur) van [de|het] {name}[ <light_no_article>] op <color_temperature_target>"
      - "<light_set_naar> de (<color_temperature_noun>|temperatuur) van [de|het] {name}[ <light_no_article>] naar <color_temperature_target>"
      - "maak de (<color_temperature_noun>|temperatuur) van [de|het] {name}[ <light_no_article>] {color_temperature_names:temperature}"
      - "stel de (<color_temperature_noun>|temperatuur) van [de|het] {name}[ <light_no_article>] in op <color_temperature_target>"
      - "<light_set_op> [de|het] {name}[ <light_no_article>] <color_temperature_noun> op <color_temperature_target>"
      - "<light_set_naar> [de|het] {name}[ <light_no_article>] <color_temperature_noun> naar <color_temperature_target>"
      - "maak [de|het] {name}[ <light_no_article>] <color_temperature_noun> {color_temperature_names:temperature}"
      - "stel [de|het] {name}[ <light_no_article>] <color_temperature_noun> in op <color_temperature_target>"
      # without the noun: zet de lampen op warm wit / op 2700 kelvin
      - "<light_set_op> [de|het] {name}[ <light_no_article>] op <color_temperature_target>"
      - "<light_set_naar> [de|het] {name}[ <light_no_article>] naar <color_temperature_target>"
      - "maak [de|het] {name}[ <light_no_article>] {color_temperature_names:temperature}"
      - "stel [de|het] {name}[ <light_no_article>] in op <color_temperature_target>"
      # infinitive: de kleurtemperatuur ... op 2700 kelvin zetten
      - "de <color_temperature_noun> van [de|het] {name}[ <light_no_article>] op <color_temperature_target> <light_set_op_infinitive>"
      - "de <color_temperature_noun> van [de|het] {name}[ <light_no_article>] naar <color_temperature_target> <light_set_naar_infinitive>"
      - "[de|het] {name}[ <light_no_article>] op <color_temperature_target> <light_set_op_infinitive>"
      - "[de|het] {name}[ <light_no_article>] naar <color_temperature_target> <light_set_naar_infinitive>"
      # value before the light: zet de kleurtemperatuur op 2700 kelvin van het slaapkamerlampje
      - "<light_set_op> de <color_temperature_noun> op <color_temperature_target> van [de|het] {name}[ <light_no_article>]"
      - "<light_set_naar> de <color_temperature_noun> naar <color_temperature_target> van [de|het] {name}[ <light_no_article>]"
      # maak van het slaapkamerlampje de kleurtemperatuur warm wit
      - "maak van [de|het] {name}[ <light_no_article>] de <color_temperature_noun> {color_temperature_names:temperature}"
      # stel 2700 kelvin in als kleurtemperatuur van het slaapkamerlampje
      - "stel <color_temperature_target> in als [de] <color_temperature_noun> van [de|het] {name}[ <light_no_article>]"
    example: "zet de kleurtemperatuur van het slaapkamerlampje op 2700 kelvin"
    name_domains:
      - "light"
    response: "temperature"
