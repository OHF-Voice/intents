---
# HassFanSetSpeed - floor_only
# slots: {floor}, {percentage}

language: "nl"
data:
  - sentences:
      # zet de zolderventilatoren op 50 procent
      - "<value_set_op> [de] {floor}[ ]<fan_speed_noun> op <fan_percentage>"
      - "<value_set_naar> [de] {floor}[ ]<fan_speed_noun> naar <fan_percentage>"
      # zet de snelheid van de zolderventilatoren op 50 procent
      - "<value_set_op> de snelheid van [de] {floor}[ ]<fan_noun> op <fan_percentage>"
      - "<value_set_naar> de snelheid van [de] {floor}[ ]<fan_noun> naar <fan_percentage>"
      # zet de snelheid van de ventilatoren op de eerste verdieping op 50 procent
      - "<value_set_op> de snelheid van de <fan_noun> (in|op|van) [de|het] {floor} op <fan_percentage>"
      - "<value_set_naar> de snelheid van de <fan_noun> (in|op|van) [de|het] {floor} naar <fan_percentage>"
      # zet de ventilatoren op de eerste verdieping op 50 procent
      - "<value_set_op> de <fan_speed_noun> (in|op|van) [de|het] {floor} op <fan_percentage>"
      - "<value_set_naar> de <fan_speed_noun> (in|op|van) [de|het] {floor} naar <fan_percentage>"
      # zet op de eerste verdieping de ventilatoren op 50 procent
      - "<value_set_op> (in|op) [de|het] {floor} de <fan_speed_noun> op <fan_percentage>"
      - "<value_set_naar> (in|op) [de|het] {floor} de <fan_speed_noun> naar <fan_percentage>"
      # stel de ventilatoren op de eerste verdieping in op 50 procent
      - "stel [de] {floor}[ ]<fan_speed_noun> in op <fan_percentage>"
      - "stel de <fan_speed_noun> (in|op|van) [de|het] {floor} in op <fan_percentage>"
      - "stel de snelheid van de <fan_noun> (in|op|van) [de|het] {floor} in op <fan_percentage>"
      # shorthand without a verb
      - "[de] {floor}[ ]<fan_speed_noun> [<to>] <fan_percentage>"
      - "[de] snelheid van de <fan_noun> (in|op|van) [de|het] {floor} [<to>] <fan_percentage>"
    example: "zet eerste verdieping ventilator snelheid op 50%"
    response: "default"
  - sentences:
      # floors used as an adverb, without preposition or article
      # zet de snelheid van de ventilatoren beneden op 50 procent
      - "<value_set_op> de snelheid van de <fan_noun> {floor} op <fan_percentage>"
      - "<value_set_naar> de snelheid van de <fan_noun> {floor} naar <fan_percentage>"
      - "stel de snelheid van de <fan_noun> {floor} in op <fan_percentage>"
      # zet de ventilatoren beneden op 50 procent / zet beneden de ventilatoren op 50 procent
      - "<value_set_op> de <fan_speed_noun> {floor} op <fan_percentage>"
      - "<value_set_naar> de <fan_speed_noun> {floor} naar <fan_percentage>"
      - "<value_set_op> {floor} de <fan_speed_noun> op <fan_percentage>"
      - "<value_set_naar> {floor} de <fan_speed_noun> naar <fan_percentage>"
      - "stel de <fan_speed_noun> {floor} in op <fan_percentage>"
      - "[de] snelheid van de <fan_noun> {floor} [<to>] <fan_percentage>"
    example: "zet de snelheid van de ventilatoren beneden op 50 procent"
    response: "default"
