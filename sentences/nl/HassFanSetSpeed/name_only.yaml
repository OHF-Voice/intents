---
# HassFanSetSpeed - name_only
# slots: {name}, {percentage}

language: "nl"
data:
  - sentences:
      - "[<numeric_value_set>] [de|het] {name}[ ][snelheid] [<to>] {fan_speed:percentage}[%| procent]"
      - "[<numeric_value_set>] [de] snelheid [van] [de|het] {name} [<to>] {fan_speed:percentage}[%| procent]"
    example: "zet plafondventilator snelheid op 50%"
    name_domains:
      - "fan"
    response: "default"
  - sentences:
      - "zet de snelheid van [de|het] {name} op {fan_speed:percentage} procent"
    example: "zet de snelheid van de Plafondventilator op 50 procent"
    name_domains:
      - "fan"
    response: "default"
    speech_to_phrase: true
