---
# HassFanSetSpeed - name_only
# slots: {name}, {percentage}

language: "nl"
data:
  - sentences:
      # zet de plafondventilator op 50 procent
      - "<value_set_op> [de|het] {name} op <fan_percentage>"
      - "<value_set_naar> [de|het] {name} naar <fan_percentage>"
      # zet de plafondventilator snelheid op 50 procent
      - "<value_set_op> [de] {name}[ ]snelheid op <fan_percentage>"
      - "<value_set_naar> [de] {name}[ ]snelheid naar <fan_percentage>"
      # zet de snelheid van de plafondventilator op 50 procent
      - "<value_set_op> de snelheid van [de|het] {name} op <fan_percentage>"
      - "<value_set_naar> de snelheid van [de|het] {name} naar <fan_percentage>"
      # stel de plafondventilator in op 50 procent
      - "stel [de|het] {name} in op <fan_percentage>"
      - "stel [de] {name}[ ]snelheid in op <fan_percentage>"
      - "stel de snelheid van [de|het] {name} in op <fan_percentage>"
      # shorthand without a verb
      - "[de|het] {name} [<to>] <fan_percentage>"
      - "[de] {name}[ ]snelheid [<to>] <fan_percentage>"
      - "[de] snelheid van [de|het] {name} [<to>] <fan_percentage>"
    example: "zet plafondventilator snelheid op 50%"
    name_domains:
      - "fan"
    response: "default"
  - sentences:
      - "zet de snelheid van [de|het] {name} op {fan_speed:percentage} procent"
    example: "zet de snelheid van de Plafondventilator op 50 procent"
    name_domains:
      - "fan"
    response: "default"
    speech_to_phrase: true
