---
# HassFanSetSpeed - default
# slots: {percentage}; context_area: true

language: "nl"
data:
  - sentences:
      # zet de ventilator op 50 procent / zet de ventilatorsnelheid hier op 50 procent
      - "<value_set_op> de <fan_speed_noun> [<here>] op <fan_percentage>"
      - "<value_set_naar> de <fan_speed_noun> [<here>] naar <fan_percentage>"
      # zet de snelheid van de ventilator op 50 procent
      - "<value_set_op> de snelheid van de <fan_noun> [<here>] op <fan_percentage>"
      - "<value_set_naar> de snelheid van de <fan_noun> [<here>] naar <fan_percentage>"
      # stel de ventilator in op 50 procent
      - "stel de <fan_speed_noun> [<here>] in op <fan_percentage>"
      - "stel de snelheid van de <fan_noun> [<here>] in op <fan_percentage>"
      # zet hier de ventilator op 50 procent
      - "<value_set_op> <here> de <fan_speed_noun> op <fan_percentage>"
      - "<value_set_naar> <here> de <fan_speed_noun> naar <fan_percentage>"
      # shorthand without a verb: ventilator op 50 procent
      - "[de] <fan_speed_noun> [<here>] [<to>] <fan_percentage>"
      - "[de] snelheid van de <fan_noun> [<here>] [<to>] <fan_percentage>"
    example: "zet de ventilatorsnelheid op 50%"
    response: "default"
  - sentences:
      - "zet de snelheid van de ventilator op {fan_speed:percentage} procent"
      - "zet de ventilator op {fan_speed:percentage} procent"
    example: "zet de snelheid van de ventilator op 50 procent"
    response: "default"
    speech_to_phrase: true
