---
# HassFanSetSpeed - area_only
# slots: {area}, {percentage}

language: "nl"
data:
  - sentences:
      # zet de keukenventilator op 50 procent / zet de keuken ventilatorsnelheid op 50 procent
      - "<value_set_op> [de] {area}[ ]<fan_speed_noun> op <fan_percentage>"
      - "<value_set_naar> [de] {area}[ ]<fan_speed_noun> naar <fan_percentage>"
      # zet de snelheid van de keukenventilatoren op 50 procent
      - "<value_set_op> de snelheid van [de] {area}[ ]<fan_noun> op <fan_percentage>"
      - "<value_set_naar> de snelheid van [de] {area}[ ]<fan_noun> naar <fan_percentage>"
      # zet de snelheid van de ventilatoren in de keuken op 50 procent
      - "<value_set_op> de snelheid van de <fan_noun> (in|op|van) [de|het] {area} op <fan_percentage>"
      - "<value_set_naar> de snelheid van de <fan_noun> (in|op|van) [de|het] {area} naar <fan_percentage>"
      # shorthand without a verb
      - "[de] {area}[ ]<fan_speed_noun> [<to>] <fan_percentage>"
      - "[de] snelheid van [de] {area}[ ]<fan_noun> [<to>] <fan_percentage>"
      - "[de] snelheid van de <fan_noun> (in|op|van) [de|het] {area} [<to>] <fan_percentage>"
    example: "zet keuken fan snelheid op 50%"
    response: "default"
