---
# HassVacuumCleanArea - name_area
# example: stofzuig de woonkamer met rover
# slots: {area}, {name}

language: "nl"
data:
  - sentences:
      - "maak ([de|het] {area} schoon;met [de|het] {name})"
      - "stofzuig ([de|het] {area};met [de|het] {name})"
      - "zuig stof ((in|op) [de|het] {area};met [de|het] {name})"
      - "zuig ((in|op) [de|het] {area};met [de|het] {name}) stof"
      - "start [de|het] {name} (in|op) [de|het] {area}"
      # laat rover de woonkamer stofzuigen
      - "laat [de|het] {name} [de|het] {area} (stofzuigen|schoonmaken)"
      # laat rover in de woonkamer stofzuigen
      - "laat [de|het] {name} (in|op) [de|het] {area} (stofzuigen|schoonmaken)"
      # stuur Rover naar de woonkamer
      - "stuur [de|het] {name} naar [de|het] {area}"
      # reinig de woonkamer met Rover
      - "reinig ([de|het] {area};met [de|het] {name})"
    example: "stofzuig de woonkamer met rover"
    name_domains:
      - "vacuum"
    response: "default"
