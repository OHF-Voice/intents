---
# HassVacuumCleanArea - area_only
# example: stofzuig de woonkamer
# slots: {area}

language: "nl"
data:
  - sentences:
      - "stofzuig [in|op] [de|het] {area}"
      - "maak [de|het] {area} schoon"
      - "zuig (stof;(in|op) [de|het] {area})"
      # laat de stofzuiger de woonkamer stofzuigen
      - "laat de <vacuum> [de|het] {area} (stofzuigen|schoonmaken)"
      # laat de stofzuiger in de woonkamer stofzuigen
      - "laat de <vacuum> (in|op) [de|het] {area} (stofzuigen|schoonmaken)"
      # stuur de stofzuiger naar de woonkamer
      - "stuur de <vacuum> naar [de|het] {area}"
      # laat de woonkamer stofzuigen
      - "laat [de|het] {area} (stofzuigen|schoonmaken)"
      # maak de woonkamer schoon met de stofzuiger / stofzuig de woonkamer met de robotstofzuiger
      - "maak ([de|het] {area} schoon;met de <vacuum>)"
      - "stofzuig ([in|op] [de|het] {area};met de <vacuum>)"
    example: "stofzuig de woonkamer"
    response: "default"
