---
# HassSetPosition - floor_device_class
# example: zet de gordijnen op de eerste verdieping naar 50%
# slots: {floor}, {domain}, {device_class}, {position}

language: "nl"
data:
  - sentences:
      # zet de gordijnen (positie) op de eerste verdieping naar 50% / naar 50% op de eerste verdieping
      # (preposition optional: floors like "beneden" take none)
      - "(zet|doe|mag|verander|verhoog|verlaag|open|sluit) [de|het] {cover_classes:device_class}[[ ](positie|stand)] (<to> {position}[[ ]%|procent];[in|op|van|bij] [de|het] {floor})"
      # zet de positie van de gordijnen op de eerste verdieping naar 50%
      - "(zet|doe|mag|verander|verhoog|verlaag|open|sluit) de (positie|stand) van [de|het] {cover_classes:device_class} (<to> {position}[[ ]%|procent];[in|op|van|bij] [de|het] {floor})"
      # zet op de eerste verdieping de gordijnen naar 50%
      - "(zet|doe|mag|verander|verhoog|verlaag|open|sluit) [in|op|van|bij] [de|het] {floor} [de|het] {cover_classes:device_class}[[ ](positie|stand)] <to> {position}[[ ]%|procent]"
      # de gordijnen op de eerste verdieping naar 50% zetten
      - "[de|het] {cover_classes:device_class}[[ ](positie|stand)] [in|op|van|bij] [de|het] {floor} <to> {position}[[ ]%|procent] (zetten|doen|verhogen|verlagen)"
      # de positie van de gordijnen op de eerste verdieping naar 50% zetten
      - "de (positie|stand) van [de|het] {cover_classes:device_class} [in|op|van|bij] [de|het] {floor} <to> {position}[[ ]%|procent] (zetten|doen|verhogen|verlagen)"
      # op de eerste verdieping de gordijnen naar 50% zetten
      - "[in|op|van|bij] [de|het] {floor} [de|het] {cover_classes:device_class}[[ ](positie|stand)] <to> {position}[[ ]%|procent] (zetten|doen|verhogen|verlagen)"
    example: "zet de gordijnen op de eerste verdieping naar 50%"
    inferred_domain: "cover"
    response: "default"
