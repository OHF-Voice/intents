---
# HassSetPosition - name_only
# slots: {name}, {position}

language: "nl"
data:
  # covers
  - sentences:
      # zet gordijn links op 50% / open gordijn links tot 50% / gordijn links op 50% zetten
      - "<cover_set_op> [de|het] {name}[ (positie|stand)] op <cover_percentage>"
      - "stel [de|het] {name}[ (positie|stand)] in op <cover_percentage>"
      - "[de|het] {name}[ (positie|stand)] op <cover_percentage> <cover_set_op_infinitive>"
      - "<cover_set_naar> [de|het] {name}[ (positie|stand)] naar <cover_percentage>"
      - "[de|het] {name}[ (positie|stand)] naar <cover_percentage> <cover_set_naar_infinitive>"
      - "[de|het] {name}[ (positie|stand)] <to> <cover_percentage>"
      - "<cover_open_close> [de|het] {name} <cover_open_close_to> <cover_percentage>"
      # zet de positie van gordijn links op 50%
      - "<cover_set_op> <cover_position_of> [de|het] {name} op <cover_percentage>"
      - "stel <cover_position_of> [de|het] {name} in op <cover_percentage>"
      - "<cover_position_of> [de|het] {name} op <cover_percentage> <cover_set_op_infinitive>"
      - "<cover_set_naar> <cover_position_of> [de|het] {name} naar <cover_percentage>"
      - "<cover_position_of> [de|het] {name} naar <cover_percentage> <cover_set_naar_infinitive>"
      - "<cover_position_of> [de|het] {name} <to> <cover_percentage>"
      # doe gordijn links omhoog naar 50% / zet de positie van gordijn links naar 50% omhoog
      - "[(zet|doe)] [de|het] {name}[ (positie|stand)] ((omhoog|omlaag);naar <cover_percentage>)"
      - "[(zet|doe)] <cover_position_of> [de|het] {name} ((omhoog|omlaag);naar <cover_percentage>)"
    example: "zet gordijn links op 50%"
    name_domains:
      - "cover"
    response: "default"
  - sentences:
      # half open / half dicht = 50%
      - "(doe|zet) [de|het] {name} {cover_position_half:position} (open|dicht)"
      - "(open|sluit) [de|het] {name} {cover_position_half:position}"
      - "[de|het] {name} {cover_position_half:position} (open|dicht)"
    example: "doe gordijn links half open"
    name_domains:
      - "cover"
    response: "default"
  # valves
  - sentences:
      # zet de hoofdkraan op 50% / draai de hoofdkraan open tot 50%
      - "(zet|draai) [de|het] {name}[ positie] op <cover_percentage>"
      - "(zet|draai|verander) [de|het] {name}[ positie] naar <cover_percentage>"
      - "(open|sluit) [de|het] {name} (tot|naar) <cover_percentage>"
      - "draai [de|het] {name} (open|dicht) (tot|naar) <cover_percentage>"
      - "[de|het] {name}[ positie] op <cover_percentage> (zetten|draaien)"
      - "[de|het] {name}[ positie] naar <cover_percentage> (zetten|draaien|veranderen)"
      - "[de|het] {name}[ positie] [<to>] <cover_percentage>"
      - "stel [de|het] {name}[ positie] in op <cover_percentage>"
    example: "zet hoofdkraan op 100%"
    name_domains:
      - "valve"
    response: "default"
  # Speech-to-Phrase
  - sentences:
      - "zet [de|het] {name} op {position} procent"
      - "zet de positie van [de|het] {name} op {position} procent"
      - "(open|sluit) [de|het] {name} tot {position} procent"
    example: "zet het Gordijn Links op 50 procent"
    name_domains:
      - "cover"
      - "valve"
    response: "default"
    speech_to_phrase: true
