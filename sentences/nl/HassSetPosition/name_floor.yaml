---
# HassSetPosition - name_floor
# example: zet gordijn links op de eerste verdieping naar 50%
# slots: {name}, {floor}, {position}

language: "nl"
data:
  - sentences:
      # zet gordijn links (positie) op de eerste verdieping naar 50% / naar 50% op de eerste verdieping
      # (preposition optional: floors like "beneden" take none)
      - "(zet|doe|mag|verander|verhoog|verlaag|open|sluit) [de|het] {name}[[ ]<cover>][[ ](positie|stand)] (<to> {position}[[ ]%|procent];[in|op|van|bij] [de|het] {floor})"
      # zet de positie van gordijn links op de eerste verdieping naar 50%
      - "(zet|doe|mag|verander|verhoog|verlaag|open|sluit) de (positie|stand) van [de|het] {name}[[ ]<cover>] (<to> {position}[[ ]%|procent];[in|op|van|bij] [de|het] {floor})"
      # zet op de eerste verdieping gordijn links naar 50%
      - "(zet|doe|mag|verander|verhoog|verlaag|open|sluit) [in|op|van|bij] [de|het] {floor} [de|het] {name}[[ ]<cover>][[ ](positie|stand)] <to> {position}[[ ]%|procent]"
      # gordijn links op de eerste verdieping naar 50% zetten
      - "[de|het] {name}[[ ](positie|stand)] [in|op|van|bij] [de|het] {floor} <to> {position}[[ ]%|procent] (zetten|doen|verhogen|verlagen)"
      # de positie van gordijn links op de eerste verdieping naar 50% zetten
      - "de (positie|stand) van [de|het] {name} [in|op|van|bij] [de|het] {floor} <to> {position}[[ ]%|procent] (zetten|doen|verhogen|verlagen)"
      # op de eerste verdieping gordijn links naar 50% zetten
      - "[in|op|van|bij] [de|het] {floor} [de|het] {name}[[ ](positie|stand)] <to> {position}[[ ]%|procent] (zetten|doen|verhogen|verlagen)"
    example: "zet gordijn links op de eerste verdieping naar 50%"
    name_domains:
      - "cover"
    response: "default"
  - sentences:
      - "zet [de|het] {name} (in|op) [de|het] {floor} op {position} procent"
    example: "zet het Gordijn Links op de eerste verdieping op 50 procent"
    name_domains:
      - "cover"
    response: "default"
    speech_to_phrase: true
