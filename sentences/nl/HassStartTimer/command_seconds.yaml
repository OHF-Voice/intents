---
# HassStartTimer - command_seconds

language: "nl"
data:
  - sentences:
      - "{timer_command:conversation_command} (over|na) {timer_seconds:seconds} seconde[s|n]"
      - "(over|na) {timer_seconds:seconds} seconde[s|n] {timer_command:conversation_command}"
      - "{timer_command:conversation_command} (over|na) [een] {timer_half_minute:seconds}"
      - "(over|na) [een] {timer_half_minute:seconds} {timer_command:conversation_command}"
      - "{timer_command:conversation_command} (over|na) {timer_one_and_a_half_minute:seconds}"
      - "(over|na) {timer_one_and_a_half_minute:seconds} {timer_command:conversation_command}"
    example: "doe de lichten uit over 30 seconden"
    response: "command"
