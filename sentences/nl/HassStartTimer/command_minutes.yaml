      - "{timer_command:conversation_command} (over|na) {timer_one_and_a_half_hour:minutes} uur[tje]"
      - "(over|na) {timer_one_and_a_half_hour:minutes} uur[tje] {timer_command:conversation_command}"
      - "{timer_command:conversation_command} (over|na) {timer_quarter:minutes}"
      - "(over|na) {timer_quarter:minutes} {timer_command:conversation_command}"
