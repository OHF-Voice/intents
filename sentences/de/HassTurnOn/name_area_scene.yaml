      - "[<szene> ][<artikel_bestimmt> ]{name} <area>[ (<aktivieren>|<ausfuehren>|<an>)]"
      - "[<artikel_bestimmt> ]{name} <szene> <area> (<aktivieren>|<ausfuehren>|<an>)"
      - "führe[ <szene>] [<artikel_bestimmt> ]{name} <area> aus"
      - "führe [<artikel_bestimmt> ]{name} <szene> <area> aus"
      - "<aktivieren>[ <szene>] [<artikel_bestimmt> ]{name} <area>"
      - "<aktivieren> [<artikel_bestimmt> ]{name} <szene> <area>"
    example: "aktiviere die Szene Partymodus im Schlafzimmer"
    name_domains:
      - "scene"
    response: "scene"
