---
# HassGetWeather - name_only
# slots: {name}

language: "de"
data:
  - sentences:
      - "wie ist[ das] Wetter (für|[heute ]in) [<artikel_bestimmt> ]{name}"
      - "wie ist[ heute][ das] [<artikel_bestimmt> ]{name}[er|s] Wetter"
      - "was für[ ein] Wetter (ist|hat es)[ heute] in [<artikel_bestimmt> ]{name}"
      - "wie ist[ das] Wetter (für|in) [<artikel_bestimmt> ]{name} heute"
      - "wie ist[ das] [<artikel_bestimmt> ]{name}[er|s] Wetter heute"
      - "was für[ ein] Wetter (ist|hat es) in [<artikel_bestimmt> ]{name} heute"
      - "Wetter[bericht][ (für[ heute in]|in)] [<artikel_bestimmt> ]{name}"
    example: "wie ist das Wetter in Berlin"
    name_domains:
      - "weather"
    response: "default"
  - sentences:
      - "wie (warm|kalt) ist es[ heute] in [<artikel_bestimmt> ]{name}"
      - "wie[ ]viel (Grad|°) (sind es|haben wir)[ heute] in [<artikel_bestimmt> ]{name}"
      - "wie (warm|kalt) ist es in [<artikel_bestimmt> ]{name} heute"
      - "wie[ ]viel (Grad|°) (sind es|haben wir) in [<artikel_bestimmt> ]{name} heute"
    example: "wie warm ist es in Berlin"
    name_domains:
      - "weather"
    response: "outside_temp"
