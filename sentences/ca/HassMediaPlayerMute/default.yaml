---
# HassMediaPlayerMute - default
# example: silencia
# context_area: true

language: "ca"
data:
  - sentences:
      - "silenci[a|ar]"
      - "(posa|fes) silenci"
      - "muteja"
      - "(treu|desactiva)[-li] el so"
      - "silencia el[s] (altaveu|dispositiu|reproductor)[s] [aqui]"
      - "silencia la (m(u|ú)sica) [aqui]"
    example: "silencia"
    response: "default"
  # Speech-to-Phrase: lean subset of the block above, with the media noun
  # required so the STT grammar never has to recognise a bare "silencia".
  - sentences:
      - "silencia la música"
      - "silencia el reproductor"
      - "treu el so"
    example: "silencia la música"
    response: "default"
    speech_to_phrase: true
