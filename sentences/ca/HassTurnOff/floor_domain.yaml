---
# HassTurnOff - floor_domain
# example: apaga els llums de la planta baixa
# slots: {floor}, {domain}

language: "ca"
data:
  - sentences:
      - "<apaga> [tot[e]s] [el|la|els|les] (llum|llums) <in> [planta|pis] {floor}"
      - "<tanca> [tot[e]s] [el|la|els|les] (llum|llums) <in> [planta|pis] {floor}"
    example: "apaga els llums de la planta baixa"
    inferred_domain: "light"
    response: "lights_floor"
  - sentences:
      - "apaga els llums a la {floor}"
    example: "apaga els llums a la Planta baixa"
    inferred_domain: "light"
    response: "lights_floor"
    speech_to_phrase: true
