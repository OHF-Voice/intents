---
# HassNevermind - default
# example: deixa-ho

language: "ca"
data:
  - sentences:
      - "<cancela> [la comanda|l'ordre]"
      - "[no|res] res"
      - "no facis (cas|res)"
      - "(deixa|oblida)-ho [tot]"
    example: "deixa-ho"
    response: "default"
  # Speech-to-Phrase: lean subset of the block above. Both phrasings are
  # natural interjections; only the single-syllable "res" is dropped, since
  # the constrained STT grammar cannot score an utterance that short.
  - sentences:
      - "deixa-ho"
      - "oblida-ho"
    example: "deixa-ho"
    response: "default"
    speech_to_phrase: true
