---
# HassTurnOn - name_scene
# example: aktiviraj sceno zabava
# slots: name

language: "sl"
data:
  - sentences:
      - "(aktiviraj|<vključi>|zaženi) [sceno] {name} [sceno]"
    example: "aktiviraj sceno zabava"
    name_domains:
      - "scene"
    response: "scene"
  - sentences:
      - "zaženi {name}"
      - "aktiviraj {name} sceno"
    example: "zaženi Zabava"
    name_domains:
      - "scene"
    response: "scene"
    speech_to_phrase: true
