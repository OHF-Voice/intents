---
# HassTurnOn - name_script
# example: zaženi skripto prikriti način
# slots: name

language: "sl"
data:
  - sentences:
      - "(aktiviraj|<vključi>|zaženi) [skripto] {name} [skripto]"
    example: "zaženi skripto prikriti način"
    name_domains:
      - "script"
    response: "script"
  - sentences:
      - "aktiviraj {name}"
      - "zaženi skripto {name}"
    example: "aktiviraj Prikriti način"
    name_domains:
      - "script"
    response: "script"
    speech_to_phrase: true
