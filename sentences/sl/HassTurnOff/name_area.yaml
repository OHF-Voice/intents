---
# HassTurnOff - name_area
# example: izklopi stropno luč v kuhinji
# slots:
# - name
# - area

language: "sl"
data:
  - sentences:
      - "<izklopi> {name} [v|na] {area}"
    example: "izklopi stropno luč v kuhinji"
    name_domains: "default"
    response: "default"

  - sentences:
      - "<izklopi> {name} <luč> [v|na] {area}"
    example: "izklopi luč v igralnem kotu v kuhinji"
    name_domains:
      - "light"
    response: "default"

  - sentences:
      - "<zapri> {name} [v|na] {area}"
    example: "zapri zaveso v dnevni sobi"
    name_domains:
      - "cover"
    response: "cover"

  - sentences:
      - "<zapri> {name} [v|na] {area}"
    example: "zapri glavni ventil v kuhinji"
    name_domains:
      - "valve"
    response: "valve"

  - sentences:
      - "odkleni {name} [v|na] {area}"
    example: "odkleni vhodna vrata v kuhinji"
    name_domains:
      - "lock"
    response: "lock"
  - sentences:
      - "izklopi {name} v {area}"
      - "izklopi {name} {area}"
    example: "izklopi Stropna luč v Kuhinja"
    name_domains: "default"
    response: "default"
    speech_to_phrase: true
  - sentences:
      - "zapri {name} v {area}"
      - "zapri {name} {area}"
    example: "zapri Drsna vrata v Kuhinja"
    name_domains:
      - "cover"
    response: "cover"
    speech_to_phrase: true
  - sentences:
      - "zapri {name} v {area}"
      - "zapri {name} {area}"
    example: "zapri Glavni ventil v Kuhinja"
    name_domains:
      - "valve"
    response: "valve"
    speech_to_phrase: true
