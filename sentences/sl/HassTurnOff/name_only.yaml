---
# HassTurnOff - name_only
# example: izklopi stropno luč
# slots: {name}

language: "sl"
data:
  - sentences:
      - "<izklopi> {name}"
    example: "izklopi stropno luč"
    name_domains: "default"
    response: "default"

  - sentences:
      - "<izklopi> {name} <luč>"
    example: "izklopi luč v igralnem kotu"
    name_domains:
      - "light"
    response: "default"

  - sentences:
      - "<zapri> {name}"
    example: "zapri drsna vrata"
    name_domains:
      - "cover"
    response: "cover"

  - sentences:
      - "<zapri> {name}"
    example: "zapri glavni ventil"
    name_domains:
      - "valve"
    response: "valve"

  - sentences:
      - "odkleni {name}"
    example: "odkleni vhodna vrata"
    name_domains:
      - "lock"
    response: "lock"
  - sentences:
      - "izklopi {name}"
    example: "izklopi Stropna luč"
    name_domains: "default"
    response: "default"
    speech_to_phrase: true
  - sentences:
      - "zapri {name}"
    example: "zapri Drsna vrata"
    name_domains:
      - "cover"
    response: "cover"
    speech_to_phrase: true
  - sentences:
      - "zapri {name}"
    example: "zapri Glavni ventil"
    name_domains:
      - "valve"
    response: "valve"
    speech_to_phrase: true
  - sentences:
      - "odkleni {name}"
    example: "odkleni Vhodna vrata"
    name_domains:
      - "lock"
    response: "lock"
    speech_to_phrase: true
