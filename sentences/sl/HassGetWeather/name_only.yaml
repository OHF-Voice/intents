---
# HassGetWeather - name_only
# example: kakšno je vreme v Mariboru
# slots: {name}

language: "sl"
data:
  - sentences:
      - "<kakšno_je> vreme [v|na] {name}"
      - "vreme [v|na] {name}"
    example: "kakšno je vreme v Mariboru"
    name_domains:
      - "weather"
    response: "default"
  - sentences:
      - "kakšno je vreme v {name}"
    example: "kakšno je vreme v Maribor"
    name_domains:
      - "weather"
    response: "default"
    speech_to_phrase: true
