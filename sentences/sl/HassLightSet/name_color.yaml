---
# HassLightSet - name_color
# example: nastavi barvo spalniške luči na rdečo
language: "sl"
data:
  - sentences:
      - "[<set>] [barvo] {name} [na] {color} [barvo]"
      - "[<set>] {color} {name}"
    example: "nastavi barvo spalniške luči na rdečo"
    name_domains:
      - "light"
    response: "color"
  - sentences:
      - "nastavi barvo {name} na {color}"
      - "nastavi {name} na {color} barvo"
    example: "nastavi barvo Spalniška luč na bel(a"
    name_domains:
      - "light"
    response: "color"
    speech_to_phrase: true
