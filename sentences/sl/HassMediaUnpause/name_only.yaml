---
# HassMediaUnpause - name_only
# example: resume TV
# slots: {name}

language: "sl"
data:
  - sentences:
      - "((nadaljuj [predvajanje]|predvajaj);{name})"
    example: "nadaljuj TV"
    name_domains:
      - "media_player"
    response: "default"
  - sentences:
      - "nadaljuj {name}"
    example: "nadaljuj TV"
    name_domains:
      - "media_player"
    response: "default"
    speech_to_phrase: true
