---
# HassGetState - name_only
# example: qual è la temperatura esterna
# slots: {name}

language: "it"
data:
  - sentences:
      - "<what_is> [lo stato [attuale] <of>|il valore <of>] [<the>] {name}"
      - "<how_is> [<the>] {name}"
    example: "qual è la temperatura esterna"
    name_domains: "default"
    response: "one"
  - sentences:
      - "qual è il valore del {name}"
    example: "qual è il valore del Temperatura Esterna"
    name_domains:
      - sensor
    response: "one"
    speech_to_phrase: true
