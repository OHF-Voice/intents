---
# HassMediaSearchAndPlay - name_area_media_class
# example: riproduci l'artista Queen su Menestrello in cucina
# slots:
# - {name}
# - {area}
# - {search_query}
# - {media_class}

language: "it"
data:
  - sentences:
      - "<play> [<the>] {media_class} {search_query} <onto> [<the>] {name} <in> [area ]{area}"
      - "<play> {search_query} {media_class} <onto> [<the>] {name} <in> [area ]{area}"
    example: "riproduci artista Queen su Menestrello in cucina"
    name_domains:
      - "media_player"
    response: "default"
