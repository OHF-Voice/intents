---
# HassMediaSearchAndPlay - name_media_class
# example: riproduci la traccia Bohemian Rhapsody su Menestrello
# slots:
# - {name}
# - {search_query}
# - {media_class}

language: "it"
data:
  - sentences:
      - "<play> [<the>] {media_class} {search_query} <onto> [<the>] {name}"
      - "<play> {search_query} {media_class} <onto> [<the>] {name}"
    example: "riproduci la traccia Bohemian Rhapsody su Menestrello"
    name_domains:
      - "media_player"
    response: "default"
