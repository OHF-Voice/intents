---
# HassMediaPlayerMute - default
# example: silenzia
# context_area: true

language: "it"
data:
  - sentences:
      - "<mute> [<the>] [<media>] [<in_here>]"
    example: "silenzia"
    response: "default"
  # Speech-to-Phrase: lean subset of the block above, with the media noun
  # required so the STT grammar never has to recognise a bare "silenzia".
  - sentences:
      - "<mute> [<the>] <media>"
    example: "silenzia la musica"
    response: "default"
    speech_to_phrase: true
