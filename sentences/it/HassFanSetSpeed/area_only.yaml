---
# HassFanSetSpeed - area_only
# example: imposta il ventilatore della cucina al 50%
# slots:
# - {area}
# - {percentage}

language: "it"
data:
  - sentences:
      - "<numeric_value_set> [<the>]<fan> (<of>|<in>) {area} <to> {fan_speed:percentage}[<percent>]"
      - "<numeric_value_set> [la ]velocità [<of>] [<the>]<fan> (<of>|<in>) {area} <to> {fan_speed:percentage}[<percent>]"
      - "(<numeric_value_set> [<the>]<fan> <to> {fan_speed:percentage}[<percent>];<in> {area})"
    example: "imposta il ventilatore della cucina al 50%"
    response: "default"
