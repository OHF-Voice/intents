      - "<numeric_value_set> [<the>]<fan> (<of>|<on>) {floor} <to> {fan_speed:percentage}[<percent>]"
      - "<numeric_value_set> [la ]velocità [<of>] [<the>]<fan> (<of>|<on>) {floor} <to> {fan_speed:percentage}[<percent>]"
    example: "imposta il ventilatore del primo piano al 50%"
    response: "default"
