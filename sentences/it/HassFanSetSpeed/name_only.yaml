---
# HassFanSetSpeed - name_only
# example: imposta il ventilatore soffitto al 50%
# slots:
# - {name}
# - {percentage}

language: "it"
data:
  - sentences:
      - "<numeric_value_set> [<the>] {name} <to> {fan_speed:percentage}[<percent>]"
      - "<numeric_value_set> [la ]velocità [<of>] [<the>] {name} <to> {fan_speed:percentage}[<percent>]"
    example: "imposta il ventilatore soffitto al 50%"
    name_domains:
      - "fan"
    response: "default"
  # Speech-to-Phrase: lean subset of the block above.
  - sentences:
      - "imposta [<the>] {name} al {fan_speed:percentage} per cento"
    example: "imposta il ventilatore soffitto al 50 per cento"
    name_domains:
      - "fan"
    response: "default"
    speech_to_phrase: true
