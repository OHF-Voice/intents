---
# HassMediaPlayerUnmute - name_only
# example: riattiva l'audio della TV
# slots: {name}

language: "it"
data:
  - sentences:
      - "<unmute> [<the>] {name}"
      - "<unmute> [<the>] <media> <onto> [<the>] {name}"
    example: "riattiva l'audio della TV"
    name_domains:
      - "media_player"
    response: "default"
