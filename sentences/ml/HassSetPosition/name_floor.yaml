---
# HassSetPosition - name_floor
# example: ഒന്നാം നിലയിലെ ഇടത് കർട്ടൺ 50 ശതമാനമായി ക്രമീകരിക്കുക
# slots:
# - {name}
# - {floor}
# - {position}

language: "ml"
data:
  - sentences:
      - "{floor} നില<in> [<the>] {name} {position} <to_percent> (<set>|<open>|<close>)"

    example: "ഒന്നാം നിലയിലെ ഇടത് കർട്ടൺ 50 ശതമാനമായി ക്രമീകരിക്കുക"
    name_domains:
      - "cover"
    response: "default"
