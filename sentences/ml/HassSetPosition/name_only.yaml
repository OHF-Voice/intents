---
# HassSetPosition - name_only
# example: ഇടത് കർട്ടൺ 50 ശതമാനമായി ക്രമീകരിക്കുക
# slots:
# - {name}
# - {position}

language: "ml"
data:
  - sentences:
      - "[<the>] {name} {position} <to_percent> (<set>|<open>|<close>)"

    example: "ഇടത് കർട്ടൺ 50 ശതമാനമായി ക്രമീകരിക്കുക"
    name_domains: "default"
    response: "default"
