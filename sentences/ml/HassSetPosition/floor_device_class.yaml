---
# HassSetPosition - floor_device_class
# example: ഒന്നാം നിലയിലെ കർട്ടനുകൾ 50 ശതമാനമായി ക്രമീകരിക്കുക
# slots:
# - {floor}
# - {domain}
# - {device_class}
# - {position}

language: "ml"
data:
  - sentences:
      - "{floor} നില<in> [<the>] {cover_classes:device_class} {position} <to_percent> (<set>|<open>|<close>)"

    example: "ഒന്നാം നിലയിലെ കർട്ടനുകൾ 50 ശതമാനമായി ക്രമീകരിക്കുക"
    inferred_domain: "cover"
    response: "cover_device_class"
