# HassFanSetSpeed - default
# example: പങ്കകളുടെ വേഗത 25 ശതമാനമായി ക്രമീകരിക്കുക
# slots: {percentage}
# context_area: true

language: "ml"
data:
  - sentences:
      - "(<fan_genitive_singular>|<fan_genitive_plural>) <speed> {fan_speed:percentage} <to_percent> <set>"
    example: "പങ്കകളുടെ വേഗത 25 ശതമാനമായി ക്രമീകരിക്കുക"
    response: "default"
