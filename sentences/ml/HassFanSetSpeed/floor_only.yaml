---
# HassFanSetSpeed - floor_only
# example: ഒന്നാം നിലയിലെ ഫാനുകളുടെ വേഗത 50 ശതമാനമായി ക്രമീകരിക്കുക
# slots:
# - {floor}
# - {percentage}

language: "ml"
data:
  - sentences:
      - "{floor} നില<in> (<fan_genitive_singular>|<fan_genitive_plural>) <speed> {fan_speed:percentage} <to_percent> <set>"
    example: "ഒന്നാം നിലയിലെ ഫാനുകളുടെ വേഗത 50 ശതമാനമായി ക്രമീകരിക്കുക"
    response: "default"
