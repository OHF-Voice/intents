---
# HassFanSetSpeed - area_only
# example: അടുക്കളയിലെ ഫാനുകളുടെ വേഗത 10 ശതമാനമായി ക്രമീകരിക്കുക
# slots:
# - {area}
# - {percentage}

language: "ml"
data:
  - sentences:
      - "[<the>] {area}<in> (<fan_genitive_singular>|<fan_genitive_plural>) <speed> {fan_speed:percentage} <to_percent> <set>"
    example: "അടുക്കളയിലെ ഫാനുകളുടെ വേഗത 10 ശതമാനമായി ക്രമീകരിക്കുക"
    response: "default"
