      - "[<amser_gosod>] amserydd [am] {timer_seconds:seconds}( |-)eiliad"
      - "[<amser_gosod>] amserydd [am] {number_words:seconds}( |-)eiliad"
      - "[<amser_gosod>] amserydd [am] {timer_half:seconds} munud"
      - "[<amser_gosod>] amserydd [am] {timer_seconds_split:seconds}"
    example: "amserydd 45 eiliad"
    response: "default"

  # Speech-to-Phrase
  - sentences:
      - "[gosod|osod] amserydd [am] {timer_seconds:seconds} eiliad"
      - "[gosod|osod] amserydd am {number_words:seconds} eiliad"
      - "[gosod|osod] amserydd am {timer_seconds_split:seconds}"
    example: "amserydd 45 eiliad"
    response: "default"
    speech_to_phrase: true
