---
# HassTurnOn - name_script
# example: запусти скрипт вечеринка
# slots: {name}

language: "ru"
data:
  - sentences:
      - "[активируй|<turn_on>] [скрипт ]{name}"
    example: "запусти скрипт вечеринка"
    name_domains:
      - "script"
    response: "script"
  - sentences:
      - "включи {name}"
      - "запусти {name}"
    example: "включи Режим невидимки"
    name_domains:
      - "script"
    response: "script"
    speech_to_phrase: true
