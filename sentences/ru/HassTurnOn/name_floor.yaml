---
# HassTurnOn - name_floor
# example: включи вентилятор на первом этаже
# slots:
# - {name}
# - {floor}

language: "ru"
data:
  # on-able domains
  - sentences:
      - "<turn_on> {name} [<in>] {floor} [этаж[е]]"
    example: "включи вентилятор на первом этаже"
    name_domains: "default"
    response: "default"

  # covers
  - sentences:
      - "<open> {name} [<in>] {floor} [этаж[е]]"
    example: "раскрой шторы на первом этаже"
    name_domains:
      - "cover"
    response: "cover"

  # valves
  - sentences:
      - "<open> {name} [<in>] {floor} [этаж[е]]"
    example: "открой клапан на первом этаже"
    name_domains:
      - "valve"
    response: "valve"
