---
# HassTurnOn - name_scene
# example: активируй расслабляющую сцену
# slots: {name}

language: "ru"
data:
  - sentences:
      - "[активируй] ([сцену];{name})"
      - "<turn_on> ([сцену];{name})"
      - "<set> ([сцену];{name})"
    example: "активируй расслабляющую сцену"
    name_domains:
      - "scene"
    response: "scene"
