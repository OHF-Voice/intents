---
# HassTurnOn - name_area
# example: включи лампу в гостиной
# slots: {name}, {area}

language: "ru"
data:
  # on-able domains
  - sentences:
      - "<turn_on> [в|во|на] {area} {name}"
      - "<turn_on> {name} [в|во|на] {area}"
    example: "включи лампу в гостиной"
    name_domains: "default"
    response: "default"

  # covers
  - sentences:
      - "<open> {name} [в|во|на] {area}"
    example: "открой штору в гостиной"
    name_domains:
      - "cover"
    response: "cover_area"

  # valves
  - sentences:
      - "<open> {name} [в|во|на] {area}"
    example: "открой кран в гостиной"
    name_domains:
      - "valve"
    response: "valve"
  - sentences:
      - "открой {name} в {area}"
    example: "открой Левая штора в Гостиная"
    name_domains:
      - "cover"
    response: "cover_area"
    speech_to_phrase: true
  - sentences:
      - "открой {name} в {area}"
    example: "открой Вентиль в Гостиная"
    name_domains:
      - "valve"
    response: "valve"
    speech_to_phrase: true
