---
# HassMediaSearchAndPlay - name_area_media_class
# example: включи подкаст Радио-Т на TV на кухне
# slots: {name}, {area}, {search_query}, {media_class}

language: "ru"
data:
  - sentences:
      - "<play> {media_class} {search_query} на {name} <in> {area}"
    example: "включи подкаст Радио-Т на TV на кухне"
    name_domains:
      - "media_player"
    response: "default"
