---
# HassMediaSearchAndPlay - name_area
# example: включи Битлз на TV на кухне
# slots: {name}, {area}, {search_query}

language: "ru"
data:
  - sentences:
      - "<play> {search_query} на {name} <in> {area}"
    example: "включи Битлз на TV на кухне"
    name_domains:
      - "media_player"
    response: "default"
