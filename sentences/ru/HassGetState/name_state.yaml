---
# HassGetState - name_state
# example: лампа включена
# slots: {name}, {state}

language: "ru"
data:
  # on/off domains (light, switch, fan)
  - sentences:
      - "{name} {on_off_states:state}"
      - "{on_off_states:state} {name}"
    example: "лампа включена"
    name_domains:
      - "light"
      - "switch"
      - "fan"
    response: "one_yesno"

  # covers and valves (open/closed/...)
  - sentences:
      - "{name} {cover_states:state}"
      - "{cover_states:state} {name}"
    example: "штора открыта"
    name_domains:
      - "cover"
      - "valve"
    response: "one_yesno"

  # locks (locked/unlocked)
  - sentences:
      - "[замок] {name} {lock_states:state}"
    example: "Входная дверь заперта"
    name_domains:
      - "lock"
    response: "one_yesno"

  # binary sensors - openings (open/closed)
  - sentences:
      - "{name} {bs_open_states:state}"
    example: "Задняя дверь открыта"
    name_domains:
      - "binary_sensor"
    response: "one_yesno"

  # binary sensors - occupancy
  - sentences:
      - "[<in>] {name} {bs_occupancy_states:state}"
      - "{bs_occupancy_states:state} <in> {name} [<anyone>]"
    example: "Кабинет занят"
    name_domains:
      - "binary_sensor"
    response: "one_yesno"
