---
# HassGetState - name_only
# example: что со светом в спальне
# slots: {name}

language: "ru"
data:
  - sentences:
      - "что с[о] {name}"
      - "<how_is> [у ]{name}"
    example: "что со спальней"
    name_domains: "default"
    response: "one"
  - sentences:
      - "какое состояние у {name}"
    example: "какое состояние у Лампа"
    name_domains: "default"
    response: "one"
    speech_to_phrase: true
