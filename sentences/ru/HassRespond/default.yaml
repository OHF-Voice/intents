---
# HassRespond - default
# example: привет

language: "ru"
data:
  - sentences:
      - "(привет|здравствуй[те]) [хоум ассистент|home assistant]"
    example: "привет"
    response: "hello"

  - sentences:
      - "ты (всегда|постоянно) (слушаешь|записываешь)"
    example: "ты всегда слушаешь"
    response: "listening"

  - sentences:
      - "куда (уходят|отправляются|попадают) [мои] данные"
    example: "куда уходят мои данные"
    response: "data"

  - sentences:
      - "что (я могу|можно) (сказать|спросить)"
    example: "что я могу спросить"
    response: "commands"

  - sentences:
      - "кто тебя (создал|сделал)"
    example: "кто тебя создал"
    response: "creator"
