---
# HassFanSetSpeed - name_only
# example: установи скорость потолочного вентилятора на 50 процентов
# slots: {name}, {percentage}

language: "ru"
data:
  - sentences:
      - "[<numeric_value_set>] скорость [вентилятора] {name} [на] {fan_speed:percentage}[<percent>]"
      - "[<numeric_value_set>] {name} на {fan_speed:percentage}[<percent>]"
    example: "установи скорость потолочного вентилятора на 50 процентов"
    name_domains:
      - "fan"
    response: "default"
