---
# HassVacuumStart - name_only
# example: Запусти пылесос
# slots: {name}

language: ru
data:
  - sentences:
      - "<turn_on> {name}"
    name_domains:
      - "vacuum"
    example: "Запусти пылесос"
    response: "by_name"
  - sentences:
      - "запусти {name}"
      - "включи {name}"
    example: "запусти Ровер"
    name_domains:
      - "vacuum"
    response: "by_name"
    speech_to_phrase: true
