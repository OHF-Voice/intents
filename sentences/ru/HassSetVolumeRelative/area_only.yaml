---
# HassSetVolumeRelative - area_only
# example: прибавь громкость на кухне
# slots: {volume_step}, {area}

language: "ru"
data:
  - sentences:
      - "{volume_step} <volume> <in> {area}"
      - "[сделай] <in> {area} {volume_comparative:volume_step}"
    example: "прибавь громкость на кухне"
    response: "default"
  - sentences:
      - "<numeric_value_increase> <volume> <in> {area} на {volume_step_up:volume_step}[<percent>]"
    example: "прибавь громкость на кухне на 20 процентов"
    response: "default"
  - sentences:
      - "<numeric_value_decrease> <volume> <in> {area} на {volume_step_down:volume_step}[<percent>]"
    example: "уменьши громкость на кухне на 20 процентов"
    response: "default"
