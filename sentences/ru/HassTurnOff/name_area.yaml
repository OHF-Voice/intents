---
# HassTurnOff - name_area
# example: выключи лампу в гостиной
# slots: {name}, {area}

language: "ru"
data:
  # off-able domains
  - sentences:
      - "<turn_off> [в|во|на] {area} {name}"
      - "<turn_off> {name} [в|во|на] {area}"
    example: "выключи лампу в гостиной"
    name_domains: "default"
    response: "default"

  # covers
  - sentences:
      - "<close> {name} [в|во|на] {area}"
    example: "закрой штору в гостиной"
    name_domains:
      - "cover"
    response: "cover_area"

  # valves
  - sentences:
      - "<close> {name} [в|во|на] {area}"
    example: "закрой кран в гостиной"
    name_domains:
      - "valve"
    response: "valve"
  - sentences:
      - "закрой {name} в {area}"
    example: "закрой Левая штора в Гостиная"
    name_domains:
      - "cover"
    response: "cover_area"
    speech_to_phrase: true
  - sentences:
      - "закрой {name} в {area}"
    example: "закрой Вентиль в Гостиная"
    name_domains:
      - "valve"
    response: "valve"
    speech_to_phrase: true
