---
# HassTurnOff - name_only
# example: выключи лампу
# slots: {name}

language: "ru"
data:
  # off-able domains
  - sentences:
      - "<turn_off> {name}"
    example: "выключи лампу"
    name_domains: "default"
    response: "default"

  # covers
  - sentences:
      - "<close> {name}"
    example: "закрой штору"
    name_domains:
      - "cover"
    response: "cover"

  # valves
  - sentences:
      - "<close> {name}"
    example: "закрой кран"
    name_domains:
      - "valve"
    response: "valve"
  - sentences:
      - "выключи {name}"
      - "отключи {name}"
    example: "выключи Потолочный вентилятор"
    name_domains: "default"
    response: "default"
    speech_to_phrase: true
  - sentences:
      - "закрой {name}"
    example: "закрой Левая штора"
    name_domains:
      - "cover"
    response: "cover"
    speech_to_phrase: true
  - sentences:
      - "закрой {name}"
    example: "закрой Вентиль"
    name_domains:
      - "valve"
    response: "valve"
    speech_to_phrase: true
