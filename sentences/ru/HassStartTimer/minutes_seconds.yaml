---
# HassStartTimer - minutes_seconds

language: "ru"
data:
  - sentences:
      - "[установи[ть]|постав(ь|ить)|включи[ть]|запусти[ть]|зада(й|ть)] таймер на {timer_minutes:minutes} минут[у|ы] [и ]{timer_seconds:seconds} секунд[у|ы]"
    example: "поставь таймер на 5 минут и 30 секунд"
    response: "default"
  - sentences:
      - "установи таймер на {timer_minutes:minutes} минут и {timer_seconds:seconds} секунд"
      - "таймер на {timer_minutes:minutes} минут и {timer_seconds:seconds} секунд"
    example: "установи таймер на 50 минут и 50 секунд"
    response: "default"
    speech_to_phrase: true
