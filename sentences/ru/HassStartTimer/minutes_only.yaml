---
# HassStartTimer - minutes_only

language: "ru"
data:
  - sentences:
      - "[установи[ть]|постав(ь|ить)|включи[ть]|запусти[ть]|зада(й|ть)] таймер на {timer_minutes:minutes} минут[у|ы]"
    example: "задай таймер на 10 минут"
    response: "default"
  - sentences:
      - "задай таймер на {timer_minutes:minutes} минут"
      - "таймер на {timer_minutes:minutes} минут"
    example: "задай таймер на 50 минут"
    response: "default"
    speech_to_phrase: true
