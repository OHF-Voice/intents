---
# HassClimateGetTemperature - name_only
# example: koja je temperatura na termostatu
# slots: {name}

language: sr-Latn
data:
  - sentences:
      - "<what_is> <temp> [(u|na|za)] {name}"
      - "koliko je stepeni [(u|na|za)] {name}"
    example: "koja je temperatura na termostatu"
    name_domains:
      - "climate"
    response: "default"
