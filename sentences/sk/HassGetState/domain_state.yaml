language: sk
data:
  - sentences:
      - "<are_any> <light> {on_off_states:state}"
    example: "je nejaké svetlo zapnuté"
    inferred_domain: "light"
    response: any
  - sentences:
      - "<are_all> <light> {on_off_states:state}"
    example: "sú všetky svetlá zapnuté"
    inferred_domain: "light"
    response: all
  - sentences:
      - "<which> <light> <is> {on_off_states:state}"
    example: "ktoré svetlá sú zapnuté"
    inferred_domain: "light"
    response: which
  - sentences:
      - "<how_many> <light> <is> {on_off_states:state}"
    example: "koľko svetiel je zapnutých"
    inferred_domain: "light"
    response: how_many
