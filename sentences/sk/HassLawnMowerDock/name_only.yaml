language: sk
data:
  - sentences:
      - "(zastav[iť]|vypn(i|úť)) ({name};[kosačku])"
      - "vrá(ť|tiť) ({name};[kosačku]) [(do|na) (základňu|dok[u])]"
    example: "zastav Kosáčik"
    name_domains:
      - "lawn_mower"
    response: default
  - sentences:
      - "vypni {name}"
    example: "vypni Kosáčik"
    name_domains:
      - "lawn_mower"
    response: "default"
    speech_to_phrase: true
