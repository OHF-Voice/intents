---
# HassClimateGetTemperature - name_only
# example: what is the temperature of the EcoBee
# slots: {name}

language: "sk"
data:
  - sentences:
      - "ak(á|o) (je;[nastavená ]teplota;[<in> ]{name})"
      - "koľko ((je|má);stupňov;[<in> ]{name})"
    example: "what is the temperature of the EcoBee"
    name_domains:
      - "climate"
    response: "default"
  - sentences:
      - "aká je teplota na {name}"
      - "aká je teplota v {name}"
    example: "aká je teplota na Termostat"
    name_domains:
      - "climate"
    response: "default"
    speech_to_phrase: true
