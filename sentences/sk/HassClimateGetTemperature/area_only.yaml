---
# HassClimateGetTemperature - area_only
# example: aká je teplota v Obývačka
# slots: {area}

language: "sk"
data:
  - sentences:
      - "<what_is> <temp> [je] <area>"
      - "<how_many> stupňov [je] <area>"
    example: "aká je teplota v Obývačka"
    response: "default"
  - sentences:
      - "aká je teplota v {area}"
      - "aká je teplota na {area}"
    example: "aká je teplota v Obývačka"
    response: "default"
    speech_to_phrase: true
