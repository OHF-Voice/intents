language: sk
data:
  - sentences:
      - "(<turn_off>|<turn_off_light>) {name} <area>"
    example: "vypni modrú lampu v kuchyni"
    name_domains: "default"
    response: default
  - sentences:
      - "(<close_door>|<close_curtain>) {name} <area>"
    example: "zatvor garážovú bránu v kuchyni"
    name_domains:
      - "cover"
    response: cover
  - sentences:
      - "<close_valve> [ventil] {name} <area>"
    example: "zatvor ventil hlavný uzáver vody v kuchyni"
    name_domains:
      - "valve"
    response: valve
  - sentences:
      - "<unlock> {name} <area>"
    example: "odomkni vstupné dvere v kuchyni"
    name_domains:
      - "lock"
    response: lock
  - sentences:
      - "vypni {name} v {area}"
      - "zhasni {name} v {area}"
    example: "vypni modrá lampa v kuchyni"
    name_domains: "default"
    response: "default"
    speech_to_phrase: true
  - sentences:
      - "zatvor {name} v {area}"
      - "stiahni {name} v {area}"
    example: "zatvor garážová brána v kuchyni"
    name_domains:
      - "cover"
    response: "cover"
    speech_to_phrase: true
  - sentences:
      - "zatvor {name} v {area}"
      - "zatvor {name} na {area}"
    example: "zatvor hlavný uzáver vody v kuchyni"
    name_domains:
      - "valve"
    response: "valve"
    speech_to_phrase: true
