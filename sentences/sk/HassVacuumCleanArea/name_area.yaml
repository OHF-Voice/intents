language: sk
data:
  - sentences:
      - "[po]vysáva(ť|j) <area> s[o] {name}"
      - "([s]pusti[ť]|zapn(i|úť)) {name} <area>"
    example: "povysávaj obývačku s Vysávačom"
    name_domains:
      - "vacuum"
    response: area
  - sentences:
      - "zapni {name} v {area}"
      - "zapni {name} na {area}"
    example: "zapni Vysávač v obývačka"
    name_domains:
      - "vacuum"
    response: "area"
    speech_to_phrase: true
