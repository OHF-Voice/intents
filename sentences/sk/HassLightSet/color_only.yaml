language: sk
data:
  - sentences:
      - "[<set>] ([<here>];farbu na {color})"
      - "[<set>] ([<here>];{color} [farbu])"
      - "[<set>] túto (miestnosť|izbu) na {color}"
    example: "nastav tu farbu na červenú"
    inferred_domain: "light"
    response: color_here
  - sentences:
      - "nastav farbu na {color}"
    example: "nastav farbu na biela"
    inferred_domain: "light"
    response: "color_here"
    speech_to_phrase: true
