language: sk
data:
  # zapínateľné domény (light/switch/fan/media_player)
  - sentences:
      - "(<turn_on>|<turn_on_light>) {name}"
      - "{name} (<turn_on>|<turn_on_light>)"
    example: "zapni rohovú lampu"
    name_domains: "default"
    response: default
  # ventilátory s predradeným podstatným menom
  - sentences:
      - "<turn_on> [[stropný] (ventilátor|vetrák)] {name}"
      - "[[stropný] (ventilátor|vetrák)] {name} <turn_on>"
    example: "zapni ventilátor Vetrák"
    name_domains:
      - "fan"
    response: default
  # cover (otvor/vytiahni)
  - sentences:
      - "(<open_door>|<open_curtain>) {name}"
    example: "otvor garážovú bránu"
    name_domains:
      - "cover"
    response: cover
  # valve
  - sentences:
      - "<open_valve> [ventil] {name}"
    example: "otvor ventil hlavný uzáver vody"
    name_domains:
      - "valve"
    response: valve
  # lock
  - sentences:
      - "<lock> {name}"
    example: "uzamkni vstupné dvere"
    name_domains:
      - "lock"
    response: lock
  - sentences:
      - "zapni {name}"
      - "rozsvieť {name}"
    example: "zapni rohová lampa"
    name_domains: "default"
    response: "default"
    speech_to_phrase: true
  - sentences:
      - "zapni {name}"
    example: "zapni Vetrák"
    name_domains:
      - "fan"
    response: "default"
    speech_to_phrase: true
  - sentences:
      - "otvor {name}"
      - "vytiahni {name}"
    example: "otvor garážová brána"
    name_domains:
      - "cover"
    response: "cover"
    speech_to_phrase: true
  - sentences:
      - "otvor {name}"
    example: "otvor hlavný uzáver vody"
    name_domains:
      - "valve"
    response: "valve"
    speech_to_phrase: true
