language: sk
data:
  - sentences:
      - "<turn_on_activate> [<scene>] {name}"
      - "zme(ň|niť) scénu na {name}"
      - "<switch_to> (na;scénu) {name}"
    example: "aktivuj scénu párty"
    name_domains:
      - "scene"
    response: scene
  - sentences:
      - "aktivuj {name}"
      - "aktivuj scénu {name}"
    example: "aktivuj párty"
    name_domains:
      - "scene"
    response: "scene"
    speech_to_phrase: true
