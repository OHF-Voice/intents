language: sk
data:
  - sentences:
      - "(<turn_on>|<turn_on_light>) {name} <area>"
    example: "zapni rohovú lampu v kuchyni"
    name_domains: "default"
    response: default
  - sentences:
      - "(<open_door>|<open_curtain>) {name} <area>"
    example: "otvor garážovú bránu v kuchyni"
    name_domains:
      - "cover"
    response: cover
  - sentences:
      - "<open_valve> [ventil] {name} <area>"
    example: "otvor ventil hlavný uzáver vody v kuchyni"
    name_domains:
      - "valve"
    response: valve
  - sentences:
      - "<lock> {name} <area>"
    example: "uzamkni vstupné dvere v kuchyni"
    name_domains:
      - "lock"
    response: lock
  - sentences:
      - "zapni {name} v {area}"
      - "rozsvieť {name} v {area}"
    example: "zapni rohová lampa v kuchyni"
    name_domains: "default"
    response: "default"
    speech_to_phrase: true
  - sentences:
      - "otvor {name} v {area}"
      - "vytiahni {name} v {area}"
    example: "otvor garážová brána v kuchyni"
    name_domains:
      - "cover"
    response: "cover"
    speech_to_phrase: true
  - sentences:
      - "otvor {name} v {area}"
      - "otvor {name} na {area}"
    example: "otvor hlavný uzáver vody v kuchyni"
    name_domains:
      - "valve"
    response: "valve"
    speech_to_phrase: true
