---
# HassFanSetSpeed - area_only
# example: chỉnh quạt phòng ngủ lên 50%
# slots: {area}, {percentage}

language: "vi"
data:
  - sentences:
      - "[đặt|chỉnh|điều chỉnh|để] [tốc độ [của]] [tất cả] [các] quạt [<in>] {area} [lên|xuống|về|thành|đến|tới|ở] [mức] {fan_speed:percentage}[[ ]%| phần trăm]"
      - "bật [tất cả] [các] quạt [<in>] {area} lên [mức] {fan_speed:percentage}[[ ]%| phần trăm]"
      - "tăng [tốc độ [của]] [tất cả] [các] quạt [<in>] {area} lên [mức] {fan_speed:percentage}[[ ]%| phần trăm]"
      - "(giảm|hạ) [tốc độ [của]] [tất cả] [các] quạt [<in>] {area} xuống [mức] {fan_speed:percentage}[[ ]%| phần trăm]"
      - "(cho|để) [tất cả] [các] quạt [<in>] {area} chạy [ở] [mức] {fan_speed:percentage}[[ ]%| phần trăm]"
    example: "chỉnh quạt phòng ngủ lên 50%"
    response: "default"
