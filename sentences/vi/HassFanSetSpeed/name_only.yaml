---
# HassFanSetSpeed - name_only
# example: chỉnh tốc độ quạt trần lên 50%
# slots: {name}, {percentage}

language: "vi"
data:
  - sentences:
      - "[đặt|chỉnh|điều chỉnh|để] [tốc độ [của]] [cái] {name} [lên|xuống|về|thành|đến|tới|ở] [mức] {fan_speed:percentage}[[ ]%| phần trăm]"
      - "bật [cái] {name} lên [mức] {fan_speed:percentage}[[ ]%| phần trăm]"
      - "tăng [tốc độ [của]] [cái] {name} lên [mức] {fan_speed:percentage}[[ ]%| phần trăm]"
      - "(giảm|hạ) [tốc độ [của]] [cái] {name} xuống [mức] {fan_speed:percentage}[[ ]%| phần trăm]"
      - "(cho|để) [cái] {name} chạy [ở] [mức] {fan_speed:percentage}[[ ]%| phần trăm]"
    example: "chỉnh tốc độ quạt trần lên 50%"
    name_domains:
      - "fan"
    response: "default"
