# HassSetVolume - area_only
# OHARRA: "{area}ko" area-izen organikoekin baino ez dabil (Egongela -> egongelako);
# "{area}n", aldiz, beti da zuzena (Sukaldea -> sukaldean, Logela -> logelan).
language: eu
data:
  - sentences:
      - "<zenbakia_ezarri> {area}ko <bolumena> [%|ehuneko ]{volume:volume_level}[era]"
      - "<zenbakia_ezarri> <bolumena> {area}n [%|ehuneko ]{volume:volume_level}[era]"
      - "{area}ko <bolumena> [%|ehuneko ]{volume:volume_level}[era] <zenbakia_ezarri>"
    example: "ezarri egongelako bolumena %50era"
    response: "default"
