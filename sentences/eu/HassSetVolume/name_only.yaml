# HassSetVolume - name_only
language: eu
data:
  - sentences:
      - "<zenbakia_ezarri> {name}ren <bolumena> [%|ehuneko ]{volume:volume_level}[era]"
      - "{name}ren <bolumena> [%|ehuneko ]{volume:volume_level}[era] <zenbakia_ezarri>"
      - "<zenbakia_ezarri> {name} gailuaren <bolumena> [%|ehuneko ]{volume:volume_level}[era]"
    example: "ezarri egongelako telebistaren bolumena %50era"
    name_domains:
      - media_player
    response: "default"
