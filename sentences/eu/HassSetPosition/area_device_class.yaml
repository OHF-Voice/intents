# HassSetPosition - area_device_class
# OHARRA: "{area}ko" area-izen organikoekin baino ez dabil (Egongela -> egongelako);
# "{area}n", aldiz, beti da zuzena (Sukaldea -> sukaldean, Logela -> logelan).
language: eu
data:
  - sentences:
      - "<zenbakia_ezarri> {area}ko {cover_classes:device_class} [%|ehuneko ]{position:position}[era]"
      - "<zenbakia_ezarri> {cover_classes:device_class} [%|ehuneko ]{position:position}[era] {area}n"
    example: "ezarri egongelako gortinak %50era"
    inferred_domain: cover
    response: "cover_device_class"
