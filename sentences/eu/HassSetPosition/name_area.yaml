# HassSetPosition - name_area
# OHARRA: "{area}ko" area-izen organikoekin baino ez dabil (Egongela -> egongelako);
# "{area}n", aldiz, beti da zuzena (Sukaldea -> sukaldean, Logela -> logelan).
language: eu
data:
  - sentences:
      - "<zenbakia_ezarri> {name} {area}n [%|ehuneko ]{position:position}[era]"
      - "<zenbakia_ezarri> {area}ko {name} [%|ehuneko ]{position:position}[era]"
    example: "ezarri ezkerreko gortina egongelan %50era"
    name_domains:
      - cover
    response: "default"
