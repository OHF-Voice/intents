# HassSetPosition - name_floor
# OHARRA: solairu-izenak artikuluarekin gordetzen dira ("Lehen solairua"), eta horri
# "-ko" eransten bagenio "lehen solairuako" litzateke; beraz lokatiboa baino ez da
# erabiltzen ({floor}n).
language: eu
data:
  - sentences:
      - "<zenbakia_ezarri> {name} {floor}n [%|ehuneko ]{position:position}[era]"
    example: "ezarri ezkerreko gortina lehen solairuan %50era"
    name_domains:
      - cover
    response: "default"
