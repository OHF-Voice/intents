# HassVacuumReturnToBase - area_only
# OHARRA: "{area}ko" area-izen organikoekin baino ez dabil (Egongela -> egongelako);
# "{area}n", aldiz, beti da zuzena (Sukaldea -> sukaldean, Logela -> logelan).
language: eu
data:
  - sentences:
      - "{area}ko <xurgagailua> <oinarrira> <xurgagailu_itzuli>"
      - "<xurgagailu_itzuli> {area}ko <xurgagailua> <oinarrira>"
    example: "egongelako xurgagailua oinarrira itzuli"
    response: "default"
