# HassClimateSetFanMode - area_fan_mode
# OHARRA: "{area}ko" area-izen organikoekin baino ez dabil (Egongela -> egongelako);
# "{area}n", aldiz, beti da zuzena (Sukaldea -> sukaldean, Logela -> logelan).
language: eu
data:
  - sentences:
      - "<zenbakia_ezarri> {area}ko <haize_modua> {fan_mode}n"
      - "<zenbakia_ezarri> <haize_modua> {area}n {fan_mode}n"
      - "{area}ko <haize_modua> {fan_mode}n <zenbakia_ezarri>"
    example: "ezarri egongelako haize-modua altuan"
    response: "default"
