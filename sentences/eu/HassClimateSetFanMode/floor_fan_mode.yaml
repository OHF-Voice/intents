# HassClimateSetFanMode - floor_fan_mode
# OHARRA: solairu-izenak artikuluarekin gordetzen dira ("Lehen solairua"), eta horri
# "-ko" eransten bagenio "lehen solairuako" litzateke; beraz lokatiboa baino ez da
# erabiltzen ({floor}n): "ezarri tenperatura lehen solairuan".
language: eu
data:
  - sentences:
      - "<zenbakia_ezarri> {floor}n <haize_modua> {fan_mode}n"
      - "{floor}n <haize_modua> {fan_mode}n <zenbakia_ezarri>"
    example: "ezarri lehen solairuan haize-modua altuan"
    response: "default"
