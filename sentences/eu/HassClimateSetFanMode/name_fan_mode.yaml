# HassClimateSetFanMode - name_fan_mode
# OHARRA: "{name}ren" izen artikuludunarekin (-a) dabil: "Termostatoa" -> "Termostatoaren".
language: eu
data:
  - sentences:
      - "<zenbakia_ezarri> {name}ren <haize_modua> {fan_mode}n"
      - "{name}ren <haize_modua> {fan_mode}n <zenbakia_ezarri>"
    example: "ezarri egongelako termostatoaren haize-modua altuan"
    name_domains:
      - climate
    response: "default"
