# HassCancelTimer - area_only
# OHARRA: "{area}ko" area-izen organikoekin baino ez dabil (Egongela -> egongelako);
# "{area}n", aldiz, beti da zuzena (Sukaldea -> sukaldean, Logela -> logelan).
language: eu
data:
  - sentences:
      - "<timer_cancel> <area_tenporizadorea>"
      - "<area_tenporizadorea> <timer_cancel>"
      - "<timer_cancel> <tenporizadorea> {area}n"
    example: "ezeztatu egongelako tenporizadorea"
    response: "default"
