language: eu
# OHARRA: "{area}ko" area-izen organikoekin baino ez dabil (Egongela -> egongelako);
# "{area}n", aldiz, beti da zuzena (Sukaldea -> sukaldean, Logela -> logelan).
data:
  - sentences:
      - "[<zenbakia_ezarri>] {area}ko kolorea {color}"
      - "[<zenbakia_ezarri>] {area}ko <argia> {color}"
      - "[<zenbakia_ezarri>] <argia> {area}n {color}"
    example: "ezarri logelako argiak gorrira"
    inferred_domain: light
    response: color
