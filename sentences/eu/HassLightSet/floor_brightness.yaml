language: eu
# OHARRA: solairu-izenak artikuluarekin gordetzen dira ("Lehen solairua"), eta horri
# "-ko" eransten bagenio "lehen solairuako" litzateke; beraz lokatiboa baino ez da
# erabiltzen ({floor}n): "ezarri lehen solairuan distira %50era".
data:
  - sentences:
      - "[<zenbakia_ezarri>] {floor}n distira %{brightness}([e]ra|[e]an)"
      - "[<zenbakia_ezarri>] {floor}n distira ehuneko {brightness}([e]ra|[e]an)"
    example: "ezarri lehen solairuan distira %50era"
    inferred_domain: light
    response: brightness
