language: eu
# OHARRA: solairu-izenak artikuluarekin gordetzen dira ("Lehen solairua"), eta horri
# "-ko" eransten bagenio "lehen solairuako" litzateke; beraz lokatiboa baino ez da
# erabiltzen ({floor}n): "ezarri lehen solairuan argiak gorrira".
data:
  - sentences:
      - "[<zenbakia_ezarri>] {floor}n <argia> {color}"
      - "[<zenbakia_ezarri>] {floor}n kolorea {color}"
    example: "ezarri lehen solairuan argiak gorrira"
    inferred_domain: light
    response: color
