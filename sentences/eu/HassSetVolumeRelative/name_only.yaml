# HassSetVolumeRelative - name_only
language: eu
data:
  - sentences:
      - "{volume_step:volume_step} {name}ren <bolumena>"
      - "{name}ren <bolumena> {volume_step:volume_step}"
      - "<volume_up> {name}ren <bolumena> [%|ehuneko ]{volume_step_up:volume_step}"
      - "<volume_down> {name}ren <bolumena> [%|ehuneko ]{volume_step_down:volume_step}"
    example: "igo egongelako telebistaren bolumena"
    name_domains:
      - media_player
    response: "default"
