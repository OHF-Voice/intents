# HassIncreaseTimer - area_hours
# OHARRA: "{area}ko" area-izen organikoekin baino ez dabil (Egongela -> egongelako);
# "{area}n", aldiz, beti da zuzena (Sukaldea -> sukaldean, Logela -> logelan).
language: eu
data:
  - sentences:
      - "<timer_increase> <orduak> <area_tenporizadorea>"
      - "<timer_increase> <area_tenporizadorea> <orduak>"
      - "<area_tenporizadorea> <orduak> <timer_increase>"
    example: "gehitu ordu bat egongelako tenporizadoreari"
    response: "default"
