# HassIncreaseTimer - area_hours_seconds
# OHARRA: "{area}ko" area-izen organikoekin baino ez dabil (Egongela -> egongelako);
# "{area}n", aldiz, beti da zuzena (Sukaldea -> sukaldean, Logela -> logelan).
language: eu
data:
  - sentences:
      - "<timer_increase> <orduak> [eta] <segundoak> <area_tenporizadorea>"
      - "<timer_increase> <area_tenporizadorea> <orduak> [eta] <segundoak>"
      - "<area_tenporizadorea> <orduak> [eta] <segundoak> <timer_increase>"
    example: "gehitu ordu bat eta 30 segundo egongelako tenporizadoreari"
    response: "default"
