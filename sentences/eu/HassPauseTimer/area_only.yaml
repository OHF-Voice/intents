# HassPauseTimer - area_only
# OHARRA: "{area}ko" area-izen organikoekin baino ez dabil (Egongela -> egongelako);
# "{area}n", aldiz, beti da zuzena (Sukaldea -> sukaldean, Logela -> logelan).
language: eu
data:
  - sentences:
      - "<timer_pause> <area_tenporizadorea>"
      - "<area_tenporizadorea> <timer_pause>"
      - "<timer_pause> <tenporizadorea> {area}n"
    example: "pausatu egongelako tenporizadorea"
    response: "default"
