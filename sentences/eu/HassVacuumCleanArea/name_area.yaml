language: eu
# OHARRA: "{area}ko" area-izen organikoekin baino ez dabil (Egongela -> egongelako);
# "{area}n", aldiz, beti da zuzena (Sukaldea -> sukaldean, Logela -> logelan).
data:
  - sentences:
      - "<xurgatu> {area} {name} xurgagailuarekin"
      - "{name} xurgagailua[k] <xurgatu> {area}"
    example: "xurgatu sukaldea Roomba xurgagailuarekin"
    name_domains:
      - "vacuum"
    response: "default"
