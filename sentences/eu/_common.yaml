        "button": "botoi", "input_button": "botoi", "automation": "automatizazio",
        "camera": "kamera", "siren": "sirena", "humidifier": "hezegailu",
        "water_heater": "ur-berogailu", "remote": "urrutiko aginte",
        "alarm_control_panel": "alarma", "todo": "egiteko zerrenda",
        "weather": "eguraldi"
      } -%}
      Ez dago {{ domains.get(domain, domain.replace('_', ' ')) }} motako elementurik
