# "{area}n", aldiz, beti da zuzena (Sukaldea -> sukaldean, Logela -> logelan).
data:
  - sentences:
      - "<media> <media_pausatu> {area}n"
      - "<media_pausatu> <media> {area}n"
      - "{area}n <media> <media_pausatu>"
    example: "musika pausatu sukaldean"
    response: "default"
