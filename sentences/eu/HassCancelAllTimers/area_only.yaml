# HassCancelAllTimers - area_only
# OHARRA: "{area}ko" area-izen organikoekin baino ez dabil (Egongela -> egongelako);
# "{area}n", aldiz, beti da zuzena (Sukaldea -> sukaldean, Logela -> logelan).
language: eu
data:
  - sentences:
      - "<timer_cancel> {area}ko tenporizadore guztiak"
      - "<timer_cancel> tenporizadore guztiak {area}n"
      - "tenporizadore guztiak {area}n <timer_cancel>"
    example: "ezeztatu egongelako tenporizadore guztiak"
    response: "area"
