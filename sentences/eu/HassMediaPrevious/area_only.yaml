language: eu
# OHARRA: "{area}ko" area-izen organikoekin baino ez dabil (Egongela -> egongelako);
# "{area}n", aldiz, beti da zuzena (Sukaldea -> sukaldean, Logela -> logelan).
data:
  - sentences:
      - "<aurreko_media> {area}n"
      - "<abestia> <media_atzera> {area}n"
      - "{area}n <abestia> <media_atzera>"
    example: "aurreko abestia sukaldean"
    response: "default"
