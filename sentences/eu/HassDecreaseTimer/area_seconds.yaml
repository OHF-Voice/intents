# HassDecreaseTimer - area_seconds
# OHARRA: "{area}ko" area-izen organikoekin baino ez dabil (Egongela -> egongelako);
# "{area}n", aldiz, beti da zuzena (Sukaldea -> sukaldean, Logela -> logelan).
language: eu
data:
  - sentences:
      - "<timer_decrease> <segundoak> <area_tenporizadorea>"
      - "<timer_decrease> <area_tenporizadorea> <segundoak>"
      - "<area_tenporizadorea> <segundoak> <timer_decrease>"
    example: "kendu 30 segundo egongelako tenporizadoreari"
    response: "default"
