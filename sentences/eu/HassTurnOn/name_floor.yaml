language: eu
# OHARRA: solairu-izenak artikuluarekin gordetzen dira ("Lehen solairua"), eta horri
# "-ko" eransten bagenio "lehen solairuako" litzateke; beraz lokatiboa baino ez da
# erabiltzen ({floor}n): "piztu argiak lehen solairuan".
data:
  # on-able domains
  - sentences:
      - "<piztu> {name} {floor}n"
      - "{name} <piztu> {floor}n"
      - "<piztu> {floor}n {name}"
    example: "piztu egongelako haizegailua lehen solairuan"
    name_domains: default
    response: default

  # covers
  - sentences:
      - "(ireki|altxatu) {name} {floor}n"
      - "{name} (ireki|altxatu) {floor}n"
    example: "ireki egongelako pertsiana lehen solairuan"
    name_domains:
      - cover
    response: cover

  # valves
  - sentences:
      - "(ireki|altxatu) {name} {floor}n"
      - "{name} (ireki|altxatu) {floor}n"
    example: "ireki ur balbula lehen solairuan"
    name_domains:
      - valve
    response: valve
