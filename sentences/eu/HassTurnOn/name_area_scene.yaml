language: eu
# OHARRA: "{area}ko" area-izen organikoekin baino ez dabil (Egongela -> egongelako);
# "{area}n", aldiz, beti da zuzena (Sukaldea -> sukaldean, Logela -> logelan).
data:
  - sentences:
      - "[<piztu>] {area}n {name} [eszena]"
      - "[<piztu>] {area}ko {name} [eszena]"
      - "{area}n {name} [eszena] <piztu>"
      - "{area}ko {name} [eszena] <piztu>"
      - "{name} [eszena] {area}n <piztu>"
    example: "piztu egongelako festa giroa eszena"
    name_domains:
      - scene
    response: scene
