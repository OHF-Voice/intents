# HassClimateSetTemperature - floor_temperature
# OHARRA: solairu-izenak artikuluarekin gordetzen dira ("Lehen solairua"), eta horri
# "-ko" eransten bagenio "lehen solairuako" litzateke; beraz lokatiboa baino ez da
# erabiltzen ({floor}n): "ezarri tenperatura lehen solairuan".
language: eu
data:
  - sentences:
      - "<zenbakia_ezarri> {floor}n tenperatura {temperature} gradutan"
      - "<zenbakia_ezarri> {floor}n tenperatura {temperature} gradura"
      - "<zenbakia_ezarri> tenperatura {temperature} gradutan {floor}n"
      - "{floor}n tenperatura {temperature} gradutan <zenbakia_ezarri>"
    example: "ezarri tenperatura lehen solairuan 20 gradutan"
    response: "default"
