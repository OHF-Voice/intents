# HassClimateSetTemperature - area_temperature
# OHARRA: "{area}ko" area-izen organikoekin baino ez dabil (Egongela -> egongelako);
# "{area}n", aldiz, beti da zuzena (Sukaldea -> sukaldean, Logela -> logelan).
language: eu
data:
  - sentences:
      - "<zenbakia_ezarri> {area}ko tenperatura {temperature} gradutan"
      - "<zenbakia_ezarri> {area}ko tenperatura {temperature} gradura"
      - "<zenbakia_ezarri> tenperatura {temperature} gradutan {area}n"
      - "{area}ko tenperatura {temperature} gradutan <zenbakia_ezarri>"
    example: "ezarri egongelako tenperatura 20 gradutan"
    response: "default"
