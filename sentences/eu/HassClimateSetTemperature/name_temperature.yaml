# HassClimateSetTemperature - name_temperature
# OHARRA: "{name}ren" izen artikuludunarekin (-a) dabil: "Termostatoa" -> "Termostatoaren".
language: eu
data:
  - sentences:
      - "<zenbakia_ezarri> {name}ren tenperatura {temperature} gradutan"
      - "<zenbakia_ezarri> {name}ren tenperatura {temperature} gradura"
      - "{name}ren tenperatura {temperature} gradutan <zenbakia_ezarri>"
    example: "ezarri egongelako termostatoaren tenperatura 20 gradutan"
    name_domains:
      - climate
    response: "default"
