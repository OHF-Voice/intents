# HassVacuumStart - area_only
# OHARRA: "{area}ko" area-izen organikoekin baino ez dabil (Egongela -> egongelako);
# "{area}n", aldiz, beti da zuzena (Sukaldea -> sukaldean, Logela -> logelan).
language: eu
data:
  - sentences:
      - "<abiarazi> {area}ko <xurgagailua>"
      - "<abiarazi> <xurgagailua> {area}n"
      - "{area}ko <xurgagailua> <abiarazi>"
    example: "hasi egongelako xurgagailua"
    response: "default"
