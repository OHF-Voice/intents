# HassFanSetSpeed - name_only
# OHARRA: "{name}ren" izen artikuludunarekin (-a) dabil: "Termostatoa" -> "Termostatoaren".
language: eu
data:
  - sentences:
      - "<zenbakia_ezarri> {name}ren <abiadura> [%|ehuneko ]{fan_speed:percentage}[era]"
      - "{name}ren <abiadura> [%|ehuneko ]{fan_speed:percentage}[era] <zenbakia_ezarri>"
    example: "ezarri logelako haizegailuaren abiadura %50era"
    name_domains:
      - fan
    response: "default"
