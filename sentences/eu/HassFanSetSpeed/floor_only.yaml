# HassFanSetSpeed - floor_only
# OHARRA: solairu-izenak artikuluarekin gordetzen dira ("Lehen solairua"), eta horri
# "-ko" eransten bagenio "lehen solairuako" litzateke; beraz lokatiboa baino ez da
# erabiltzen ({floor}n): "ezarri tenperatura lehen solairuan".
language: eu
data:
  - sentences:
      - "<zenbakia_ezarri> {floor}n <haizegailua>ren <abiadura> [%|ehuneko ]{fan_speed:percentage}[era]"
      - "{floor}n <abiadura> [%|ehuneko ]{fan_speed:percentage}[era] <zenbakia_ezarri>"
    example: "ezarri lehen solairuan haizegailuaren abiadura %50era"
    response: "default"
