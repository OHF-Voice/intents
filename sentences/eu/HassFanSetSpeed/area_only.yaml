# HassFanSetSpeed - area_only
# OHARRA: "{area}ko" area-izen organikoekin baino ez dabil (Egongela -> egongelako);
# "{area}n", aldiz, beti da zuzena (Sukaldea -> sukaldean, Logela -> logelan).
language: eu
data:
  - sentences:
      - "<zenbakia_ezarri> {area}ko <haizegailua>ren <abiadura> [%|ehuneko ]{fan_speed:percentage}[era]"
      - "<zenbakia_ezarri> <haizegailua>ren <abiadura> [%|ehuneko ]{fan_speed:percentage}[era] {area}n"
      - "{area}ko <haizegailua>ren <abiadura> [%|ehuneko ]{fan_speed:percentage}[era] <zenbakia_ezarri>"
    example: "ezarri egongelako haizegailuaren abiadura %50era"
    response: "default"
