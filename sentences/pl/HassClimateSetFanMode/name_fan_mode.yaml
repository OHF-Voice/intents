      - "<set> (tryb |bieg )wentylatora {name} na {fan_mode}"
      - "<set> {name} (tryb |bieg )wentylatora na {fan_mode}"
    example: "ustaw tryb wentylatora termostat na auto"
    name_domains:
      - "climate"
    response: "default"
