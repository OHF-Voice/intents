---
# HassFanSetSpeed - name_only
# example: ustaw prędkość wentylator na 50 procent
# slots: {name}, {percentage}

language: "pl"
data:
  - sentences:
      - "<set> [prędkość|obroty] {name} [na ]{fan_speed:percentage}[[ ]%| procent]"
    example: "ustaw prędkość wentylator na 50 procent"
    name_domains:
      - "fan"
    response: "default"
