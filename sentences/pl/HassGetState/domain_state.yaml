---
# HassGetState - domain_state
# example: czy wszystkie światła są włączone

language: "pl"
data:
  - sentences:
      - "<are_any> (<light>|<lights>) {on_off_states:state}"
      - "<are_any> {on_off_states:state} (<light>|<lights>)"
    example: "czy są jakieś światła włączone"
    inferred_domain: "light"
    response: "any"
  - sentences:
      - "<are_all> (<light>|<lights>) [jest|są] {on_off_states:state}"
    example: "czy wszystkie światła są włączone"
    inferred_domain: "light"
    response: "all"
  - sentences:
      - "<which> (<light>|<lights>) (jest|są) {on_off_states:state}"
    example: "które światła są włączone"
    inferred_domain: "light"
    response: "which"
  - sentences:
      - "<how_many> (<light>|<lights>) (jest|są) {on_off_states:state}"
      - "<how_many> (jest|są) {on_off_states:state} (<light>|<lights>)"
    example: "ile świateł jest włączonych"
    inferred_domain: "light"
    response: "how_many"
