---
# HassVacuumCleanArea - name_area
# example: odkurz w salonie za pomocą odkurzacz
# slots: {name}, {area}

language: "pl"
data:
  - sentences:
      - "<clean> (w|na) {area} (za pomocą|przez) {name}"
      - "(uruchom|włącz) {name} (w|na) {area}"
    example: "odkurz w salonie za pomocą odkurzacz"
    name_domains:
      - "vacuum"
    response: "default"
