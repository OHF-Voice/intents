---
# HassMediaPlayerMute - name_only
# example: wycisz telewizor
# slots: {name}

language: "pl"
data:
  - sentences:
      - "(wycisz|wyłącz dźwięk) [(muzykę|dźwięk|odtwarzanie)] {name}"
      - "(wycisz|wyłącz dźwięk) [(muzykę|dźwięk|odtwarzanie)] (w|na|przez) {name}"
    example: "wycisz telewizor"
    name_domains:
      - "media_player"
    response: "default"
