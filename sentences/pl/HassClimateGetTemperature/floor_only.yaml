---
# HassClimateGetTemperature - floor_only
# example: jaka jest temperatura na parterze
# slots: {floor}

language: "pl"
data:
  - sentences:
      - "(<what_is>|<how_many_is>) [aktualna |obecna ]<temp> [na ]{floor} [piętro]"
      - "(<what_is>|<how_many_is>) [na ]{floor} [piętro] [aktualna |obecna ]<temp>"
      - "czy [jest |bardzo ](ciepło|gorąco|zimno|chłodno) [na ]{floor} [piętro]"
    example: "jaka jest temperatura na parterze"
    response: "default"
