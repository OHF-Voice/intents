---
# HassTurnOff - name_floor
# example: wyłącz lampę na piętrze
# slots: {name}, [na |w ]{floor}

language: "pl"
data:
  - sentences:
      - "(<turn_off>|<turn_off_light>) {name} [na |w ]{floor} [piętro]"
      - "[na |w ]{floor} [piętro] (<turn_off>|<turn_off_light>) {name}"
    example: "wyłącz lampę na piętrze"
    name_domains: "default"
    response: "default"
