---
# HassMediaSearchAndPlay - name_area_media_class
# example: zagraj piosenkę Bohemian Rhapsody na telewizor w salonie
# slots: {name}, {area}, {search_query}, {media_class}

language: "pl"
data:
  - sentences:
      - "<media_search> {media_class} {search_query} (w|na|przez) {name} (w|na) {area}"
    example: "zagraj piosenkę Bohemian Rhapsody na telewizor w salonie"
    name_domains:
      - "media_player"
    response: "default"
