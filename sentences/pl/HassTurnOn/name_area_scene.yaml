---
# HassTurnOn - name_area_scene
# example: aktywuj scenę Relaks w salonie
# slots:
# - {name}
# - {area}

language: "pl"
data:
  - sentences:
      - "(<activate>|<turn_on>) [scenę ]{name} <area>"
      - "<area> (<activate>|<turn_on>) [scenę ]{name}"
      - "scena {name} <area>"
    example: "aktywuj scenę Relaks w salonie"
    name_domains:
      - "scene"
    response: "scene"
