---
# HassMediaPlayerUnmute - name_only
# example: włącz dźwięk telewizor
# slots: {name}

language: "pl"
data:
  - sentences:
      - "(włącz dźwięk|wyłącz wyciszenie) [(muzykę|dźwięk|odtwarzanie)] {name}"
      - "(włącz dźwięk|wyłącz wyciszenie) [(muzykę|dźwięk|odtwarzanie)] (w|na|przez) {name}"
    example: "włącz dźwięk telewizor"
    name_domains:
      - "media_player"
    response: "default"
