---
# HassLawnMowerDock - name_only
# example: wróć clippy do bazy
# slots: {name}

language: "pl"
data:
  - sentences:
      - "(zatrzymaj|odstaw|wyłącz|zadokuj) {name} [kosiark[ę|i]]"
      - "(zawróć|wróć|zadokuj|odstaw) {name} do (bazy|stacji|doku)"
    example: "wróć clippy do bazy"
    name_domains:
      - "lawn_mower"
    response: "default"
