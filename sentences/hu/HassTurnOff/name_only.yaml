---
# HassTurnOff - name_only
# example: kapcsold ki a mennyezeti lámpát
# slots: {name}

language: "hu"

data:
  - sentences:
      - "(<turn_off>; <name>)"
    example: "kapcsold ki a mennyezeti világítást"
    name_domains: "default"
    response: "default"

  # covers
  - sentences:
      - "<close> <name>"
    example: "zárd be a tolóajtót"
    name_domains:
      - "cover"
      - "valve"
    response: "cover"
