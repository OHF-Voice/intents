---
# HassMediaSearchAndPlay - area_only
# example: játszd le a következőt Pink Floyd a konyhában
# slots:
# - {area}
# - {search_query}

language: "hu"
data:
  - sentences:
      - "(játszd le|indítsd [el]) a következőt {search_query} <area>"
    example: "játszd le a következőt The Office a garázsban"
    response: "default"
