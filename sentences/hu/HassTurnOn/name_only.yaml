---
# HassTurnOn - name_only
# example: kapcsold be a mennyezeti lámpát
# slots: {name}

language: "hu"
data:
  - sentences:
      - "(<turn_on>; <name>)"
      - "<name>"
    example: "kapcsold be a mennyezeti világítást"
    name_domains: "default"
    response: "default"

  # covers
  - sentences:
      - "<open> <name>"
    example: "nyisd ki a tolóajtót"
    name_domains:
      - "cover"
      - "valve"
    response: "cover"
