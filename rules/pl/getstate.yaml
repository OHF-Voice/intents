language: pl
expansion_rules:
  what_is: "Jak(a jest|i jest|ie [jest|są]|ą| jest)"
  how_is: "(jaki jest stan|jaki jest status|jaka jest wartość)"
  where_is: "(<where> [<is>]|gdzie (jest|przebywa|znajduje się|można znaleźć))"
  is: "(czy [jest|są]|jest|są)"
  are_any: "czy (jest|są) [jakiś|jakieś|któryś|któreś|jakiekolwiek|którekolwiek]"
  are_all: "czy <all>"
  which: "(który|które|która)"
  how_many: "(ile|ilu)"
  lockable: "(zamek|zamki|zamków|drzwi)"
