---
language: tr

expansion_rules:
  # Soru eki. Türkçede ayrı yazılır ve ünlü uyumuna göre değişir:
  # "açık mı", "kilitli mi", "dolu mu", "bölünmüş mü".
  mi: "(mı|mi|mu|mü)"

  # Sorgulanan varlık adları. Durum sorularında ad yalın hâlde kullanılır,
  # bu yüzden çekimli biçimlere gerek yoktur.
  isik: "(ışık|lamba)"
  isiklar_c: "(ışıklar|lambalar)"
  fan_t: "(fan|vantilatör)"
  fanlar_c: "(fanlar|vantilatörler)"
  priz: "(priz|anahtar|düğme)"
  prizler_c: "(prizler|anahtarlar|düğmeler)"
  kilit: "kilit"
  kilitler_c: "kilitler"

  # Sayma ve seçme soruları
  kac_tane: "kaç [tane]"
