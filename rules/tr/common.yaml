---
language: tr

expansion_rules:
  # Konuşmacının bulunduğu alan: "buradaki ışıklar"
  burada: "(buradaki|burdaki)"

  # Niteleyici: "bütün ışıklar", "tüm perdeler"
  butun: "(bütün|tüm)"

  # Ev geneli: "evdeki bütün ışıklar"
  ev_geneli: "(evdeki|evin|her yerdeki|bütün evdeki)"

  # Işık kaynakları, çoğul. Her iki sözcük de kalın ünlülüdür, bu yüzden
  # yalnızca -lar/-ları biçimleri geçerlidir ("ışıkler" değil).
  isiklar: "(ışık|lamba)(lar|ları)"

  # Fanlar, çoğul. "fan" kalın, "vantilatör" ince ünlülüdür; ünlü uyumu
  # gereği ekleri ayrı verilir.
  fanlar: "(fan(lar|ları)|vantilatör(ler|leri))"
