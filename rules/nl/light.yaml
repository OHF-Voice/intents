language: nl
expansion_rules:
  light_no_article: (lamp[en]|licht[en]|verlichting)
  light: ([de] lamp[en]|[het] licht|[de] lichten|[de] verlichting)
  light_composed: (lamp[en]|licht|verlichtings)
  room_light: ([de] kamer[ ]lamp[en]|[het] kamer[ ]licht|[de] kamer[ ]lichten|[de] kamer[ ]verlichting)
  all_light: ((elke|iedere) lamp|(elk|ieder|al het) licht|(alle|al de) verlichting|(alle|al de) lampen|(alle|al de) lichten)
  brightness_no_article: (helderheid|felheid|intensiteit|sterkte)

  # Strict rules for HassLightSet.
  # Each verb only with the particle it takes in front of the target value:
  # zet de lamp op 50% / verander de helderheid naar 50% / mag de lamp op 50%
  light_set_op: (zet|doe|draai|mag)
  light_set_naar: (zet|draai|verander|verhoog|verlaag)
  # de lamp op 50% zetten / de helderheid naar 50% verhogen
  light_set_op_infinitive: "[kunnen] (zetten|doen|draaien|instellen)"
  light_set_naar_infinitive: "[kunnen] (zetten|draaien|veranderen|verhogen|verlagen)"
  # dim de lamp naar 30%
  light_dim_to: (naar|op)
  # The lights, always with an article
  the_light: (de lamp[en]|het licht|de lichten|de verlichting)
  the_lights: (<the_light>|<all_light>)
  # Brightness targets: a number, optionally followed by the noun only after % or procent,
  # or a named level. Dimming does not go to the maximum.
  brightness_target: ({brightness}[%| procent]|{brightness_level:brightness}|{brightness_level_max:brightness})
  brightness_target_noun: (<brightness_target>|{brightness}(%| procent) <brightness_no_article>)
  brightness_dim_target: ({brightness}[%| procent]|{brightness_level:brightness})
  brightness_dim_target_noun: (<brightness_dim_target>|{brightness}(%| procent) <brightness_no_article>)
  # Color: maak de lamp blauw / zet de lamp op (de kleur) blauw / verander de lamp naar|in blauw
  light_color_op: (zet|doe|mag)
  light_color_op_infinitive: "[kunnen] (zetten|doen)"
  light_color_naar_infinitive: "[kunnen] veranderen"
  # Color temperature
  color_temperature_noun: (kleurtemperatuur|kleur temperatuur|lichtkleur[temperatuur])
  kelvin: "[ ](k|kelvin)"
  color_temperature_target: ({color_temperature:temperature}[<kelvin>]|{color_temperature_names:temperature})
