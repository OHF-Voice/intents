language: nl
expansion_rules:
  numeric_value_set: (zet|doe|mag|verander|maak|draai|verhoog|verlaag)
  # Strict replacements for <numeric_value_set> + <to>: each verb only with
  # the particle it takes in front of a target value.
  # zet de verwarming op 21 graden / verander de temperatuur naar 21 graden
  value_set_op: (zet|draai|doe|mag)
  value_set_naar: (zet|draai|verander|verhoog|verlaag)
  # de verwarming op 21 graden zetten / de temperatuur naar 21 graden verhogen
  value_set_op_infinitive: (zetten|draaien|doen|instellen)
  value_set_naar_infinitive: (zetten|draaien|veranderen|verhogen|verlagen)
  open: (open|omhoog|naar boven|opwaarts|op|optrekken|ophalen)
