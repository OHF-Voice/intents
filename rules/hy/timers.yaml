language: hy
expansion_rules:
  timer_set: (դիր|դրեք|միացրու|միացրեք|սահմանիր|սահմանեք|գործարկիր|գործարկեք)
  timer_cancel: (չեղարկիր|չեղարկեք|անջատիր|անջատեք|ջնջիր|ջնջեք)
  timer_pause: (դադարեցրու|դադարեցրեք|կասեցրու|կասեցրեք)
  timer_unpause: (շարունակիր|շարունակեք|վերսկսիր|վերսկսեք)
  timer_add: (ավելացրու|ավելացրեք)
  timer_extend: (երկարացրու|երկարացրեք)
  timer_remove: (հանիր|հանեք|պակասեցրու|պակասեցրեք)
  timer_shorten: (կրճատիր|կրճատեք)
  timer: (ժամաչափ|թայմեր)[ը|ն]
  timer_of: (ժամաչափի|թայմերի)
  timer_to: (ժամաչափին|թայմերին)
  timer_from: (ժամաչափից|թայմերից)
  timers: (ժամաչափեր|ժամաչափներ|թայմերներ)[ը|ն]
  timer_named: (անունով|անվանումով)
  timer_status: (կարգավիճակ|վիճակ)[ը]
  how_much: (որքա՞ն|որքան|ինչքա՞ն|ինչքան)
  and: (և|ու)
  # duration ("5 րոպե", "5 րոպեով") vs. timer length ("5 րոպեանոց ժամաչափ")
  hour: ժամ[ով]
  minute: րոպե[ով]
  second: վայրկյան[ով]
  hour_long: (ժամանոց|ժամվա)
  minute_long: րոպեանոց
  second_long: վայրկյանանոց
