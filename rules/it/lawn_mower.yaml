language: it
expansion_rules:
  mower_noun: (tosaerba|tagliaerba|taglierba|rasaerba)
  mower_ref: "[robot ]<mower_noun>"
  mow: (tagli(a[mi]|are) | tos(a[mi]|are) | falci(a[mi]|are)) ([l']erba|il prato)
  mower_stop: (ferm(a|are) | arrest(a|are) | annull(a|are) | interromp(i|ere) | spegn(i|ere) | stopp(a|are))
  mower_return: (riport(a|are) | port(a|are) | rimand(a|are) | mand(a|are) | mett(i|ere) | rimett(i|ere) | <to_do> tornare)
  mower_go: (va|torna)
