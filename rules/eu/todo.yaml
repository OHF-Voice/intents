language: eu
expansion_rules:
  # Egiteko zerrendak ("gehitu esnea erosketa zerrendara")
  gehitu_item: (gehitu|erantsi|sartu|idatzi)
  kendu_item: (kendu|ezabatu|atera)
  # "markatu eginda bezala esnea", "markatu erosita esnea", "amaitu esnea"
  markatu_eginda: (markatu (eginda|erosita) [bezala|gisan|moduan]|(eginda|erosita) markatu [bezala|gisan|moduan]|amaitu|bukatu)
