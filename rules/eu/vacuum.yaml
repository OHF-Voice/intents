language: eu
expansion_rules:
  # Xurgagailua abiarazteko aditzak ("xurgatu sukaldea", "garbiketa egin hemen").
  xurgatu: (xurgatu|garbitu|garbiketa egin)
  # Xurgagailua izendatzeko moduak ("hasi xurgagailua", "xurgagailuaren")
  xurgagailua: (xurgagailu[a|ak|aren|ari])
  # Oinarrira itzultzeko aditzak ("Roomba oinarrira itzuli", "Roomba bueltatu")
  xurgagailu_itzuli: (itzuli|bueltatu|eraman)
  # Nora? Lau formak onartzen dira: "oinarrira", "kargagunera", "kargatzeko gunera" eta "basera".
  # Belar-mozgailuak ere arau bera erabiltzen du ("Clippy kargagunera itzuli").
  oinarrira: (oinarrira|kargagunera|kargatzeko gunera|basera)
