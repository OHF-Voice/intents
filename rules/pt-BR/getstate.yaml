language: pt-BR
expansion_rules:
  is: (está|estão|tá|tão|existe|existem)
  what_is: (qual é|qual|quais|que|me diga|me diz|diga|diz|diz-me|diga-me)
  how_is: (como está|como estão|como vai|como vão)
  where_is: (onde está|onde estão|cadê|onde fica|onde ficam)
  which: (que|qual|quais)
  how_many: (quantos|quantas)
  are_any: (há|tem|existe[m]|está[ão]|tá[ão]) [(algum|alguma|alguns|algumas)]
  are_all: (estão|está) (todos|todas|tod(os|as)) [(os|as)]
  lockable: "[(a|as|o|os)] (fechadura[s]|trinco[s]|porta[s]|janela[s]|portão|portões|cadeado[s])"
  light: (luz|luzes|lâmpada|lâmpadas|candeeiro|candeeiros|iluminação)
