language: ml
expansion_rules:
  turn: (ചെ(യ്യൂ|യ്യുക|വിൻ)|ആ(ക്കുക|ക്കൂ|ക്കുവിൻ))
  open: (തുറ(ക്കൂ|ക്കുക|ക്കുവിൻ))
  close: (അട(ക്കൂ|ക്കുക|ക്കുവിൻ)|മൂടു(ക|വിൻ)|മൂടൂ|മറയ്(ക്കുക|ക്കൂ|ക്കുവിൻ))
  set: (ക്രമപ്പെടുത്തുക|ആക്കുക|ക്രമീകരിക്കുക|ക്രമമാക്കുക|സജ്ജീകരിക്കുക|വയ്ക്കുക|നിലകൊള്ളിക്കുക|ഒരുക്കുക|സജ്ജമാക്കുക)
  broadcast: (പ്രക്ഷേപിക്കുക|പ്രസാരണം (ചെയ്യുക|നടത്തുക|നടപ്പിലാക്കുക|നിർവഹിക്കുക)|പ്രക്ഷേപണം (ചെയ്യുക|നടത്തുക|നടപ്പിലാക്കുക|നിർവഹിക്കുക) |പ്രസാരം (ചെയ്യുക|നടത്തുക|നടപ്പിലാക്കുക|നിർവഹിക്കുക)|സംപ്രേക്ഷണം (ചെയ്യുക|നടത്തുക|നടപ്പിലാക്കുക|നിർവഹിക്കുക)|വിഞ്ജാപനം (ചെയ്യുക|നടത്തുക|നടപ്പിലാക്കുക|നിർവഹിക്കുക) |പരസ്യം (ചെയ്യുക|നടത്തുക|നടപ്പിലാക്കുക|നിർവഹിക്കുക)|വിളംബരം (ചെയ്യുക|നടത്തുക|നടപ്പിലാക്കുക)|പ്രസ്ഥാപനം (ചെയ്യുക|നടത്തുക|നടപ്പിലാക്കുക)|പ്രഖ്യാപനം (ചെയ്യുക|നടത്തുക|നടപ്പിലാക്കുക)|ബ്രോഡ്ക്യാസ്റ്റ് (ചെയ്യുക|നടത്തുക|നടപ്പിലാക്കുക))
  check_off: (വെട്ടി(ക്കളയുക| കളയുക| മാറ്റുക|യിടുക| ഇടുക)|ശരി (ചിഹ്നമിടുക|അടയാളപ്പെടുത്തുക))
  complete: (പൂർത്തിയാക്കുക|മുഴുമിപ്പിക്കുക|തീർക്കുക|ചെയ്തു തീർക്കുക)
  remove: (നീക്കുക|നീക്കം ചെയ്യുക|ഒഴിവാക്കുക|തുടച്ചുകളയുക)

  # Present-progressive interrogative verb forms
  listening_question: (കേൾക്കുന്നുണ്ടോ|ശ്രദ്ധിക്കുന്നുണ്ടോ)
  reccording_question: (റെക്കോഡ് ചെയ്യുന്നുണ്ടോ|പതിവു ചെയ്യുന്നുണ്ടോ)

  # Vacuum and lawn mower commands.
  clean_floor: (തൂത്തുവാരൂ|തൂത്തുവാരുക|വൃത്തിയാക്കൂ|വൃത്തിയാക്കുക|വാക്വം ചെയ്യുക)
  start_cleaner: (തുടങ്ങൂ|തുടങ്ങുക|ഓടിക്കൂ|ഓടിക്കുക)
  mow_grass: പുല്ല് (വെട്ടൂ|വെട്ടുക|വെട്ടാൻ തുടങ്ങൂ|വെട്ടാൻ തുടങ്ങുക)
  return_cleaner: തിരികെ (അയയ്ക്കൂ|അയയ്ക്കുക)
  stop_mowing: പുല്ല് വെട്ടുന്നത് (നിർത്തൂ|നിർത്തുക|നിറുത്തൂ|നുറുത്തുക)

  # പേരിടൽ — reusable naming phrase; no case suffix is attached to the name.
  named: (എന്ന|എന്ന പേരുള്ള)
  # കഴിഞ്ഞ് എന്നത് ക്രിയയുടെ രൂപമാണ്, വിഭക്തിയല്ല — temporal verb form, not a case ending.
  after_duration: കഴിഞ്ഞ്
