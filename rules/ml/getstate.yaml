language: ml
expansion_rules:
  what_is: (എന്താ|എ(ന്ത് ആണ്|ന്താണ്|ന്താകുന്നു)|(ന്താ|ന്നാ)ണ്|എ(ന്നാ|ന്നാണ്|ന്നതാണ്)|എന്തോ(ണ്ടാ|ണ്ടാണ്)|എ(ത്ര|ത്രയാ|ത്രയാണ്|ത്രയാകുന്നു))
  # Questions follow the entity name in Malayalam.
  where_is: (എവിടെയാണ്|എവിടെയുണ്ട്|എവിടെയാണുള്ളത്)
  which_ones: (ഏതൊക്കെയാണ്|ഏതെല്ലാമാണ്)
  how_many: (എത്രയുണ്ട്|എത്രയെണ്ണമുണ്ട്)
