language: ml
expansion_rules:
  _brightness: (തെളിച്ചം|വെണ്മ|പ്രകാശം)
  light: (വിള(ക്ക്|ക്കും)|ലാ(മ്പ്|മ്പും)|ലൈ(റ്റ്|റ്റും))
  lights: (വിളക്കുക(ൾ|ളും)|ലാമ്പുക(ൾ|ളും)|ലൈറ്റുക(ൾ|ളും))
  # Plural nouns with the conjunctive suffix ഉം (ബഹുവചനം + ഉം).
  # Used with എല്ലാ (all) for universal quantification; not a case ending.
  lights_plural_conjunctive: (വിളക്കുകളും|ലൈറ്റുകളും|ലാമ്പുകളും)
