language: "hi"
expansion_rules:
  here: "(यहाँ | यहां | इधर | इस कमरे में | इस जगह [पर])"
  # bare adverb only — safe to follow with a postposition
  here_adv: "(यहाँ | यहां | इधर)"
  # genitive form: "यहाँ की सफाई" — the "इस कमरे में" variant cannot take की
  here_gen: "(यहाँ की | यहां की | इधर की | इस कमरे की | इस जगह की)"
  date_word: "(तारीख | तारीख़ | तिथि | डेट)"
