---
# HassLightSet - area_temperature

language: "es"
areas:
  - name: "Salón"

tests:
  - sentences:
      - "pon la temperatura de color del salón a 2700 kelvin"
    slots:
      area: "Salón"
      temperature: 2700
    response: "Temperatura de color establecida"

  - sentences:
      - "ajusta la temperatura de color de las luces del salón a blanco cálido"
    slots:
      area: "Salón"
      temperature: 2700
    response: "Temperatura de color establecida"
