---
# HassGetState - domain_state_floor

language: "ko"
floors:
  - name: "1층"
areas:
  - name: "거실"
    floor: "1층"

entities:
  - name: "천장등"
    domain: "light"
    state: "on"
    area: "거실"
  - name: "스탠드"
    domain: "light"
    state: "off"
    area: "거실"
  - name: "천장 선풍기"
    domain: "fan"
    state: "on"
    area: "거실"
  - name: "환풍기"
    domain: "fan"
    state: "off"
    area: "거실"
  - name: "벽 스위치"
    domain: "switch"
    state: "on"
    area: "거실"
  - name: "콘센트 스위치"
    domain: "switch"
    state: "off"
    area: "거실"
  - name: "거실문"
    domain: "lock"
    state: "locked"
    area: "거실"
  - name: "베란다문"
    domain: "lock"
    state: "unlocked"
    area: "거실"

tests:
  # ---- lights ----
  - sentences:
      - "1층에 조명이 켜져있어"
      - "1층에 조명이 켜져있는지 알아"
    slots:
      floor: "1층"
      state: "on"
    response: "네, 천장등 켜져 있습니다"
  - sentences:
      - "1층에 모든 조명이 켜져있어"
    slots:
      floor: "1층"
      state: "on"
    response: "아니요, 스탠드 켜져 있지 않습니다"
  - sentences:
      - "1층에 어떤 조명이 켜져있는지 알려줘"
    slots:
      floor: "1층"
      state: "on"
    response: "천장등 켜져 있습니다"
  - sentences:
      - "1층에 얼마나 많은 조명이 켜져있는지 알려줘"
    slots:
      floor: "1층"
      state: "on"
    response: "1개가 켜져 있습니다"

  # ---- fans ----
  - sentences:
      - "1층에 팬이 켜져있어"
      - "1층에 팬이 켜져있는지 알아"
    slots:
      floor: "1층"
      state: "on"
    response: "네, 천장 선풍기 켜져 있습니다"
  - sentences:
      - "1층에 모든 팬이 켜져있어"
    slots:
      floor: "1층"
      state: "on"
    response: "아니요, 환풍기 켜져 있지 않습니다"
  - sentences:
      - "1층에 어떤 팬이 켜져있는지 알려줘"
    slots:
      floor: "1층"
      state: "on"
    response: "천장 선풍기 켜져 있습니다"
  - sentences:
      - "1층에 얼마나 많은 팬이 켜져있는지 알려줘"
    slots:
      floor: "1층"
      state: "on"
    response: "1개가 켜져 있습니다"

  # ---- switches ----
  - sentences:
      - "1층에 스위치가 켜져있어"
      - "1층에 스위치가 켜져있는지 알아"
    slots:
      floor: "1층"
      state: "on"
    response: "네, 벽 스위치 켜져 있습니다"
  - sentences:
      - "1층에 모든 스위치가 켜져있어"
    slots:
      floor: "1층"
      state: "on"
    response: "아니요, 콘센트 스위치 켜져 있지 않습니다"
  - sentences:
      - "1층에 어떤 스위치가 켜져있는지 알려줘"
    slots:
      floor: "1층"
      state: "on"
    response: "벽 스위치 켜져 있습니다"
  - sentences:
