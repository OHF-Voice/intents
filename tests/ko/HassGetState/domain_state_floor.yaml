    response: "1개가 켜져 있습니다"

  # ---- locks ----
  - sentences:
      - "1층에 잠겨있는 문이 있어"
    slots:
      floor: "1층"
      state: "locked"
    response: "네, 거실문 잠겨 있습니다"
  - sentences:
      - "1층에 모든 문 잠겨있어"
    slots:
      floor: "1층"
      state: "locked"
    response: "아니요, 베란다문 잠겨 있지 않습니다"
  - sentences:
      - "어떤 1층에 문이 잠겨있어"
    slots:
      floor: "1층"
      state: "locked"
    response: "거실문 잠겨 있습니다"
  - sentences:
      - "1층에 얼마나 많은 문이 잠겨있어"
    slots:
      floor: "1층"
      state: "locked"
    response: "1개가 잠겨 있습니다"
