    domain: "fan"

tests:
  - sentences:
      - "դիր առաստաղի օդափոխիչի արագությունը 50 տոկոս"
      - "դարձրու առաստաղի օդափոխիչը 50 տոկոս"
    slots:
      percentage: 50
      name: "առաստաղի օդափոխիչ"
    response: "Արագությունը դարձրեցի"
