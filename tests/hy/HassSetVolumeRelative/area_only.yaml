---
# HassSetVolumeRelative - area_only

language: hy

areas:
  - name: "հյուրասենյակ"

tests:
  - sentences:
      - "բարձրացրու հյուրասենյակի ձայնը"
      - "ավելացրու ձայնը հյուրասենյակում"
    slots:
      volume_step: "up"
      area: "հյուրասենյակ"
    response: "Ձայնի բարձրությունը դարձրեցի"

  - sentences:
      - "իջեցրու հյուրասենյակի ձայնը"
      - "պակասեցրու ձայնը հյուրասենյակում"
    slots:
      volume_step: "down"
      area: "հյուրասենյակ"
    response: "Ձայնի բարձրությունը դարձրեցի"

  - sentences:
      - "բարձրացրու հյուրասենյակի ձայնը 20 տոկոսով"
    slots:
      volume_step: 20
      area: "հյուրասենյակ"
    response: "Ձայնի բարձրությունը դարձրեցի"

  - sentences:
      - "իջեցրու հյուրասենյակի ձայնը 20 տոկոսով"
    slots:
      volume_step: -20
      area: "հյուրասենյակ"
    response: "Ձայնի բարձրությունը դարձրեցի"
