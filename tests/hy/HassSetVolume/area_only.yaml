---
# HassSetVolume - area_only

language: hy

areas:
  - name: "հյուրասենյակ"

tests:
  - sentences:
      - "դիր հյուրասենյակի ձայնը 50 տոկոս"
      - "դարձրու ձայնը հյուրասենյակում 50"
      - "իջեցրու հյուրասենյակի ձայնը մինչև 50 տոկոս"
    slots:
      volume_level: 50
      area: "հյուրասենյակ"
    response: "Ձայնի բարձրությունը դարձրեցի"
