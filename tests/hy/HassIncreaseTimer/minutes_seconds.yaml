---
# HassIncreaseTimer - minutes_seconds

language: hy

tests:
  - sentences:
      - "ավելացրու 5 րոպե 30 վայրկյան ժամաչափին"
      - "թայմերին ավելացրեք 5 րոպե 30 վայրկյան"
      - "երկարացրու ժամաչափը 5 րոպե 30 վայրկյանով"
    slots:
      minutes: 5
      seconds: 30
    response: "5 րոպե և 30 վայրկյան ավելացրեցի ժամաչափին"

  - sentences:
      - "ավելացրու 5 ու կես րոպե ժամաչափին"
      - "երկարացրու ժամաչափը 5 ու կես րոպեով"
    slots:
      minutes: 5
      seconds: 30
    response: "5 րոպե և 30 վայրկյան ավելացրեցի ժամաչափին"
