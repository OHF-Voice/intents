language: hy

tests:
  - sentences:
      - "ավելացրու 30 վայրկյան ժամաչափին"
      - "թայմերին ավելացրեք 30 վայրկյան"
      - "երկարացրու ժամաչափը 30 վայրկյանով"
    slots:
      seconds: 30
    response: "30 վայրկյան ավելացրեցի ժամաչափին"

  - sentences:
      - "ավելացրու կես րոպե ժամաչափին"
      - "երկարացրու ժամաչափը կես րոպեով"
    slots:
      seconds: 30
    response: "30 վայրկյան ավելացրեցի ժամաչափին"
