---
# HassIncreaseTimer - minutes_only

language: hy

tests:
  - sentences:
      - "ավելացրու 5 րոպե ժամաչափին"
      - "թայմերին ավելացրեք 5 րոպե"
      - "երկարացրու ժամաչափը 5 րոպեով"
    slots:
      minutes: 5
    response: "5 րոպե ավելացրեցի ժամաչափին"

  - sentences:
      - "ավելացրու կես ժամ ժամաչափին"
      - "երկարացրու ժամաչափը կես ժամով"
    slots:
      minutes: 30
    response: "30 րոպե ավելացրեցի ժամաչափին"
