---
# HassClimateSetTemperature - floor_temperature

language: hy

floors:
  - name: "առաջին հարկ"

tests:
  - sentences:
      - "դիր առաջին հարկի ջերմաստիճանը 22 աստիճան"
      - "սահմանիր ջերմաստիճանը առաջին հարկում 22"
    slots:
      temperature: 22
      floor: "առաջին հարկ"
    response: "Ջերմաստիճանը դարձրեցի 22 աստիճան"
