---
# HassGetWeather - default

language: hy

entities:
  - name: "Տուն"
    domain: "weather"
    state: "rainy"
    attributes:
      temperature: 12
      temperature_unit: "°C"

tests:
  - sentences:
      - "ինչ եղանակ է"
      - "ինչպիսի եղանակ է դրսում"
      - "ինչպես է եղանակը այսօր"
    response: "12 °C և անձրևոտ"
