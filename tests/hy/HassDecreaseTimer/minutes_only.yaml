---
# HassDecreaseTimer - minutes_only

language: hy

tests:
  - sentences:
      - "հանիր 5 րոպե ժամաչափից"
      - "թայմերից պակասեցրու 5 րոպե"
      - "կրճատիր ժամաչափը 5 րոպեով"
    slots:
      minutes: 5
    response: "5 րոպե հանեցի ժամաչափից"

  - sentences:
      - "հանիր կես ժամ ժամաչափից"
      - "կրճատիր ժամաչափը կես ժամով"
    slots:
      minutes: 30
    response: "30 րոպե հանեցի ժամաչափից"
