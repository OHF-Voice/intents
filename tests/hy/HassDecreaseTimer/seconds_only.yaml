# HassDecreaseTimer - seconds_only

language: hy

tests:
  - sentences:
      - "հանիր 30 վայրկյան ժամաչափից"
      - "թայմերից պակասեցրու 30 վայրկյան"
      - "կրճատիր ժամաչափը 30 վայրկյանով"
    slots:
      seconds: 30
    response: "30 վայրկյան հանեցի ժամաչափից"

  - sentences:
      - "հանիր կես րոպե ժամաչափից"
      - "կրճատիր ժամաչափը կես րոպեով"
    slots:
      seconds: 30
    response: "30 վայրկյան հանեցի ժամաչափից"
