---
# HassRespond - default

language: hy

tests:
  - sentences:
      - "բարև"
      - "Ողջույն Հոմ Ասիսթանթ"
    response: "Բարև Հոմ Ասիսթանթից"

  - sentences:
      - "դու միշտ լսում ես"
      - "դուք ձայնագրում եք"
    response: "Ոչ, ձայնագրում եմ միայն երբ արտասանում եք արթնացման բառը"

  - sentences:
      - "ուր են գնում իմ տվյալները"
    response: "Ձեր տվյալները ուղարկվում են ձեր Հոմ Ասիսթանթ սերվերին"

  - sentences:
      - "ինչ կարող եմ հարցնել"
    response: "Սովորելու համար թե ինչ կարող եք հարցնել, այցելեք home-assistant.io/voice"

  - sentences:
      - "ով է ստեղծել քեզ"
      - "քեզ ով է ստեղծել"
    response: "Ես ստեղծվել եմ հիանալի Հոմ Ասիսթանթ համայնքի կողմից, որը կազմված է ամբողջ աշխարհի տեխնոլոգիասերներից"
