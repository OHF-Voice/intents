---
# HassSetPosition - device_class

language: hy

tests:
  - sentences:
      - "բացիր վարագույրները 50 տոկոսով"
    slots:
      device_class: "curtain"
      position: 50
    response: "Վարագույրի դիրքը դարձրեցի"

  - sentences:
      - "դիր պատուհանի դիրքը այստեղ 30 տոկոս"
    slots:
      device_class: "window"
      position: 30
    response: "Պատուհանի դիրքը դարձրեցի"
