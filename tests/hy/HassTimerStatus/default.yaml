---
# HassTimerStatus - default

language: hy

timers:
  - is_active: true
    start_minutes: 5
    rounded_minutes_left: 5
    total_seconds_left: 300

tests:
  - sentences:
      - "ժամաչափի կարգավիճակը"
      - "որքան ժամանակ է մնացել ժամաչափի վրա"
      - "ինչքան է մնացել"
    response: "5 րոպե մնացել է."
