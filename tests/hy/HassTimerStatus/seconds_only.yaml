---
# HassTimerStatus - seconds_only

language: hy

timers:
  - is_active: true
    start_seconds: 45
    rounded_seconds_left: 45
    total_seconds_left: 45

tests:
  - sentences:
      - "45 վայրկյանանոց ժամաչափի կարգավիճակը"
      - "որքան է մնացել 45 վայրկյանանոց ժամաչափի վրա"
    slots:
      start_seconds: 45
    response: "45 վայրկյան մնացել է."
