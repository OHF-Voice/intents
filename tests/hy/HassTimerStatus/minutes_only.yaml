---
# HassTimerStatus - minutes_only

language: hy

timers:
  - is_active: true
    start_minutes: 10
    rounded_minutes_left: 10
    total_seconds_left: 600

tests:
  - sentences:
      - "10 րոպեանոց ժամաչափի կարգավիճակը"
      - "որքան է մնացել 10 րոպեանոց ժամաչափի վրա"
    slots:
      start_minutes: 10
    response: "10 րոպե մնացել է."
