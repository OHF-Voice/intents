---
# HassStartTimer - minutes_only

language: hy

tests:
  - sentences:
      - "դիր ժամաչափ 5 րոպեով"
      - "միացրու 5 րոպեանոց ժամաչափ"
      - "5 րոպեանոց թայմեր"
      - "ժամաչափ 5 րոպե"
      - "ժամաչափը դիր 5 րոպեով"
    slots:
      minutes: 5
    response: "Ժամաչափ սահմանեցի 5 րոպե"

  - sentences:
      - "սահմանիր ժամաչափ կես ժամով"
      - "ժամաչափ կես ժամ"
    slots:
      minutes: 30
    response: "Ժամաչափ սահմանեցի 30 րոպե"
