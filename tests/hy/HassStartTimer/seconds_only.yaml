# HassStartTimer - seconds_only

language: hy

tests:
  - sentences:
      - "դիր ժամաչափ 30 վայրկյանով"
      - "միացրու 30 վայրկյանանոց ժամաչափ"
      - "30 վայրկյանանոց թայմեր"
      - "ժամաչափ 30 վայրկյան"
      - "ժամաչափը դիր 30 վայրկյանով"
    slots:
      seconds: 30
    response: "Ժամաչափ սահմանեցի 30 վայրկյան"

  - sentences:
      - "սահմանիր ժամաչափ կես րոպեով"
      - "ժամաչափ կես րոպե"
    slots:
      seconds: 30
    response: "Ժամաչափ սահմանեցի 30 վայրկյան"
