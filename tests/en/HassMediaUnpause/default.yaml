---
# HassMediaUnpause - default

language: "en"
tests:
  - sentences:
      - "unpause"
      - "resume"
      # Speech-to-Phrase phrasings: a media noun is required there, so these
      # must keep working here too.
      - "resume music"
      - "resume the music"
      - "resume my show"
      - "unpause the movie"
      - "unpause the media player"
    response: "Resumed"
