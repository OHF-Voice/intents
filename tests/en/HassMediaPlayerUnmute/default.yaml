---
# HassMediaPlayerUnmute - default

language: "en"
tests:
  - sentences:
      - "unmute"
      - "unmute the music"
      - "unmute the media in here"
      # Speech-to-Phrase phrasings: a media noun is required there, so these
      # must keep working here too.
      - "unmute music"
      - "unmute the movie"
      - "unmute the media player"
      - "unmute my show"
    response: "Unmuted"
