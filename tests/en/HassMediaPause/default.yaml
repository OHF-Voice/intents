---
# HassMediaPause - default

language: "en"
tests:
  - sentences:
      - "pause"
      - "stop playing"
      # Speech-to-Phrase phrasings: a media noun is required there, so these
      # must keep working here too.
      - "pause music"
      - "pause the music"
      - "pause my show"
      - "pause the movie"
      - "pause the media player"
      - "stop the music"
      - "stop playing the song"
    response: "Paused"
