---
# HassMediaPlayerMute - default

language: "en"
tests:
  - sentences:
      - "mute"
      - "mute the music"
      - "mute the media in here"
      # Speech-to-Phrase phrasings: a media noun is required there, so these
      # must keep working here too.
      - "mute music"
      - "mute the movie"
      - "mute the media player"
      - "mute my show"
    response: "Muted"
