---
# HassMediaNext - default

language: "en"
tests:
  - sentences:
      - "next item"
      - "skip song"
      - "skip track"
      - "skip to the next song"
      - "skip to next track"
      - "skip this song"
      - "skip the track"
      - "skip"
      - "skip this"
      # Speech-to-Phrase phrasings: a media noun is required there, so these
      # must keep working here too.
      - "next song"
      - "next track"
      - "skip item"
      - "skip this item"
      - "skip to the next item"
    response: "Playing next"
