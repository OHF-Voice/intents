---
# HassStartTimer - seconds_only

language: "tr"
tests:
  - sentences:
      - "30 saniyelik zamanlayıcı kur"
      - "30 saniyelik sayaç kur"
      - "30 saniyelik zamanlayıcı başlat"
      - "30 saniyelik zamanlayıcı ayarla"
      - "zamanlayıcıyı 30 saniyeye ayarla"
      - "sayacı 30 saniyeye ayarla"
      - "zamanlayıcıyı 30 saniyeye kur"
    slots:
      seconds: 30
    response: "30 saniye için zamanlayıcı başladı"

  - sentences:
      - "yarım dakikalık zamanlayıcı kur"
      - "yarım dakikalık sayaç başlat"
    slots:
      seconds: 30
    response: "30 saniye için zamanlayıcı başladı"
