---
# HassSetVolumeRelative - area_only

language: "tr"
areas:
  - name: "Mutfak"
tests:
  - sentences:
      - "Mutfakta sesi yükselt"
    slots:
      area: "Mutfak"
      volume_step: "up"
    response: "Ses ayarlandı"
  - sentences:
      - "Mutfakta sesi kıs"
    slots:
      area: "Mutfak"
      volume_step: "down"
    response: "Ses ayarlandı"
