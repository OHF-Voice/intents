# HassClimateGetTemperature - floor_only

language: "tr"
floors:
  - name: "Üst Kat"
areas:
  - name: "Yatak Odası"
    floor: "Üst Kat"
entities:
  - name: "Kat Termostatı"
    domain: "climate"
    area: "Yatak Odası"
    state: "21"
