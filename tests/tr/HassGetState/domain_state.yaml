---
# HassGetState - domain_state

language: "tr"
entities:
  - name: "Salon Lambası"
    domain: "light"
    state: "on"
  - name: "Tavan Fanı"
    domain: "fan"
    state: "on"
  - name: "Mutfak Prizi"
    domain: "switch"
    state: "on"
  - name: "Ön Kapı"
    domain: "lock"
    state: "locked"

tests:
  - sentences:
      - "açık ışık var mı"
    slots:
      domain: "light"
      state: "on"
    response: "Evet, Salon Lambası"
  - sentences:
      - "bütün ışıklar açık mı"
    slots:
      domain: "light"
      state: "on"
    response: "Evet"
  - sentences:
      - "hangi ışıklar açık"
    slots:
      domain: "light"
      state: "on"
    response: "Salon Lambası"
  - sentences:
      - "kaç ışık açık"
    slots:
      domain: "light"
      state: "on"
    response: "1"
  - sentences:
      - "açık fan var mı"
    slots:
      domain: "fan"
      state: "on"
    response: "Evet, Tavan Fanı"
  - sentences:
      - "bütün fanlar açık mı"
    slots:
      domain: "fan"
      state: "on"
    response: "Evet"
  - sentences:
      - "hangi fanlar açık"
    slots:
      domain: "fan"
      state: "on"
    response: "Tavan Fanı"
  - sentences:
