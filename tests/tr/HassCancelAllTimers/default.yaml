---
# HassCancelAllTimers - default

language: "tr"
timers:
  - start_minutes: 5
    total_seconds_left: 300
    rounded_minutes_left: 5
  - start_minutes: 10
    total_seconds_left: 600
    rounded_minutes_left: 10
tests:
  - sentences:
      - "tüm zamanlayıcıları iptal et"
      - "bütün zamanlayıcıları iptal et"
      - "zamanlayıcıları iptal et"
      - "sayaçları iptal et"
      - "tüm sayaçları durdur"
      - "bütün zamanlayıcıları sil"
    response: "2 zamanlayıcı iptal edildi."
