---
# HassTimerStatus - default

language: "tr"
timers:
  - is_active: true
    total_seconds_left: 300
    rounded_hours_left: 0
    rounded_minutes_left: 5
    rounded_seconds_left: 0
    start_minutes: 5
tests:
  - sentences:
      - "zamanlayıcıda ne kadar kaldı"
      - "zamanlayıcı ne kadar kaldı"
      - "sayaçta ne kadar var"
      - "zamanlayıcı durumu"
      - "sayaç durumu nedir"
      - "kaç dakika kaldı"
    response: "5 dakika kaldı."
