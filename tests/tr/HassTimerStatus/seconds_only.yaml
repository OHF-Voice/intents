      - "30 saniyelik zamanlayıcıda ne kadar kaldı"
      - "30 saniye sayaçta ne kadar var"
      - "30 saniyelik zamanlayıcı durumu"
    slots:
      start_seconds: 30
    response: "25 dakika kaldı."
