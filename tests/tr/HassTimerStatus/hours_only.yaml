---
# HassTimerStatus - hours_only

language: "tr"
timers:
  - is_active: true
    total_seconds_left: 1500
    rounded_hours_left: 0
    rounded_minutes_left: 25
    rounded_seconds_left: 0
    start_hours: 1
tests:
  - sentences:
      - "1 saatlik zamanlayıcıda ne kadar kaldı"
      - "1 saat sayaçta ne kadar var"
      - "1 saatlik zamanlayıcı durumu"
    slots:
      start_hours: 1
    response: "25 dakika kaldı."
