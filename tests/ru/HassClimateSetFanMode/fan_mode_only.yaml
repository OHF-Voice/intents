---
# HassClimateSetFanMode - fan_mode_only

language: "ru"
tests:
  - sentences:
      - "установи режим вентилятора на авто"
      - "режим вентилятора автоматический"
      - "поставь мощность кондиционера на авто"
    slots:
      fan_mode: "auto"
    response: "Режим изменён"

  - sentences:
      - "установи кондиционер на минимум"
      - "мощность сплита на минимум"
    slots:
      fan_mode: "low"
    response: "Режим изменён"
