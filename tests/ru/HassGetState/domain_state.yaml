language: ru
entities:
  - name: "Лампа А"
    domain: "light"
    state: "on"
  - name: "Лампа Б"
    domain: "light"
    state: "on"
  - name: "Лампа В"
    domain: "light"
    state: "off"
  - name: "Вентилятор А"
    domain: "fan"
    state: "on"
  - name: "Выключатель А"
    domain: "switch"
    state: "on"
  - name: "Входная дверь"
    domain: "lock"
    state: "locked"
  - name: "Задняя дверь"
    domain: "lock"
    state: "unlocked"
tests:
  # lights
  - sentences:
      - "есть включенные лампы"
      - "есть включённая лампа"
      - "есть ли включённая лампа"
      - "есть какая-нибудь включённая лампа"
      - "есть включенный светильник"
    slots:
      state: "on"
    response: "Да, Лампа А и Лампа Б"
  - sentences:
      - "весь свет выключен"
      - "всё освещение выключено"
    slots:
      state: "off"
    response: "Лампа А — нет и Лампа Б — нет"
  - sentences:
      - "какие лампы включены"
      - "какая лампа включена"
      - "какой светильник включён"
    slots:
      state: "on"
    response: "Лампа А и Лампа Б"
  - sentences:
      - "сколько ламп включено"
      - "сколько включённых ламп"
    slots:
      state: "on"
    response: "2"
  # fans
  - sentences:
      - "есть включенные вентиляторы"
    slots:
      state: "on"
    response: "Да, Вентилятор А"
  - sentences:
      - "все вентиляторы выключены"
    slots:
      state: "off"
    response: "Вентилятор А — нет"
  - sentences:
      - "какие вентиляторы включены"
    slots:
      state: "on"
    response: "Вентилятор А"
  - sentences:
      - "сколько вентиляторов включено"
    slots:
      state: "on"
    response: "1"
  # switches
  - sentences:
      - "есть включенные выключатели"
    slots:
      state: "on"
    response: "Да, Выключатель А"
  - sentences:
      - "все выключатели выключены"
    slots:
      state: "off"
    response: "Выключатель А — нет"
  - sentences:
      - "какие выключатели включены"
    slots:
      state: "on"
    response: "Выключатель А"
  - sentences:
      - "сколько выключателей включено"
    slots:
      state: "on"
    response: "1"
  # locks
  - sentences:
      - "есть незапертые двери"
      - "есть незапертый замок"
    slots:
      state: "unlocked"
    response: "Да, Задняя дверь"
  - sentences:
      - "все двери заперты"
    slots:
      state: "locked"
    response: "Задняя дверь — нет"
  - sentences:
      - "какие замки не заперты"
      - "какая дверь не заперта"
      - "какой замок не заперт"
    slots:
      state: "unlocked"
    response: "Задняя дверь"
  - sentences:
      - "сколько дверей заперто"
      - "сколько запертых дверей"
    slots:
      state: "locked"
    response: "1"
