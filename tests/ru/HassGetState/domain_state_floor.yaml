---
# HassGetState - domain_state_floor

language: ru
floors:
  - name: "Первом этаже"
  - name: "Наверху"

areas:
  - name: "Кухне"
    floor: "Первом этаже"
  - name: "Прихожей"
    floor: "Первом этаже"
  - name: "Спальне"
    floor: "Наверху"

entities:
  # on a different floor: must be EXCLUDED from Первом этаже queries
  - name: "Бра"
    domain: "light"
    state: "on"
    area: "Спальне"
  - name: "Вентилятор С"
    domain: "fan"
    state: "on"
    area: "Спальне"
  - name: "Выключатель С"
    domain: "switch"
    state: "on"
    area: "Спальне"
  - name: "Балконная дверь"
    domain: "lock"
    state: "unlocked"
    area: "Спальне"
  - name: "Лампа А"
    domain: "light"
    state: "on"
    area: "Кухне"
  - name: "Лампа Б"
    domain: "light"
    state: "off"
    area: "Кухне"
  - name: "Вентилятор А"
    domain: "fan"
    state: "on"
    area: "Кухне"
  - name: "Вытяжка"
    domain: "fan"
    state: "off"
    area: "Кухне"
  - name: "Выключатель А"
    domain: "switch"
    state: "on"
    area: "Кухне"
  - name: "Выключатель Б"
    domain: "switch"
    state: "off"
    area: "Кухне"
  - name: "Входная дверь"
    domain: "lock"
    state: "locked"
    area: "Прихожей"
  - name: "Задняя дверь"
    domain: "lock"
    state: "unlocked"
    area: "Прихожей"

tests:
  # ---- lights ----
  - sentences:
      - "есть включенные лампы на первом этаже"
      - "есть на первом этаже включенный свет"
      - "на первом этаже есть включенные светильники"
    slots:
      domain: "light"
      state: "on"
      floor: "Первом этаже"
    response: "Да, Лампа А"
  - sentences:
      - "весь свет на первом этаже выключен"
      - "все лампы выключены на первом этаже"
      - "на первом этаже все лампы выключены"
    slots:
      domain: "light"
      state: "off"
      floor: "Первом этаже"
    response: "Лампа А — нет"
  - sentences:
      - "какие лампы включены на первом этаже"
      - "на первом этаже какой свет включен"
    slots:
      domain: "light"
      state: "on"
      floor: "Первом этаже"
    response: "Лампа А"
  - sentences:
      - "сколько ламп включено на первом этаже"
      - "сколько ламп на первом этаже включено"
      - "сколько включенных ламп на первом этаже"
      - "сколько на первом этаже включено ламп"
      - "на первом этаже сколько светильников включено"
    slots:
      domain: "light"
      state: "on"
      floor: "Первом этаже"
    response: "1"

  # ---- fans ----
  - sentences:
      - "есть на первом этаже включенные вентиляторы"
      - "есть включенные вентиляторы на первом этаже"
      - "на первом этаже есть включенный вентилятор"
    slots:
      domain: "fan"
      state: "on"
      floor: "Первом этаже"
    response: "Да, Вентилятор А"
  - sentences:
      - "все вентиляторы на первом этаже выключены"
      - "все вентиляторы выключены на первом этаже"
      - "на первом этаже все вентиляторы выключены"
    slots:
      domain: "fan"
      state: "off"
      floor: "Первом этаже"
    response: "Вентилятор А — нет"
  - sentences:
      - "какие вентиляторы включены на первом этаже"
      - "на первом этаже какие вентиляторы включены"
    slots:
      domain: "fan"
      state: "on"
      floor: "Первом этаже"
    response: "Вентилятор А"
  - sentences:
      - "сколько вентиляторов включено на первом этаже"
      - "сколько вентиляторов на первом этаже включено"
      - "сколько включенных вентиляторов на первом этаже"
      - "сколько на первом этаже включено вентиляторов"
      - "на первом этаже сколько вентиляторов включено"
    slots:
      domain: "fan"
      state: "on"
      floor: "Первом этаже"
    response: "1"

  # ---- switches ----
  - sentences:
      - "есть на первом этаже включенные выключатели"
      - "есть включенные выключатели на первом этаже"
      - "на первом этаже есть включенный выключатель"
    slots:
      domain: "switch"
      state: "on"
      floor: "Первом этаже"
    response: "Да, Выключатель А"
  - sentences:
      - "все выключатели на первом этаже выключены"
      - "все выключатели выключены на первом этаже"
      - "на первом этаже все выключатели выключены"
    slots:
      domain: "switch"
      state: "off"
      floor: "Первом этаже"
    response: "Выключатель А — нет"
  - sentences:
      - "какие выключатели включены на первом этаже"
      - "на первом этаже какие выключатели включены"
    slots:
      domain: "switch"
      state: "on"
      floor: "Первом этаже"
    response: "Выключатель А"
  - sentences:
      - "сколько выключателей включено на первом этаже"
      - "сколько выключателей на первом этаже включено"
      - "сколько включенных выключателей на первом этаже"
      - "сколько на первом этаже включено выключателей"
      - "на первом этаже сколько выключателей включено"
    slots:
      domain: "switch"
      state: "on"
      floor: "Первом этаже"
    response: "1"

  # ---- locks ----
  - sentences:
      - "есть на первом этаже незапертые двери"
      - "есть незапертые двери на первом этаже"
      - "есть незапертая дверь на первом этаже"
      - "на первом этаже есть незапертые замки"
    slots:
      domain: "lock"
      state: "unlocked"
      floor: "Первом этаже"
    response: "Да, Задняя дверь"
  - sentences:
      - "все двери на первом этаже заперты"
      - "все замки заперты на первом этаже"
      - "на первом этаже все замки заперты"
    slots:
      domain: "lock"
      state: "locked"
      floor: "Первом этаже"
    response: "Задняя дверь — нет"
  - sentences:
      - "какие двери не заперты на первом этаже"
      - "на первом этаже какие замки отперты"
    slots:
      domain: "lock"
      state: "unlocked"
      floor: "Первом этаже"
    response: "Задняя дверь"
  - sentences:
      - "сколько дверей заперто на первом этаже"
      - "сколько дверей на первом этаже заперто"
      - "сколько запертых дверей на первом этаже"
      - "сколько на первом этаже заперто дверей"
      - "на первом этаже сколько замков заперто"
    slots:
      domain: "lock"
      state: "locked"
      floor: "Первом этаже"
    response: "1"

  # ---- floor without preposition ----
  - sentences:
      - "весь свет наверху выключен"
    slots:
      domain: "light"
      state: "off"
      floor: "Наверху"
    response: "Бра — нет"
