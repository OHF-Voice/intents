---
# HassGetState - domain_state_area

language: ru
areas:
  - name: Кухне
  - name: Прихожей
  - name: Спальне

entities:
  # in a different area: must be EXCLUDED from Кухне queries
  - name: "Бра"
    domain: "light"
    state: "on"
    area: "Спальне"
  - name: "Вентилятор С"
    domain: "fan"
    state: "on"
    area: "Спальне"
  - name: "Выключатель С"
    domain: "switch"
    state: "on"
    area: "Спальне"
  - name: "Балконная дверь"
    domain: "lock"
    state: "unlocked"
    area: "Спальне"
  - name: "Лампа А"
    domain: "light"
    state: "on"
    area: "Кухне"
  - name: "Лампа Б"
    domain: "light"
    state: "off"
    area: "Кухне"
  - name: "Вентилятор А"
    domain: "fan"
    state: "on"
    area: "Кухне"
  - name: "Вытяжка"
    domain: "fan"
    state: "off"
    area: "Кухне"
  - name: "Выключатель А"
    domain: "switch"
    state: "on"
    area: "Кухне"
  - name: "Выключатель Б"
    domain: "switch"
    state: "off"
    area: "Кухне"
  - name: "Входная дверь"
    domain: "lock"
    state: "locked"
    area: "Прихожей"
  - name: "Задняя дверь"
    domain: "lock"
    state: "unlocked"
    area: "Прихожей"

tests:
  # ---- lights ----
  - sentences:
      - "есть включенные лампы на кухне"
      - "есть на кухне включенный свет"
      - "на кухне есть включенные светильники"
      - "есть включённая лампа на кухне"
    slots:
      domain: "light"
      state: "on"
      area: "Кухне"
    response: "Да, Лампа А"
  - sentences:
      - "весь свет на кухне выключен"
      - "все лампы выключены на кухне"
      - "на кухне все лампы выключены"
      - "всё освещение на кухне выключено"
    slots:
      domain: "light"
      state: "off"
      area: "Кухне"
    response: "Лампа А — нет"
  - sentences:
      - "какие лампы включены на кухне"
      - "на кухне какой свет включен"
      - "какая лампа включена на кухне"
      - "на кухне какой светильник включён"
    slots:
      domain: "light"
      state: "on"
      area: "Кухне"
    response: "Лампа А"
  - sentences:
      - "сколько ламп включено на кухне"
      - "сколько ламп на кухне включено"
      - "сколько включенных ламп на кухне"
      - "сколько на кухне включено ламп"
      - "на кухне сколько светильников включено"
      - "на кухне сколько включённых ламп"
    slots:
      domain: "light"
      state: "on"
      area: "Кухне"
    response: "1"

  # ---- fans ----
  - sentences:
      - "есть на кухне включенные вентиляторы"
      - "есть включенные вентиляторы на кухне"
      - "на кухне есть включенный вентилятор"
    slots:
      domain: "fan"
      state: "on"
      area: "Кухне"
    response: "Да, Вентилятор А"
  - sentences:
      - "все вентиляторы на кухне выключены"
      - "все вентиляторы выключены на кухне"
      - "на кухне все вентиляторы выключены"
    slots:
      domain: "fan"
      state: "off"
      area: "Кухне"
    response: "Вентилятор А — нет"
  - sentences:
      - "какие вентиляторы включены на кухне"
      - "на кухне какие вентиляторы включены"
    slots:
      domain: "fan"
      state: "on"
      area: "Кухне"
    response: "Вентилятор А"
  - sentences:
      - "сколько вентиляторов включено на кухне"
      - "сколько вентиляторов на кухне включено"
      - "сколько включенных вентиляторов на кухне"
      - "сколько на кухне включено вентиляторов"
      - "на кухне сколько вентиляторов включено"
    slots:
      domain: "fan"
      state: "on"
      area: "Кухне"
    response: "1"

  # ---- switches ----
  - sentences:
      - "есть на кухне включенные выключатели"
      - "есть включенные выключатели на кухне"
      - "на кухне есть включенный выключатель"
    slots:
      domain: "switch"
      state: "on"
      area: "Кухне"
    response: "Да, Выключатель А"
  - sentences:
      - "все выключатели на кухне выключены"
      - "все выключатели выключены на кухне"
      - "на кухне все выключатели выключены"
    slots:
      domain: "switch"
      state: "off"
      area: "Кухне"
    response: "Выключатель А — нет"
  - sentences:
      - "какие выключатели включены на кухне"
      - "на кухне какие выключатели включены"
    slots:
      domain: "switch"
      state: "on"
      area: "Кухне"
    response: "Выключатель А"
  - sentences:
      - "сколько выключателей включено на кухне"
      - "сколько выключателей на кухне включено"
      - "сколько включенных выключателей на кухне"
      - "сколько на кухне включено выключателей"
      - "на кухне сколько выключателей включено"
    slots:
      domain: "switch"
      state: "on"
      area: "Кухне"
    response: "1"

  # ---- locks ----
  - sentences:
      - "есть в прихожей незапертые двери"
      - "есть незапертые двери в прихожей"
      - "есть незапертая дверь в прихожей"
      - "в прихожей есть незапертые замки"
    slots:
      domain: "lock"
      state: "unlocked"
      area: "Прихожей"
    response: "Да, Задняя дверь"
  - sentences:
      - "все двери в прихожей заперты"
      - "все замки заперты в прихожей"
      - "в прихожей все замки заперты"
    slots:
      domain: "lock"
      state: "locked"
      area: "Прихожей"
    response: "Задняя дверь — нет"
  - sentences:
      - "какие двери не заперты в прихожей"
      - "в прихожей какие замки отперты"
      - "какая дверь не заперта в прихожей"
      - "в прихожей какой замок отперт"
    slots:
      domain: "lock"
      state: "unlocked"
      area: "Прихожей"
    response: "Задняя дверь"
  - sentences:
      - "сколько дверей заперто в прихожей"
      - "сколько дверей в прихожей заперто"
      - "сколько запертых дверей в прихожей"
      - "сколько в прихожей заперто дверей"
      - "в прихожей сколько замков заперто"
    slots:
      domain: "lock"
      state: "locked"
      area: "Прихожей"
