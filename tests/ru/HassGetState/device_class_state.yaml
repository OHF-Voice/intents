language: ru
entities:
  - name: "Окно А"
    domain: "cover"
    state: "open"
    attributes:
      device_class: "window"
  - name: "Окно Б"
    domain: "cover"
    state: "open"
    attributes:
      device_class: "window"
  - name: "Окно В"
    domain: "cover"
    state: "closed"
    attributes:
      device_class: "window"
  - name: "Жалюзи Г"
    domain: "cover"
    state: "closed"
    attributes:
      device_class: "blind"
tests:
  - sentences:
      - "есть открытые окна"
      - "есть открытое окно"
    slots:
      device_class: "window"
      state: "open"
    response: "Да, Окно А и Окно Б"
  - sentences:
      - "все окна открыты"
    slots:
      device_class: "window"
      state: "open"
    response: "Окно В — нет"
  - sentences:
      - "какие окна открыты"
    slots:
      device_class: "window"
      state: "open"
    response: "Окно А и Окно Б"
  - sentences:
      - "сколько окон открыто"
      - "сколько открытых окон"
      - "сколько открыто окон"
    slots:
      device_class: "window"
      state: "open"
    response: "2"
  - sentences:
      - "есть опущенные жалюзи"
    slots:
      device_class: "blind"
      state: "closed"
    response: "Да, Жалюзи Г"
  - sentences:
      - "сколько опущенных жалюзи"
    slots:
      device_class: "blind"
      state: "closed"
    response: "1"
