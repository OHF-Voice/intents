---
# HassLightSet - name_temperature

language: ru
entities:
  - name: "Ночная лампа"
    domain: "light"
tests:
  - sentences:
      - "установи цветовую температуру Ночная лампа на 2700 кельвинов"
      - "измени температуру света у Ночная лампа до 2700 к"
      - "поставь Ночная лампа на цветовую температуру 2700 кельвинов"
    slots:
      name: "Ночная лампа"
      temperature: 2700
    response: "Цветовая температура установлена"

  - sentences:
      - "установи цветовую температуру Ночная лампа на тёплый белый"
      - "установи Ночная лампа на теплый белый свет"
      - "поставь теплый свет на Ночная лампа"
    slots:
      name: "Ночная лампа"
      temperature: 2700
    response: "Цветовая температура установлена"

  - sentences:
      - "установи температуру света Ночная лампа на холодный белый"
      - "переключи Ночная лампа на прохладный белый свет"
    slots:
      name: "Ночная лампа"
      temperature: 4000
    response: "Цветовая температура установлена"

  - sentences:
      - "установи цветовую температуру Ночная лампа на свет свечи"
      - "поставь Ночная лампа на свечу"
    slots:
      name: "Ночная лампа"
      temperature: 1900
    response: "Цветовая температура установлена"

  - sentences:
      - "установи цветовую температуру Ночная лампа на дневной свет"
      - "измени Ночная лампа на дневной свет"
    slots:
      name: "Ночная лампа"
      temperature: 6500
    response: "Цветовая температура установлена"
