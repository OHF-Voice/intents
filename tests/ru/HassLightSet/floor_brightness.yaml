---
# HassLightSet - floor_brightness

language: "ru"
floors:
  - name: "Первом"
  - name: "Первого"

tests:
  - sentences:
      - "установи яркость первого этажа до 50%"
      - "увеличь яркость первого этажа до 50%"
      - "уменьши яркость первого этажа до 50%"
    slots:
      brightness: 50
      floor: "Первого"
    response: "Яркость установлена"

  - sentences:
      - "установи яркость на первом этаже до 50%"
      - "установи 50 процентов яркости на первом этаже"
      - "увеличь яркость на первом этаже до 50%"
      - "уменьши яркость на первом этаже до 50%"
    slots:
      brightness: 50
      floor: "Первом"
    response: "Яркость установлена"
