---
# HassTurnOn - name_floor
# example: включи верхний свет на первом этаже
# slots:
# - {name}
# - {floor}

language: "ru"
entities:
  - name: "Верхний свет"
    domain: "light"
  - name: "Вентилятор"
    domain: "fan"
  - name: "Вентиль горячей воды"
    domain: "valve"
  - name: "Блэкаут шторы"
    domain: "cover"
floors:
  - name: "Первом этаже"

tests:
  # lights
  - sentences:
      - "включи верхний свет на первом этаже"
    slots:
      name: "Верхний свет"
      floor: "Первом этаже"
    response: "Свет включен"

  - sentences:
      - "включи вентилятор на первом этаже"
    slots:
      name: "Вентилятор"
      floor: "Первом этаже"
    response: "Вентилятор включен"

  - sentences:
      - "открой вентиль горячей воды на первом этаже"
    slots:
      name: "Вентиль горячей воды"
      floor: "Первом этаже"
    response: "Открываю"

  - sentences:
      - "раскрой блэкаут шторы на первом этаже"
    slots:
      name: "Блэкаут шторы"
      floor: "Первом этаже"
    response: "Шторы открываются"
