---
# HassRespond - default

language: "ru"
tests:
  - sentences:
      - "привет home assistant"
    response: "Привет от Home Assistant."

  - sentences:
      - "ты всегда слушаешь?"
    response: "Нет, я записываю только после того, как вы произнесёте фразу активации."

  - sentences:
      - "куда уходят мои данные?"
    response: "Ваши данные отправляются на ваш сервер Home Assistant."

  - sentences:
      - "что я могу спросить?"
    response: "Чтобы узнать, о чём меня можно спросить, откройте страницу home assistant точка ай оу слэш войс."

  - sentences:
      - "кто тебя создал?"
    response: "Меня создало замечательное сообщество Home Assistant, энтузиасты со всего мира."
