---
# HassSetVolumeRelative - floor_only

language: "ru"
floors:
  - name: "Первом"

tests:
  - sentences:
      - "прибавь громкость на первом этаже"
      - "сделай на первом этаже погромче"
    slots:
      floor: "Первом"
      volume_step: "up"
    response: "Громкость изменена"

  - sentences:
      - "убавь звук на первом этаже"
      - "на первом этаже тише"
    slots:
      floor: "Первом"
      volume_step: "down"
    response: "Громкость изменена"

  - sentences:
      - "увеличь громкость на первом этаже на 20 процентов"
    slots:
      floor: "Первом"
      volume_step: 20
    response: "Громкость изменена"

  - sentences:
      - "уменьши звук на первом этаже на 20%"
    slots:
      floor: "Первом"
      volume_step: -20
    response: "Громкость изменена"
