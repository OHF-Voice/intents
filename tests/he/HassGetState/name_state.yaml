---
# HassGetState - name_state

language: "he"
entities:
  - name: "אור מטבח"
    domain: "light"
    state: "on"
  - name: "דלת מוסך"
    domain: "cover"
    state: "open"
  - name: "אור סלון"
    domain: "light"
    state_with_unit: "כבוי"

tests:
  # on/off (yes branch)
  - sentences:
      - "האם אור מטבח דולק"
    slots:
      name: "אור מטבח"
      state: "on"
    response: "כן"

  # covers (yes branch)
  - sentences:
      - "האם דלת מוסך פתוחה"
    slots:
      name: "דלת מוסך"
      state: "open"
    response: "כן"

  - sentences:
      - "האם אור סלון דולק"
    slots:
      name: "אור סלון"
      state: "on"
    response: "לא, כבוי"
