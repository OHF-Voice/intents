---
# HassClimateGetTemperature - area_only

language: "cs"
areas:
  - name: "kuchyni"
  - name: "pracovně"
  - name: "ložnici"
entities:
  - name: "Termostat kuchyně"
    domain: "climate"
    area: "kuchyni"
    state: "heat"
    attributes:
      current_temperature: 18.5
  # Regression test for #3822: a numeric current_temperature reported as a string
  # must not raise "TypeError: not all arguments converted during string formatting".
  - name: "Termostat pracovna"
    domain: "climate"
    area: "pracovně"
    state: "heat"
    attributes:
      current_temperature: "21.5"
  # Regression test for #3822: a climate entity without current_temperature (its
  # state is an HVAC mode string) must fall back gracefully instead of crashing.
  - name: "Termostat ložnice"
    domain: "climate"
    area: "ložnici"
    state: "off"

tests:
  - sentences:
      - "jaká je teplota v kuchyni"
      - "jaká je v kuchyni teplota"
      - "jaká teplota je v kuchyni"
      - "jak teplo je v kuchyni"
      - "jak chladno je v kuchyni"
      - "kolik je v kuchyni stupňů"
      - "kolik stupňů je v kuchyni"
    slots:
      area: "kuchyni"
    response: "18.5 stupně"
  - sentences:
      - "jaká je teplota v pracovně"
      - "jaká je v pracovně teplota"
      - "jaká teplota je v pracovně"
      - "jak teplo je v pracovně"
      - "jak chladno je v pracovně"
      - "kolik je v pracovně stupňů"
      - "kolik stupňů je v pracovně"
    slots:
      area: "pracovně"
    response: "21.5 stupně"
  - sentences:
      - "jaká je teplota v ložnici"
      - "jaká je v ložnici teplota"
      - "jaká teplota je v ložnici"
      - "jak teplo je v ložnici"
      - "jak chladno je v ložnici"
      - "kolik je v ložnici stupňů"
      - "kolik stupňů je v ložnici"
    slots:
      area: "ložnici"
    response: "Omlouvám se, ale nemohu zjistit aktuální teplotu."
