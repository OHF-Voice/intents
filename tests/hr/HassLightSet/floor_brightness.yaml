---
# HassLightSet - floor_brightness

language: "hr"
floors:
  - name: "Prizemlje"

tests:
  - sentences:
      - "Postavi jačinu svjetla na katu Prizemlje na 50%"
      - "Podesi rasvjetu na katu Prizemlje na 50 posto"
    slots:
      floor: "Prizemlje"
      brightness: 50
    response: "Jačina svjetla je postavljena"

  - sentences:
      - "Postavi jačinu svjetla na katu Prizemlje na maksimum"
    slots:
      floor: "Prizemlje"
      brightness: 100
    response: "Jačina svjetla je postavljena"
