---
# HassGetState - domain_state_floor

language: "hr"
floors:
  - name: "Prizemlje"
areas:
  - name: "Kuhinja"
    floor: "Prizemlje"
  - name: "Hodnik"
    floor: "Prizemlje"
entities:
  - name: "kuhinjsko svjetlo"
    domain: "light"
    state: "on"
    area: "Kuhinja"
  - name: "stropni ventilator"
    domain: "fan"
    state: "on"
    area: "Kuhinja"
  - name: "zidni prekidač"
    domain: "switch"
    state: "on"
    area: "Kuhinja"
  - name: "ulazna vrata"
    domain: "lock"
    state: "locked"
    area: "Hodnik"

tests:
  # lights
  - sentences:
      - "je li koje svjetlo uključeno na katu Prizemlje"
    slots:
      domain: "light"
      state: "on"
      floor: "Prizemlje"
    response: "Da, kuhinjsko svjetlo"
  - sentences:
      - "jesu li sva svjetla isključena na katu Prizemlje"
    slots:
      domain: "light"
      state: "off"
      floor: "Prizemlje"
    response: "Ne, nije kuhinjsko svjetlo"
  - sentences:
      - "koja svjetla su uključena na katu Prizemlje"
    slots:
      domain: "light"
      state: "on"
      floor: "Prizemlje"
    response: "kuhinjsko svjetlo"
  - sentences:
      - "koliko je svjetala uključeno na katu Prizemlje"
    slots:
      domain: "light"
      state: "on"
      floor: "Prizemlje"
    response: "1"

  # fans
  - sentences:
      - "je li koji ventilator uključen na katu Prizemlje"
    slots:
      domain: "fan"
      state: "on"
      floor: "Prizemlje"
    response: "Da, stropni ventilator"
  - sentences:
      - "jesu li svi ventilatori isključeni na katu Prizemlje"
    slots:
      domain: "fan"
      state: "off"
      floor: "Prizemlje"
    response: "Ne, nije stropni ventilator"
  - sentences:
      - "koji ventilatori su uključeni na katu Prizemlje"
    slots:
      domain: "fan"
      state: "on"
      floor: "Prizemlje"
    response: "stropni ventilator"
  - sentences:
      - "koliko je ventilatora uključeno na katu Prizemlje"
    slots:
      domain: "fan"
      state: "on"
      floor: "Prizemlje"
    response: "1"

  # switches
  - sentences:
      - "je li koji prekidač uključen na katu Prizemlje"
    slots:
      domain: "switch"
      state: "on"
      floor: "Prizemlje"
    response: "Da, zidni prekidač"
  - sentences:
      - "jesu li svi prekidači isključeni na katu Prizemlje"
    slots:
      domain: "switch"
      state: "off"
      floor: "Prizemlje"
    response: "Ne, nije zidni prekidač"
  - sentences:
      - "koji prekidači su uključeni na katu Prizemlje"
    slots:
      domain: "switch"
      state: "on"
      floor: "Prizemlje"
    response: "zidni prekidač"
  - sentences:
      - "koliko je prekidača uključeno na katu Prizemlje"
    slots:
      domain: "switch"
      state: "on"
      floor: "Prizemlje"
    response: "1"

  # locks
  - sentences:
      - "je li koja vrata zaključana na katu Prizemlje"
    slots:
      domain: "lock"
      state: "locked"
      floor: "Prizemlje"
    response: "Da, ulazna vrata"
  - sentences:
      - "jesu li sva vrata otključana na katu Prizemlje"
    slots:
      domain: "lock"
      state: "unlocked"
      floor: "Prizemlje"
    response: "Ne, nije ulazna vrata"
  - sentences:
      - "koja vrata su zaključana na katu Prizemlje"
    slots:
      domain: "lock"
      state: "locked"
      floor: "Prizemlje"
    response: "ulazna vrata"
  - sentences:
      - "koliko je vrata zaključano na katu Prizemlje"
    slots:
      domain: "lock"
      state: "locked"
      floor: "Prizemlje"
    response: "1"
