---
# HassGetState - name_where

language: "hr"
entities:
  - name: "Ana"
    domain: "person"
    state: "home"
  - name: "Ivan"
    domain: "person"
    state: "Ured"

tests:
  - sentences:
      - "gdje je Ana"
      - "gdje se nalazi Ana"
      - "gdje mogu pronaći Ana"
    slots:
      name: "Ana"
    response: "Ana je kod kuće"

  - sentences:
      - "gdje je Ivan"
    slots:
      name: "Ivan"
    response: "Ivan je u zoni Ured"
