---
# HassClimateSetFanMode - area_fan_mode

language: "hr"
areas:
  - name: "Ured"

tests:
  - sentences:
      - "postavi način rada ventilatora u prostoriji Ured na niski"
    slots:
      area: "Ured"
      fan_mode: "low"
    response: "Način rada ventilatora je postavljen"

  - sentences:
      - "namjestite prostorija Ured način rada ventilatora na visoki"
    slots:
      area: "Ured"
      fan_mode: "high"
    response: "Način rada ventilatora je postavljen"
