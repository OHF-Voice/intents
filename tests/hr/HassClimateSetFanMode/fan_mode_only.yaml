---
# HassClimateSetFanMode - fan_mode_only

language: "hr"
tests:
  - sentences:
      - "postavi način rada ventilatora na auto"
      - "namjestite način rada ventilatora na automatski"
    slots:
      fan_mode: "auto"
    response: "Način rada ventilatora je postavljen"

  - sentences:
      - "podesi način rada ventilatora ovdje na nisko"
    slots:
      fan_mode: "low"
    response: "Način rada ventilatora je postavljen"

  - sentences:
      - "postavi način rada ventilatora na raspršeno"
    slots:
      fan_mode: "diffuse"
    response: "Način rada ventilatora je postavljen"
