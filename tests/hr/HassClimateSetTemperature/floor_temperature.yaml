---
# HassClimateSetTemperature - floor_temperature

language: "hr"
floors:
  - name: "Prizemlje"

tests:
  - sentences:
      - "postavi temperaturu na katu Prizemlje na 21 stupanj"
      - "namjestite kat Prizemlje na 21°"
    slots:
      floor: "Prizemlje"
      temperature: 21
    response: "Temperatura je postavljena"
