# HassTurnOff - floor_domain
language: ml

floors:
  - name: "ഒന്നാം"
  - name: "രണ്ടാം"

tests:
  - sentences:
      - "ഒന്നാം നില ഇരുട്ടാകുക"
      - "ഒന്നാം നിലയിലെ വിളക്കുകൾ അണക്കുക"
    slots:
      floor: "ഒന്നാം"
      domain: light
    response: "ഒന്നാം നിലയിലെ വിളക്കുകൾ അണച്ചു"

  - sentences:
      - "രണ്ടാം നിലയിലെ വിളക്കുകൾ അണക്കുക"
    slots:
      floor: "രണ്ടാം"
      domain: light
    response: "രണ്ടാം നിലയിലെ വിളക്കുകൾ അണച്ചു"
