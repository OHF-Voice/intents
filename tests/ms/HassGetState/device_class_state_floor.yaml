      - "berapa tingkap yang terbuka di tingkat atas"
      - "berapa banyak tingkap terbuka di tingkat atas"
      - "berapa banyak tingkap di tingkat atas yang terbuka"
    slots:
      domain: "cover"
      device_class: "window"
      state: "open"
      floor: "Tingkat Atas"
    response: "1"
  - sentences:
      - "ada langsir yang tertutup di tingkat atas"
      - "adakah mana-mana langsir tertutup di tingkat atas"
      - "ada langsir di tingkat atas yang tertutup"
