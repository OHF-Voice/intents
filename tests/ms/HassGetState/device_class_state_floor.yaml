  - sentences:
      - "langsir mana yang tertutup di tingkat atas"
      - "manakah langsir yang tertutup di tingkat atas"
      - "langsir di tingkat atas mana yang tertutup"
    slots:
      domain: "cover"
      device_class: "curtain"
      state: "closed"
      floor: "Tingkat Atas"
    response: "Langsir Bilik"
  - sentences:
      - "berapa langsir yang tertutup di tingkat atas"
      - "berapa banyak langsir tertutup di tingkat atas"
      - "berapa banyak langsir di tingkat atas yang tertutup"
    slots:
