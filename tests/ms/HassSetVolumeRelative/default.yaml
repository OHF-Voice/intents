language: "ms"
tests:
  - sentences:
      - "naikkan volume"
      - "kelantangan naik"
    slots:
      volume_step: "up"
    response: "Kelantangan ditetapkan"
  - sentences:
      - "perlahankan bunyi"
    slots:
      volume_step: "down"
    response: "Kelantangan ditetapkan"
  - sentences:
      - "kuatkan volume sebanyak 20%"
    slots:
      volume_step: 20
    response: "Kelantangan ditetapkan"
  - sentences:
      - "turunkan kelantangan 20 peratus"
    slots:
      volume_step: -20
    response: "Kelantangan ditetapkan"
