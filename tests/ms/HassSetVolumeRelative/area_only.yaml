language: "ms"
areas:
  - name: "Dapur"
tests:
  - sentences:
      - "naikkan volume di dapur"
      - "kelantangan di dapur naik"
    slots:
      area: "Dapur"
      volume_step: "up"
    response: "Kelantangan ditetapkan"
  - sentences:
      - "perlahankan bunyi di dapur"
    slots:
      area: "Dapur"
      volume_step: "down"
    response: "Kelantangan ditetapkan"
  - sentences:
      - "kuatkan volume di dapur sebanyak 20%"
    slots:
      area: "Dapur"
      volume_step: 20
    response: "Kelantangan ditetapkan"
  - sentences:
      - "turunkan kelantangan di dapur 20 peratus"
    slots:
      area: "Dapur"
      volume_step: -20
    response: "Kelantangan ditetapkan"
