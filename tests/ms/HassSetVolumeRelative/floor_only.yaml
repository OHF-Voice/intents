language: "ms"
floors:
  - name: "Tingkat Atas"
tests:
  - sentences:
      - "naikkan volume di tingkat atas"
      - "kelantangan di tingkat atas naik"
    slots:
      floor: "Tingkat Atas"
      volume_step: "up"
    response: "Kelantangan ditetapkan"
  - sentences:
      - "perlahankan bunyi di tingkat atas"
    slots:
      floor: "Tingkat Atas"
      volume_step: "down"
    response: "Kelantangan ditetapkan"
  - sentences:
      - "kuatkan volume di tingkat atas sebanyak 20%"
    slots:
      floor: "Tingkat Atas"
      volume_step: 20
    response: "Kelantangan ditetapkan"
  - sentences:
      - "turunkan kelantangan di tingkat atas 20 peratus"
    slots:
      floor: "Tingkat Atas"
      volume_step: -20
    response: "Kelantangan ditetapkan"
