---
# HassGetWeather - default

language: "af"
entities:
  - name: "Huis"
    domain: "weather"
    state: "rainy"
    attributes:
      temperature: 18
      temperature_unit: "°C"

tests:
  - sentences:
      - "hoe is die weer"
      - "wat is die weer"
      - "hoe is die weer vandag"
    response: "18 °C en reenerig"
