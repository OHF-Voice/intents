---
# HassMediaPlayerMute - default

language: it
tests:
  - sentences:
      - "silenzia"
      - "muta"
      - "metti in muto"
      - "disattiva l'audio"
      - "silenzia la musica"
      - "muta il media player qui"
      # Speech-to-Phrase phrasings: a media noun is required there, so these
      # must keep working here too.
      - "muta il film"
      - "silenzia il programma"
      - "muta il media player"
      - "silenzia la canzone"
    response: "Audio disattivato"
