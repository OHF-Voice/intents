---
# HassFanSetSpeed - default

language: it
entities:
  - name: Ventilatore Soffitto
    domain: fan

tests:
  - sentences:
      - imposta il ventilatore al 50%
      - imposta la velocità del ventilatore al 50%
      - cambia il ventilatore a 50
      - abbassa il ventilatore a 50 percento
      - aumenta il ventilatore a 50 percento
      - imposta il ventilatore al 50 per cento
    slots:
      percentage: 50
    response: Velocità impostata
