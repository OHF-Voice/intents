---
# HassFanSetSpeed - name_only

language: it
entities:
  - name: Ventilatore Soffitto
    domain: fan

tests:
  - sentences:
      - imposta il ventilatore soffitto al 50%
      - imposta la velocità del ventilatore soffitto al 50%
      - cambia ventilatore soffitto a 50
      - imposta il ventilatore soffitto al 50 per cento
    slots:
      name: Ventilatore Soffitto
      percentage: 50
    response: Velocità impostata
