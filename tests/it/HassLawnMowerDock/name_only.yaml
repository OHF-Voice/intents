---
# HassLawnMowerDock - name_only
# example: riporta Giardiniere alla base

language: it
entities:
  - name: Giardiniere
    domain: lawn_mower

tests:
  - sentences:
      - "ferma Giardiniere"
      - "arresta Giardiniere"
      - "spegni Giardiniere"
      - "riporta Giardiniere alla base"
      - "riporta Giardiniere alla casa"
      - "porta indietro Giardiniere"
      - "porta il Giardiniere a base"
      - "rimanda indietro Giardiniere"
      - "manda Giardiniere alla base"
      - "Giardiniere torna alla base"
      - "Giardiniere va alla base"
    slots:
      name: Giardiniere
    response: "Tornando alla base"
