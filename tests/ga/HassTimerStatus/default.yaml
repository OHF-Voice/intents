---
# HassTimerStatus - default

language: "ga"
timers:
  - is_active: true
    total_seconds_left: 300
    rounded_hours_left: 0
    rounded_minutes_left: 5
    rounded_seconds_left: 0
    start_minutes: 5
tests:
  - sentences:
      - "cé mhéad ama atá fágtha"
      - "cé mhéad ama atá fágtha ar an t-amadóir"
      - "cén t-am atá fágtha"
    response: "5 nóiméad fágtha."
