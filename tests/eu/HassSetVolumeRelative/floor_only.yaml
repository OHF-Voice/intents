language: "eu"
floors:
  - name: Lehen solairua
tests:
  - sentences:
      - "igo bolumena lehen solairuan"
      - "bolumena lehen solairuan igo"
    slots:
      floor: Lehen solairua
      volume_step: up
    response: "Bolumena ezarrita"
  - sentences:
      - "jaitsi bolumena lehen solairuan"
      - "bolumena lehen solairuan jaitsi"
    slots:
      floor: Lehen solairua
      volume_step: down
    response: "Bolumena ezarrita"
  - sentences:
      - "igo bolumena lehen solairuan %20"
    slots:
      floor: Lehen solairua
      volume_step: 20
    response: "Bolumena ezarrita"
  - sentences:
      - "jaitsi bolumena lehen solairuan ehuneko 30"
    slots:
      floor: Lehen solairua
      volume_step: -30
    response: "Bolumena ezarrita"
