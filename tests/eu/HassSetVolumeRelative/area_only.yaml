language: "eu"
areas:
  - name: Egongela
  - name: Sukaldea
tests:
  - sentences:
      - "igo egongelako bolumena"
      - "bolumena egongelan igo"
    slots:
      area: Egongela
      volume_step: up
    response: "Bolumena ezarrita"
  - sentences:
      - "bolumena egongelan jaitsi"
      - "jaitsi egongelako bolumena"
    slots:
      area: Egongela
      volume_step: down
    response: "Bolumena ezarrita"
  - sentences:
      - "igo egongelako bolumena %20"
    slots:
      area: Egongela
      volume_step: 20
    response: "Bolumena ezarrita"
  - sentences:
      - "jaitsi bolumena egongelan ehuneko 30"
    slots:
      area: Egongela
      volume_step: -30
    response: "Bolumena ezarrita"
