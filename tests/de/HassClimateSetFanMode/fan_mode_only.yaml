---
# HassClimateSetFanMode - fan_mode_only

language: "de"
tests:
  - sentences:
      - "stelle den Lüftermodus auf automatisch"
      - "den Lüftermodus auf automatisch setzen"
    slots:
      fan_mode: "auto"
    response: "Lüftermodus auf automatisch eingestellt"

  - sentences:
      - "stelle den Lüftermodus auf gering"
      - "den Lüftermodus auf gering stellen"
      - "den Lüftermodus auf gering setzen"
    slots:
      fan_mode: "low"
    response: "Lüftermodus auf gering eingestellt"

  - sentences:
      - "stelle den Lüftermodus auf fokussiert"
      - "den Lüftermodus auf fokussiert setzen"
    slots:
      fan_mode: "focus"
    response: "Lüftermodus auf fokussiert eingestellt"
