---
# HassGetWeather - default

language: "nl"
entities:
  - name: "Thuis"
    domain: "weather"
    state: "sunny"
    attributes:
      temperature: 20
      temperature_unit: "°C"

tests:
  - sentences:
      - "wat voor weer is het"
      - "wat is het weer buiten"
      - "hoe is het weer"
      - "hoe is het weer vandaag"
      - "wat is het weerbericht"
    response: "20 graden en zonnig"
  - sentences:
      - "hoe warm is het buiten"
      - "hoeveel graden is het nu buiten"
    response: "20 graden"
