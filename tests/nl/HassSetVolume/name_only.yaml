# HassSetVolume - name_only

language: "nl"
entities:
  - name: "TV"
    domain: "media_player"

tests:
  - sentences:
      - "zet TV volume naar 90 procent"
      - "zet op de TV het volume op 90 procent"
      - "zet de TV op 90 procent"
      - "verlaag op de TV het volume naar 90 procent"
      - "zet het volume op 90 procent op de TV"
      - "verander op de TV het volume naar 90 procent"
      - "verander het volume naar 90 procent op de TV"
      - "zet TV volume omhoog naar 90"
      - "verhoog het volume naar 90 op de TV"
      - "TV volume 90 procent"
      - "90% volume op de TV"
    slots:
      name: "TV"
      volume_level: 90
    response: "Volume aangepast"
