---
# HassSetPosition - floor_device_class

language: "nl"
floors:
  - name: "Eerste Verdieping"
  - name: "Beneden"

tests:
  # curtains
  - sentences:
      - "zet de gordijnen op de eerste verdieping naar 50%"
      - "zet de gordijnen naar 50% op de eerste verdieping"
      - "zet de gordijnen positie op de eerste verdieping naar 50%"
      - "zet de positie van de gordijnen op de eerste verdieping naar 50%"
      - "open de gordijnen op de eerste verdieping naar 50 procent"
      - "zet op de eerste verdieping de gordijnen naar 50%"
      - "de gordijnen op de eerste verdieping naar 50 zetten"
      - "de positie van de gordijnen op de eerste verdieping naar 50 zetten"
      - "op de eerste verdieping de gordijnen naar 50% zetten"
    slots:
      domain: "cover"
      device_class: "curtain"
      floor: "Eerste Verdieping"
      position: 50
    response: "Positie aangepast"

  # shutters
  - sentences:
      - "zet de rolluiken beneden naar 20%"
      - "sluit de rolluiken beneden naar 20%"
      - "zet beneden de rolluiken op 20 procent"
      - "de rolluiken beneden naar 20% zetten"
    slots:
      domain: "cover"
      device_class: "shutter"
      floor: "Beneden"
      position: 20
    response: "Positie aangepast"
