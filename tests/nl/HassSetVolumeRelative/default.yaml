---
# HassSetVolumeRelative - default

language: "nl"
tests:
  - sentences:
      - "volume omhoog"
      - "harder"
      - "wat harder"
      - "zet de muziek harder"
      - "zet de muziek een beetje harder"
      - "draai het geluid omhoog"
      - "de muziek harder zetten"
      - "het volume hoger zetten"
      - "verhoog het volume"
      - "het volume verhogen"
    slots:
      volume_step: "up"
    response: "Volume aangepast"

  - sentences:
      - "zet het volume omhoog met 20%"
      - "zet het volume 20 procent hoger"
      - "verhoog het volume met 20 procent"
      - "het volume met 20% hoger draaien"
    slots:
      volume_step: 20
    response: "Volume aangepast"

  - sentences:
      - "volume omlaag"
      - "zachter"
      - "zet de muziek zachter"
      - "het volume lager draaien"
      - "verlaag het volume"
    slots:
      volume_step: "down"
    response: "Volume aangepast"

  - sentences:
      - "zet het volume omlaag met 20%"
      - "zet de muziek 20 procent zachter"
      - "verlaag het volume met 20 procent"
      - "het volume met 20% lager draaien"
    slots:
      volume_step: -20
    response: "Volume aangepast"
