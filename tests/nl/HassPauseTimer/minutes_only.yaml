---
# HassPauseTimer - minutes_only

language: nl
tests:
  - sentences:
      - "pauzeer 5 minuten timer"
      - "pauzeer kookwekker van 5 minuten"
      - "5 minuten timer pauzeren"
      - "zet 5 minuten eierwekker even op pauze"
      - "zet eierwekker van 5 minuten op pauze"
      - "de timer van 5 minuutjes op pauze zetten"
    slots:
      start_minutes: 5
    response: "Timer gepauzeerd"
  - sentences:
      - "pauzeer de timer van een half uur"
      - "zet mijn kookwekker van een half uurtje even op pauze"
      - "de timer van een 1/2 uur pauzeren"
    slots:
      start_minutes: 30
    response: "Timer gepauzeerd"
  - sentences:
      - "pauzeer even m'n timer van anderhalf uur"
      - "zet de eierwekker van anderhalf uurtje op pauze"
      - "de timer van anderhalf uur op pauze zetten"
    slots:
      start_minutes: 90
    response: "Timer gepauzeerd"
  - sentences:
      - "pauzeer de timer van een kwartier"
      - "zet de timer van een kwartiertje op pauze"
      - "mijn kookwekker van een kwartier even pauzeren"
    slots:
      start_minutes: 15
    response: "Timer gepauzeerd"
  - sentences:
      - "pauzeer de timer van drie kwartier"
      - "zet de timer van driekwartier op pauze"
      - "de timer van drie kwartier pauzeren"
    slots:
      start_minutes: 45
    response: "Timer gepauzeerd"
