---
# HassPauseTimer - minutes_only

language: nl
tests:
  - sentences:
      - "pauzeer 5 minuten timer"
      - "pauzeer kookwekker van 5 minuten"
      - "5 minuten timer pauzeren"
      - "zet 5 minuten eierwekker even op pauze"
      - "zet eierwekker van 5 minuten op pauze"
      - "de timer van 5 minuutjes op pauze zetten"
    slots:
      start_minutes: 5
    response: "Timer gepauzeerd"
