      - "pauzeer 1 uur timer"
      - "pauzeer kookwekker van 1 uur"
      - "1 uur timer pauzeren"
      - "zet de 1 uur eierwekker op pauze"
      - "zet kookwekker van 1 uurtje even op pauze"
      - "mijn timer van 1 uurtje op pauze zetten"
    slots:
      start_hours: 1
    response: "Timer gepauzeerd"
