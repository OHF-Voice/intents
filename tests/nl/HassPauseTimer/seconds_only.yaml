---
# HassPauseTimer - seconds_only

language: nl
tests:
  - sentences:
      - "pauzeer 30 seconden timer"
      - "pauzeer kookwekker van 30 seconden"
      - "30 seconden timer pauzeren"
      - "zet mijn 30 seconden timer even op pauze"
      - "zet m'n kookwekker van 30 secondes op pauze"
      - "mijn eierwekker van 30 secondes even op pauze zetten"
    slots:
      start_seconds: 30
    response: "Timer gepauzeerd"
  - sentences:
      - "pauzeer de timer van een halve minuut"
      - "zet de eierwekker van een half minuutje op pauze"
      - "de timer van een halve minuut pauzeren"
    slots:
      start_seconds: 30
    response: "Timer gepauzeerd"
  - sentences:
      - "pauzeer de timer van anderhalve minuut"
      - "zet mijn timer van anderhalf minuutje even op pauze"
      - "de kookwekker van anderhalve minuut op pauze zetten"
    slots:
      start_seconds: 90
    response: "Timer gepauzeerd"
