---
# HassClimateSetTemperature - floor_temperature

language: "nl"
floors:
  - name: "Eerste Verdieping"
  - name: "Beneden"

tests:
  - sentences:
      - "zet de verwarming op de eerste verdieping op 19 graden"
      - "verander de temperatuur op de eerste verdieping naar 19 graden"
      - "zet de temperatuur op 19 graden op de eerste verdieping"
      - "verhoog de verwarming naar 19 graden op de eerste verdieping"
      - "zet de eerste verdieping temperatuur op 19"
      - "verlaag de eerste verdieping verwarming naar 19 graden"
      - "zet eerste verdieping op 19 graden"
      - "draai de eerste verdieping naar 19 graden"
      - "eerste verdieping temperatuur op 19 graden"
      - "temperatuur op de eerste verdieping 19 graden"
      - "eerste verdieping 19 graden"
      - "de eerste verdieping temperatuur op 19 graden zetten"
      - "de eerste verdieping verwarming naar 19 graden verhogen"
      - "de temperatuur op de eerste verdieping op 19 graden instellen"
      - "de temperatuur op de eerste verdieping naar 19 graden zetten"
      - "de eerste verdieping op 19 graden zetten"
      - "de eerste verdieping naar 19 graden verlagen"
    slots:
      floor: "Eerste Verdieping"
      temperature: 19
    response: "Temperatuur ingesteld op 19 graden"

  # floor used as an adverb
  - sentences:
      - "zet de verwarming beneden op 19 graden"
      - "verander de temperatuur beneden naar 19 graden"
      - "zet de temperatuur op 19 graden beneden"
      - "verhoog de verwarming naar 19 graden beneden"
      - "temperatuur beneden op 19 graden"
      - "de verwarming beneden op 19 graden zetten"
      - "de temperatuur beneden naar 19 graden verlagen"
    slots:
      floor: "Beneden"
      temperature: 19
    response: "Temperatuur ingesteld op 19 graden"
