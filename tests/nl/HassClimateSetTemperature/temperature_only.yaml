---
# HassClimateSetTemperature - temperature_only

language: "nl"
tests:
  - sentences:
      - "Zet de temperatuur op 19 graden"
      - "Verander de temperatuur naar 19"
      - "Temperatuur op 19"
      - "verwarming 19 graden"
      - "Temperatuur op 19 zetten"
      - "de verwarming op 19 graden doen"
      - "de temperatuur naar 19 graden draaien"
      - "mag de verwarming op 19"
      - "verlaag de temperatuur naar 19 graden"
      - "zet de temperatuur hier op 19 graden"
      - "stel de thermostaat in op 19 graden"
      - "zet de airco op 19 graden"
      - "zet hier de verwarming op 19 graden"
      - "verhoog hier de temperatuur naar 19 graden"
      - "stel hier de airconditioning in op 19 graden"
      - "maak het hier 19 graden"
    slots:
      temperature: 19
    response: "Temperatuur ingesteld op 19 graden"

  - sentences:
      - "Zet de temperatuur op 19.5 graden"
    slots:
      temperature: 19.5
    response: "Temperatuur ingesteld op 19.5 graden"
