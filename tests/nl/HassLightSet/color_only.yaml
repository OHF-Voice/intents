---
# HassLightSet - color_only

language: "nl"
tests:
  - sentences:
      - "Maak de lampen blauw"
      - "Zet de kleur van alle lampen op blauw"
      - "Maak alle lampen blauw hier"
      - "Maak de verlichting blauw in deze kamer"
    slots:
      color: "blue"
    response: "Kleur aangepast"

  - sentences:
      - "verander de kleur van alle lampen naar geel"
      - "verander de lampen naar geel in deze kamer"
    slots:
      color: "yellow"
    response: "Kleur aangepast"

  - sentences:
      - "zet de lampen op groen hier"
    slots:
      color: "green"
    response: "Kleur aangepast"

  - sentences:
      - "de lampen rood"
    slots:
      color: "red"
    response: "Kleur aangepast"

  - sentences:
      - "laat de lampen blauw branden"
    slots:
      color: "blue"
    response: "Kleur aangepast"

  - sentences:
      - "laat alle lampen groen schijnen in deze kamer"
      - "de lampen in groen veranderen"
    slots:
      color: "green"
    response: "Kleur aangepast"

  - sentences:
      - "de kleur van de verlichting roze maken"
    slots:
      color: "pink"
    response: "Kleur aangepast"

  - sentences:
      - "de lampen op de kleur rood zetten"
    slots:
      color: "red"
    response: "Kleur aangepast"
