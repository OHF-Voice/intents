---
# HassLightSet - brightness_only

language: "nl"
tests:
  - sentences:
      - "Zet de helderheid hier naar 40%"
      - "Dim de helderheid naar 40% in deze kamer"
      - "Zet de verlichting op 40%"
      - "Dim de kamer naar 40%"
      - "Dim naar 40% hier"
      - "de kamer naar 40% dimmen"
    slots:
      brightness: 40
    response: "Helderheid aangepast"

  - sentences:
      - "Zet de helderheid hier naar maximaal"
      - "Zet de helderheid naar het hoogste"
      - "Zet de lamp hier op het hoogste"
      - "Zet de lamp op maximaal"
    slots:
      brightness: 100
    response: "Helderheid aangepast"

  - sentences:
      - "zet de helderheid op max"
      - "zet de helderheid op maximaal in deze kamer"
    slots:
      brightness: 100
    response: "Helderheid aangepast"

  - sentences:
      - "dim de helderheid van de lampen naar 80%"
      - "verhoog de lampen naar 80% in deze kamer"
    slots:
      brightness: 80
    response: "Helderheid aangepast"

  - sentences:
      - "zet de helderheid naar 60% hier"
      - "het licht naar 60 procent helderheid dimmen"
    slots:
      brightness: 60
    response: "Helderheid aangepast"

  - sentences:
      - "zet de lampen naar het laagste"
      - "dim de lampen hier naar het minimum"
    slots:
      brightness: 1
    response: "Helderheid aangepast"

  - sentences:
      - "zet de lampen op halve helderheid in deze kamer"
      - "dim de verlichting naar de helft hier"
    slots:
      brightness: 50
    response: "Helderheid aangepast"
