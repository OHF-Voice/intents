      - "annuleer 5 minuten timer"
      - "stop timer van 5 minuten"
      - "5 minuten timer stoppen"
      - "zet 5 minuten eierwekker stop"
      - "zet de eierwekker voor 5 minuutjes stop"
      - "verwijder 5 minuten timer"
      - "beëindig kookwekker voor 5 minuten"
      - "de timer van 5 minuten annuleren"
    slots:
      start_minutes: 5
    response: "Timer geannuleerd"
