---
# HassTimerStatus - hours_only

language: nl
timers:
  - is_active: true
    start_hours: 1
    total_seconds_left: 100
    rounded_hours_left: 0
    rounded_minutes_left: 1
    rounded_seconds_left: 40
tests:
  - sentences:
      - "1 uur timer status"
      - "status van 1 uur timer"
      - "tijd over op de 1 uur timer"
      - "hoe lang is de 1 uur timer nog"
      - "hoeveel tijd is er over van de 1 uur kookwekker"
      - "wat is de status van m'n eierwekker van 1 uurtje"
      - "hoeveel tijd is er nog over van m'n kookwekker van 1 uurtje"
      - "tijd over van mijn kookwekker van 1 uur"
      - "hoe lang duurt mijn eierwekker van 1 uur nog"
      - "hoeveel tijd heeft m'n 1 uur kookwekker nog"
      - "hoeveel tijd staat er nog op mijn 1 uurtje timer"
      - "wanneer gaat m'n 1 uur eierwekker af"
      - "wanneer is mijn 1 uur timer klaar"
      - "hoeveel tijd heeft de kookwekker van 1 uurtje nog"
      - "hoe veel tijd staat er nog op de timer van 1 uur"
      - "wanneer gaat de kookwekker van 1 uur af"
      - "wanneer is m'n kookwekker van 1 uur afgelopen"
    slots:
      start_hours: 1
    response: "1 minuut en 40 seconden resterend."
