---
# HassTimerStatus - minutes_only

language: nl
timers:
  - is_active: true
    start_minutes: 5
    total_seconds_left: 600
    rounded_hours_left: 0
    rounded_minutes_left: 10
    rounded_seconds_left: 0
tests:
  - sentences:
      - "5 minuten timer status"
      - "status van 5 minuten timer"
      - "tijd over op de 5 minuten timer"
      - "hoe lang is de 5 minuten timer nog"
      - "hoeveel tijd is er over op m'n 5 minuten timer"
      - "status van de eierwekker van 5 minuutjes"
      - "hoe veel tijd is er nog over op m'n timer van 5 minuten"
      - "tijd over van kookwekker van 5 minuten"
      - "hoe lang loopt de timer van 5 minuten nog"
      - "hoeveel tijd heeft mijn 5 minuutjes eierwekker nog"
      - "hoeveel tijd staat er nog op m'n 5 minuten kookwekker"
      - "wanneer gaat m'n 5 minuten kookwekker af"
      - "wanneer is mijn 5 minuten eierwekker afgelopen"
      - "hoeveel tijd heeft de timer van 5 minuten nog"
      - "hoe veel tijd staat er nog op mijn eierwekker van 5 minuten"
      - "wanneer gaat m'n timer van 5 minuten af"
      - "wanneer is de timer van 5 minuten klaar"
    slots:
      start_minutes: 5
    response: "10 minuten resterend."
