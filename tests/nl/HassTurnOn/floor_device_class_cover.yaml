---
# HassTurnOn - floor_device_class_cover
# slots:
# - {floor}
# - {domain}
# - {device_class}

language: "nl"
floors:
  - name: "Eerste Verdieping"
  - name: "Beneden"

tests:
  - sentences:
      - "Open het gordijn op de eerste verdieping"
      - "het gordijn op de eerste verdieping openen"
      - "doe op de eerste verdieping het gordijn omhoog"
      - "doe het gordijn op de eerste verdieping omhoog"
      - "open de gordijnen op de eerste verdieping"
      - "maak de gordijnen naar boven op de eerste verdieping"
      - "de gordijnen op de eerste verdieping open"
      - "de gordijnen op de eerste verdieping ophalen"
      - "open op de eerste verdieping de gordijnen"
      - "maak op de eerste verdieping de gordijnen omhoog"
      - "op de eerste verdieping de gordijnen naar boven"
      - "op de eerste verdieping de gordijnen optrekken"
    slots:
      floor: "Eerste Verdieping"
      device_class: "curtain"
      domain: "cover"
    response: "Geopend"

  - sentences:
      - "Open de rolluiken op de eerste verdieping"
    slots:
      floor: "Eerste Verdieping"
      device_class: "shutter"
      domain: "cover"
    response: "Geopend"

  - sentences:
      - "open de gordijnen beneden"
      - "maak de gordijnen beneden open"
      - "de gordijnen beneden omhoog"
      - "de gordijnen beneden omhoog doen"
      - "open beneden de gordijnen"
      - "maak beneden de gordijnen naar boven"
      - "beneden de gordijnen open"
      - "beneden de gordijnen open doen"
    slots:
      floor: "Beneden"
      device_class: "curtain"
      domain: "cover"
    response: "Geopend"
