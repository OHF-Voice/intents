---
# HassTurnOn - area_device_class_cover
# slots:
# - {area}
# - {domain}
# - {device_class}

language: "nl"
areas:
  - name: "Woonkamer"

tests:
  - sentences:
      - "Open het gordijn in de woonkamer"
      - "Open in de woonkamer het gordijn"
      - "het gordijn in de woonkamer openen"
      - "doe het gordijn in de woonkamer open"
      - "doe in de woonkamer het gordijn omhoog"
      - "open de gordijnen in de woonkamer"
      - "maak de gordijnen in de woonkamer naar boven"
      - "de gordijnen in de woonkamer open"
      - "de gordijnen in de woonkamer ophalen"
      - "open in de woonkamer de gordijnen"
      - "maak in de woonkamer de gordijnen open"
      - "in de woonkamer de gordijnen omhoog"
      - "in de woonkamer de gordijnen omhoog doen"
      - "open de woonkamer gordijnen"
      - "maak de woonkamer gordijnen omhoog"
      - "de woonkamer gordijnen naar boven"
      - "de woonkamer gordijnen optrekken"
    slots:
      area: "Woonkamer"
      device_class: "curtain"
      domain: "cover"
    response: "Geopend"

  - sentences:
      - "Open de rolluiken in de woonkamer"
      - "doe de rolluiken in de woonkamer omhoog"
    slots:
      area: "Woonkamer"
      device_class: "shutter"
      domain: "cover"
    response: "Geopend"
