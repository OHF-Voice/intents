---
# HassTurnOn - device_class_cover
# slots:
# - {domain}
# - {device_class}
# context_area: true

language: "nl"

tests:
  - sentences:
      - "Open het gordijn"
      - "Open het gordijn hier"
      - "gordijnen openen"
      - "doe de gordijnen open"
      - "doe de gordijnen omhoog"
      - "open de gordijnen"
      - "maak de gordijnen naar boven"
      - "de gordijnen open"
      - "de gordijnen ophalen"
    slots:
      device_class: "curtain"
      domain: "cover"
    response: "Geopend"

  - sentences:
      - "Open de garagedeur"
      - "de garagedeur openen"
    slots:
      device_class: "garage"
      domain: "cover"
    response: "Geopend"
