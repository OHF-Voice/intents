---
# HassClimateGetTemperature - default

language: "nl"
areas:
  - name: "Woonkamer"
    context_area: true

entities:
  - name: "Woonkamerthermostaat"
    domain: "climate"
    state: "heat"
    attributes:
      current_temperature: 19.6
      temperature: 20.5
    area: "Woonkamer"

tests:
  - sentences:
      - "wat is de temperatuur"
      - "wat is de temperatuur in deze kamer"
      - "wat is hier de temperatuur"
      - "hoe warm is het"
      - "hoe warm is het hier"
    response: "19.6 graden"

  # target temperature
  - sentences:
      - "op hoeveel graden staat de verwarming"
      - "op hoeveel graden staat de verwarming ingesteld"
      - "op hoeveel graden is de thermostaat hier ingesteld"
      - "op welke temperatuur staat de thermostaat in deze kamer"
      - "hoe warm staat de verwarming"
      - "hoe hoog staat de verwarming hier"
      - "hoe is de thermostaat ingesteld"
      - "hoe koud staat de airco ingesteld"
      - "wat is de ingestelde temperatuur"
      - "wat is de doeltemperatuur hier"
      - "wat is hier de ingestelde temperatuur"
    response: "20.5 graden"
