---
# HassClimateGetTemperature - area_only

language: "nl"
areas:
  - name: "Woonkamer"
  - name: "Keuken"

entities:
  - name: "Thermostaat"
    domain: "climate"
    state: "heat"
    attributes:
      current_temperature: 19.6
      temperature: 20.5
    area: "Woonkamer"
  - name: "Keukenthermostaat"
    domain: "climate"
    state: "off"
    attributes:
      current_temperature: 18.0
    area: "Keuken"

tests:
  - sentences:
      - "Wat is de temperatuur in de woonkamer?"
      - "Hoe warm is het in de woonkamer?"
      - "Wat is de woonkamertemperatuur?"
      - "Hoeveel graden is het in de woonkamer?"
      - "Welke temperatuur is het in de woonkamer?"
      - "Hoe warm is de woonkamer?"
    slots:
      area: "Woonkamer"
    response: "19.6 graden"

  # target temperature
  - sentences:
      - "Op hoeveel graden staat de verwarming in de woonkamer?"
      - "Op hoeveel graden is de thermostaat in de woonkamer ingesteld?"
      - "Op welke temperatuur staat de thermostaat in de woonkamer ingesteld?"
      - "Hoe warm staat de verwarming in de woonkamer?"
      - "Hoe is de verwarming in de woonkamer ingesteld?"
      - "Hoe koud staat de airco in de woonkamer ingesteld?"
      - "Wat is de ingestelde temperatuur in de woonkamer?"
      - "Wat is de doeltemperatuur van de woonkamer?"
      - "Waar staat de verwarming in de woonkamer op?"
    slots:
      area: "Woonkamer"
    response: "20.5 graden"

  # no target temperature set
  - sentences:
      - "Op hoeveel graden staat de verwarming in de keuken?"
    slots:
      area: "Keuken"
    response: "Er is geen temperatuur ingesteld"
