---
# HassTurnOff - area_device_class_cover
# slots:
# - {area}
# - {domain}
# - {device_class}

language: "nl"
areas:
  - name: "Woonkamer"

tests:
  - sentences:
      - "Sluit het gordijn in de woonkamer"
      - "het gordijn in de woonkamer sluiten"
      - "doe het gordijn in de woonkamer dicht"
      - "doe in de woonkamer het gordijn dicht"
      - "sluit de gordijnen in de woonkamer"
      - "maak de gordijnen in de woonkamer naar beneden"
      - "de gordijnen in de woonkamer dicht"
      - "de gordijnen in de woonkamer dicht doen"
      - "sluit in de woonkamer de gordijnen"
      - "maak in de woonkamer de gordijnen dicht"
      - "in de woonkamer de gordijnen omlaag"
      - "in de woonkamer de gordijnen omlaag doen"
      - "sluit de woonkamer gordijnen"
      - "maak de woonkamer gordijnen omlaag"
      - "de woonkamer gordijnen naar beneden"
      - "de woonkamer gordijnen sluiten"
    slots:
      area: "Woonkamer"
      device_class: "curtain"
      domain: "cover"
    response: "Gesloten"

  - sentences:
      - "Sluit de rolluiken in de woonkamer"
      - "de rolluiken in de woonkamer dicht doen"
      - "Doe de rolluiken in de woonkamer naar beneden"
    slots:
      area: "Woonkamer"
      device_class: "shutter"
      domain: "cover"
    response: "Gesloten"
