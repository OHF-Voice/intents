---
# HassUnpauseTimer - minutes_only

language: nl
tests:
  - sentences:
      - "hervat 5 minuten timer"
      - "ga verder met timer van 5 minuten"
      - "5 minuten timer hervatten"
      - "hervat kookwekker van 5 minuten"
      - "ga verder met 5 minuten eierwekker"
    slots:
      start_minutes: 5
    response: "Timer hervat"
