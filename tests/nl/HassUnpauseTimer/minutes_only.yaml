---
# HassUnpauseTimer - minutes_only

language: nl
tests:
  - sentences:
      - "hervat 5 minuten timer"
      - "ga verder met timer van 5 minuten"
      - "5 minuten timer hervatten"
      - "hervat kookwekker van 5 minuten"
      - "ga verder met 5 minuten eierwekker"
      - "zet de 5 minuutjes timer weer aan"
      - "zet m'n eierwekker van 5 minuten weer aan"
      - "laat 5 minuten timer weer lopen"
      - "laat m'n kookwekker voor 5 minuten weer lopen"
      - "ga door met 5 minuten kookwekker"
      - "ga door met mijn eierwekker van 5 minuten"
      - "start de 5 minuten kookwekker weer"
      - "start timer van 5 minuutjes weer"
      - "m'n timer van 5 minuten weer aanzetten"
    slots:
      start_minutes: 5
    response: "Timer hervat"
