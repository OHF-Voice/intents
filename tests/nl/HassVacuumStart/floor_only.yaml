      - de stofzuiger op de eerste verdieping aanzetten
      - laat de stofzuiger op de eerste verdieping starten
      - zet de stofzuiger aan op de eerste verdieping
      - laat de stofzuiger op de eerste verdieping stofzuigen
      - laat de stofzuigrobot op de eerste verdieping schoonmaken
    slots:
      floor: Eerste Verdieping
    response: Gestart

  # floor used as an adverb
