language: as
floors:
  - name: ছেকেণ্ড মহলা
areas:
  - name: শোৱা কোঠা
    floor: ছেকেণ্ড মহলা
  - name: Lobby
    floor: প্ৰথম মহলা
entities:
  - name: Lobby Window
    domain: cover
    state: open
    area: Lobby
    attributes:
      device_class: window
  - name: শোৱা কোঠা খিৰিকী
    domain: cover
    state: open
    area: শোৱা কোঠা
    attributes:
      device_class: window
  - name: Nursery Window
    domain: cover
    state: closed
    area: শোৱা কোঠা
    attributes:
      device_class: window
tests:
  - sentences:
      - আছে কোনো ছেকেণ্ড মহলা খিৰিকীসমূহ খোলা
      - আছে কোনো খিৰিকীসমূহ খোলা ৰ ওপৰত ছেকেণ্ড মহলা
    slots:
      device_class: window
      state: open
      floor: ছেকেণ্ড মহলা
    response: হয়, শোৱা কোঠা খিৰিকী
  - sentences:
      - আছে সকলো ছেকেণ্ড মহলা খিৰিকীসমূহ বন্ধ
      - আছে সকলো খিৰিকীসমূহ বন্ধ ৰ ওপৰত ছেকেণ্ড মহলা
    slots:
      device_class: window
      state: closed
      floor: ছেকেণ্ড মহলা
    response: নহয়, শোৱা কোঠা খিৰিকী বন্ধ নহয়
  - sentences:
      - কোনটো ছেকেণ্ড মহলা খিৰিকীসমূহ আছে খোলা
      - কোনটো খিৰিকীসমূহ আছে খোলা ৰ ওপৰত ছেকেণ্ড মহলা
    slots:
      device_class: window
      state: open
      floor: ছেকেণ্ড মহলা
    response: শোৱা কোঠা খিৰিকী
  - sentences:
      - কিমান ছেকেণ্ড মহলা খিৰিকীসমূহ আছে খোলা
      - কিমান খিৰিকীসমূহ আছে খোলা ৰ ওপৰত ছেকেণ্ড মহলা
    slots:
      device_class: window
      state: open
      floor: ছেকেণ্ড মহলা
    response: "1"
