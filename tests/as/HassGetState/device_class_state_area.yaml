language: as
areas:
  - name: শোৱা কোঠা
  - name: Den
entities:
  - name: Den Window
    domain: cover
    state: open
    area: Den
    attributes:
      device_class: window
  - name: শোৱা কোঠা খিৰিকী
    domain: cover
    state: open
    area: শোৱা কোঠা
    attributes:
      device_class: window
  - name: Nursery Window
    domain: cover
    state: closed
    area: শোৱা কোঠা
    attributes:
      device_class: window
tests:
  - sentences:
      - আছে কোনো শোৱা কোঠা খিৰিকীসমূহ খোলা
      - আছে কোনো খিৰিকীসমূহ খোলা ত শোৱা কোঠা
    slots:
      device_class: window
      state: open
      area: শোৱা কোঠা
    response: হয়, শোৱা কোঠা খিৰিকী
  - sentences:
      - আছে সকলো শোৱা কোঠা খিৰিকীসমূহ বন্ধ
      - আছে সকলো খিৰিকীসমূহ বন্ধ ত শোৱা কোঠা
    slots:
      device_class: window
      state: closed
      area: শোৱা কোঠা
    response: নহয়, শোৱা কোঠা খিৰিকী বন্ধ নহয়
  - sentences:
      - কোনটো শোৱা কোঠা খিৰিকীসমূহ আছে খোলা
      - কোনটো খিৰিকীসমূহ আছে খোলা ত শোৱা কোঠা
    slots:
      device_class: window
      state: open
      area: শোৱা কোঠা
    response: শোৱা কোঠা খিৰিকী
  - sentences:
      - কিমান শোৱা কোঠা খিৰিকীসমূহ আছে খোলা
      - কিমান খিৰিকীসমূহ আছে খোলা ত শোৱা কোঠা
    slots:
      device_class: window
      state: open
      area: শোৱা কোঠা
    response: "1"
