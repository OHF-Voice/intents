language: zh-TW
tests:
  - sentences:
      - 把音量調大
      - 音量變大一點
    slots:
      volume_step: "up"
    response: "音量已調整"
  - sentences:
      - 音量小聲一點
    slots:
      volume_step: "down"
    response: "音量已調整"
  - sentences:
      - 把音量調高20%
      - 音量增加百分之20
    slots:
      volume_step: 20
    response: "音量已調整"
  - sentences:
      - 把音量調低20%
      - 音量降低百分之20
    slots:
      volume_step: -20
    response: "音量已調整"
